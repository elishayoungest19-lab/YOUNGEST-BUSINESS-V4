name: YOUNGEST'S BUSINESS V63 - RECEIPTS QR AND OPERATOR MARKS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yb-v63-receipts-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate V63 and deploy Hosting plus receipt verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and validate V63 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/YOUNGEST-BUSINESS-V63-RECEIPTS-QR-OPERATORS-SOURCE.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"

          DEST="$RUNNER_TEMP/yb-v63"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          test -s "$DEST/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          test -s "$DEST/app/build.gradle"
          test -s "$DEST/web-admin/index.html"
          test -s "$DEST/web-admin/app.js"
          test -s "$DEST/web-admin/styles.css"
          test -s "$DEST/web-admin/verify.html"
          test -s "$DEST/functions/index.js"
          test -s "$DEST/functions/package.json"
          test -s "$DEST/firebase.json"
          test -s "$DEST/.firebaserc"

          node --check "$DEST/web-admin/app.js"
          node --check "$DEST/functions/index.js"

          grep -q "verifyMobileMoneyReceipt" "$DEST/functions/index.js"
          grep -q "com.google.zxing:core" "$DEST/app/build.gradle"
          grep -Eq 'versionCode[[:space:]]+63' "$DEST/app/build.gradle"
          grep -Fq "1.63.0-branded-receipts-qr" "$DEST/app/build.gradle"

          V63_CHECK_ROOT="$DEST" node -e "
            const fs = require('fs');
            const path = require('path');
            const root = process.env.V63_CHECK_ROOT;

            const firebase = JSON.parse(
              fs.readFileSync(path.join(root, 'firebase.json'), 'utf8')
            );

            const firebaserc = JSON.parse(
              fs.readFileSync(path.join(root, '.firebaserc'), 'utf8')
            );

            if (firebase.hosting?.public !== 'web-admin')
              throw new Error('Firebase Hosting public folder must be web-admin');

            if (firebaserc.projects?.default !== 'youngestsbusiness')
              throw new Error('Wrong Firebase project in .firebaserc');

            console.log('Firebase configuration verified.');
          "

          echo "V63_ROOT=$DEST" >> "$GITHUB_ENV"
          echo "V63 source archive validated successfully."

      - name: Check Firebase service account secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          }

          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" |
            node -e "
              let s = '';
              process.stdin.on('data', d => s += d);
              process.stdin.on('end', () => {
                JSON.parse(s);
                console.log('Firebase service account JSON is valid.');
              });
            "

      - name: Install Functions dependencies
        working-directory: ${{ env.V63_ROOT }}/functions
        run: npm install --omit=dev

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Web Hosting and receipt verification function only
        working-directory: ${{ env.V63_ROOT }}
        run: |
          firebase deploy \
            --only hosting,functions:verifyMobileMoneyReceipt \
            --project youngestsbusiness \
            --non-interactive

      - name: Deployment summary
        run: |
          {
            echo "## YOUNGEST'S BUSINESS V63 deployment"
            echo "- Firebase Hosting: deployed"
            echo "- Receipt verification function: verifyMobileMoneyReceipt"
            echo "- Firestore rules: not deployed or changed"
            echo "- Android APK: not built by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
