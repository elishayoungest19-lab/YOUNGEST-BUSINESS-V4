name: YOUNGEST'S BUSINESS V63 - SPARK HOSTING ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yb-v63-spark-hosting
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate V63 and deploy Firebase Hosting only
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract V63 source archive
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/YOUNGEST-BUSINESS-V63-RECEIPTS-QR-OPERATORS-SOURCE.zip"

          if [ ! -s "$ZIP" ]; then
            echo "ERROR: V63 source ZIP not found."
            exit 1
          fi

          unzip -t "$ZIP"

          DEST="$RUNNER_TEMP/yb-v63"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          for FILE in \
            app/build.gradle \
            web-admin/index.html \
            web-admin/app.js \
            web-admin/styles.css \
            web-admin/verify.html \
            web-admin/logo_youngests_business.png \
            firebase.json \
            .firebaserc; do

            if [ ! -s "$DEST/$FILE" ]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
          done

          echo "V63_ROOT=$DEST" >> "$GITHUB_ENV"

          echo "V63 archive extracted successfully."

      - name: Validate V63 Web Admin
        shell: bash
        run: |
          set -euo pipefail

          node --check "$V63_ROOT/web-admin/app.js"

          grep -Eq 'versionCode[[:space:]]+63' \
            "$V63_ROOT/app/build.gradle"

          grep -Fq "1.63.0-branded-receipts-qr" \
            "$V63_ROOT/app/build.gradle"

          echo "Android V63 source version confirmed."
          echo "Web Admin JavaScript syntax is valid."

      - name: Validate Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          V63_ROOT="$V63_ROOT" node -e "
            const fs = require('fs');
            const path = require('path');
            const root = process.env.V63_ROOT;

            const firebase = JSON.parse(
              fs.readFileSync(path.join(root, 'firebase.json'), 'utf8')
            );

            const project = JSON.parse(
              fs.readFileSync(path.join(root, '.firebaserc'), 'utf8')
            );

            if (firebase.hosting?.public !== 'web-admin') {
              throw new Error('Incorrect Hosting public directory.');
            }

            if (project.projects?.default !== 'youngestsbusiness') {
              throw new Error('Incorrect Firebase project.');
            }

            console.log('Firebase project and Hosting configuration verified.');
          "

      - name: Check Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"

          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" |
            node -e "
              let input = '';
              process.stdin.on('data', data => input += data);
              process.stdin.on('end', () => {
                JSON.parse(input);
                console.log('Firebase credentials are valid.');
              });
            "

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting ONLY
        shell: bash
        working-directory: ${{ runner.temp }}/yb-v63
        run: |
          set -euo pipefail

          firebase deploy \
            --only hosting \
            --project youngestsbusiness \
            --non-interactive

      - name: Deployment summary
        run: |
          {
            echo "## YOUNGEST'S BUSINESS V63 - SPARK"
            echo "- Firebase Hosting: deployment requested"
            echo "- Android source: V63 validated"
            echo "- Cloud Functions: NOT deployed"
            echo "- Cloud Build: NOT requested"
            echo "- Artifact Registry: NOT requested"
            echo "- Firestore rules: NOT modified"
            echo "- Billing activation: NOT requested"
          } >> "$GITHUB_STEP_SUMMARY"
