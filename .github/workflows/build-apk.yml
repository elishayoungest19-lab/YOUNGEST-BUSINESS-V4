name: Build Android APK V20 Firebase Client Bureau Corrige

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK V20 Firebase Client Bureau Corrige
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================================
      # 🔥 V20 : SEUL ZIP AUTORISÉ
      # ==========================================================

      - name: Trouver UNIQUEMENT le ZIP V20 corrige
        shell: bash
        run: |
          set -e

          EXPECTED="YOUNGEST-BUSINESS-V20-FIREBASE-CLIENT-BUREAU-CORRIGE.zip"

          echo "=============================================="
          echo "RECHERCHE DU ZIP V20"
          echo "=============================================="
          echo "ZIP obligatoire :"
          echo "$EXPECTED"

          ZIP=$(find . -maxdepth 3 -type f -name "$EXPECTED" -print -quit)

          if [ -z "$ZIP" ]; then
            echo ""
            echo "ERREUR : LE ZIP V20 OBLIGATOIRE EST INTROUVABLE."
            echo ""
            echo "ZIP disponibles dans le depot :"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "ZIP V20 TROUVE :"
          echo "$ZIP"
          echo "=============================================="

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      # ==========================================================
      # 🔥 EXTRACTION V20
      # ==========================================================

      - name: Extraire le projet V20
        shell: bash
        run: |
          set -e

          rm -rf v20-extracted
          mkdir -p v20-extracted

          echo "Extraction du ZIP V20 :"
          echo "$ZIP_PATH"

          unzip -q "$ZIP_PATH" -d v20-extracted

          echo "Extraction V20 terminee."

      # ==========================================================
      # 🔥 DETECTION DU PROJET ANDROID
      # ==========================================================

      - name: Detecter le projet Android V20
        shell: bash
        run: |
          set -e

          PROJECT=$(find v20-extracted -type f -name "settings.gradle" -print -quit)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find v20-extracted -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : projet Android V20 introuvable."
            find v20-extracted -maxdepth 6 -type f -print | head -300
            exit 1
          fi

          ROOT=$(dirname "$PROJECT")

          echo "Projet Android V20 detecte :"
          echo "$ROOT"

          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

      # ==========================================================
      # 🔥 VERIFICATION IDENTITE V20
      # ==========================================================

      - name: Verifier identite V20
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          echo "=============================================="
          echo "VERIFICATION IDENTITE V20"
          echo "=============================================="

          grep -q "applicationId 'com.aistudio.youngestbiz.mbkz'" app/build.gradle
          grep -q "versionCode 20" app/build.gradle
          grep -q "versionName '1.14.0'" app/build.gradle

          echo "Application ID V20 OK."
          echo "versionCode 20 OK."
          echo "versionName 1.14.0 OK."

      # ==========================================================
      # 🔥 VERIFICATION CLIENT → FIREBASE → BUREAU
      # ==========================================================

      - name: Verifier synchronisation Client Firebase Bureau V20
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          JAVA="app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          RULES="firestore.rules"

          echo "=============================================="
          echo "VERIFICATION CIRCUIT CLIENT FIREBASE BUREAU"
          echo "=============================================="

          if [ ! -f "$JAVA" ]; then
            echo "ERREUR : MainActivity.java introuvable."
            exit 1
          fi

          if [ ! -f "$RULES" ]; then
            echo "ERREUR : firestore.rules introuvable."
            exit 1
          fi

          grep -q 'yb_loan_requests' "$JAVA"

          grep -q 'attachClientRequestsListener' "$JAVA"

          grep -q 'attachBureauRequestsListener' "$JAVA"

          grep -q 'q.clientId=clientUid' "$JAVA"

          grep -q 'requesterUid' "$JAVA"

          grep -q 'whereEqualTo("requesterUid", clientUid)' "$JAVA"

          grep -q 'signInWithEmailAndPassword' "$JAVA"

          grep -q 'addOnFailureListener' "$JAVA"

          grep -q 'status' "$JAVA"

          grep -q 'StxrZBDeUodj7YVPmXRA2AbWcUF2' "$RULES"

          grep -q 'request.resource.data.requesterUid == request.auth.uid' "$RULES"

          grep -q 'request.resource.data.clientId == request.auth.uid' "$RULES"

          grep -q 'request.resource.data.status == "EN_ATTENTE"' "$RULES"

          grep -q 'resource.data.requesterUid == request.auth.uid' "$RULES"

          echo ""
          echo "CLIENT UID : OK"
          echo "REQUESTER UID : OK"
          echo "STATUT EN_ATTENTE : OK"
          echo "AUTHENTIFICATION BUREAU : OK"
          echo "UID ADMIN FIREBASE : OK"
          echo "LISTENER CLIENT : OK"
          echo "LISTENER BUREAU : OK"
          echo ""
          echo "CIRCUIT V20 CLIENT → FIREBASE → BUREAU VERIFIE."

      # ==========================================================
      # 🔥 VERIFICATION FIREBASE
      # ==========================================================

      - name: Configurer Firebase V20
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if [ -f app/google-services.json ]; then
            echo "google-services.json deja present."

          elif [ -f google-services.json ]; then
            mkdir -p app
            cp google-services.json app/google-services.json
            echo "google-services.json copie."

          else
            echo "ERREUR : google-services.json introuvable."
            exit 1
          fi

      - name: Verifier Firebase Firestore V20
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          grep -R -q "FirebaseFirestore" app/src/main/java

          echo "FirebaseFirestore detecte."

      # ==========================================================
      # 🔐 KEYSTORE RELEASE
      # ==========================================================

      - name: Preparer le keystore Release V20
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$ANDROID_ROOT"

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          ALIAS=$(keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -v 2>/dev/null \
            | awk -F': ' '/Alias name:/ {print $2; exit}')

          if [ -z "$ALIAS" ]; then
            echo "ERREUR : alias du keystore introuvable."
            exit 1
          fi

          echo "Alias detecte : $ALIAS"

          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # ==========================================================
      # 🧹 CLEAN + BUILD V20
      # ==========================================================

      - name: Nettoyer le projet V20
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          gradle clean --no-daemon

      - name: Compiler APK V20 Release
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          gradle :app:assembleRelease --no-daemon

      # ==========================================================
      # 🔎 VERIFICATION APK V20
      # ==========================================================

      - name: Verifier APK V20
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_ROOT/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK V20 introuvable."
            exit 1
          fi

          echo "=============================================="
          echo "APK V20 TROUVE :"
          echo "$APK"
          echo "=============================================="

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "Signature APK V20 valide."

          echo ""
          echo "=============================================="
          echo "VERIFICATION VERSION APK"
          echo "=============================================="

          "$AAPT" dump badging "$APK" | grep -E \
            "package: name='com.aistudio.youngestbiz.mbkz' versionCode='20' versionName='1.14.0'"

          echo ""
          echo "VERSION APK 20 CONFIRMEE."

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================================
      # 📦 PREPARER L'ARTIFACT V20
      # ==========================================================

      - name: Preparer Artifact V20
        shell: bash
        run: |
          set -e

          mkdir -p final-apk

          cp "$APK_PATH" \
            "final-apk/YOUNGEST-BUSINESS-V20-FIREBASE-CLIENT-BUREAU-CORRIGE.apk"

          ls -lh final-apk/

      # ==========================================================
      # 📦 PUBLIER UNIQUEMENT L'ARTIFACT V20
      # ==========================================================

      - name: Publier Artifact V20
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V20-FIREBASE-CLIENT-BUREAU-CORRIGE
          path: final-apk/YOUNGEST-BUSINESS-V20-FIREBASE-CLIENT-BUREAU-CORRIGE.apk
          if-no-files-found: error
          retention-days: 30
