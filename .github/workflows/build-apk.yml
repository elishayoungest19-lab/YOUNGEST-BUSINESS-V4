name: "Build YOUNGEST'S BUSINESS V10 Firebase APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V10 Firebase"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4


      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: ""


      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation de platform-tools..."
          sdkmanager "platform-tools"

          echo "Installation de la plateforme Android 35..."
          sdkmanager "platforms;android-35"

          echo "Installation de Build Tools 35.0.0..."
          sdkmanager "build-tools;35.0.0"

          echo "Composants Android installés avec succès."


      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      - name: "Décompresser le projet V10 Firebase"
        shell: bash
        run: |
          set -e

          ZIP_FILE="./YOUNGEST-BUSINESS-V10-FIREBASE-PREPARE-1.zip"

          echo "Recherche du fichier V10 Firebase..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : le fichier V10 Firebase est introuvable."
            echo "Contenu du dépôt :"
            ls -lah
            exit 1
          fi

          echo "ZIP V10 trouvé :"
          ls -lh "$ZIP_FILE"

          echo "Nettoyage de l'ancien dossier d'extraction..."
          rm -rf ./v10-extracted

          echo "Création du dossier d'extraction..."
          mkdir -p ./v10-extracted

          echo "Décompression du projet V10..."
          unzip -o "$ZIP_FILE" -d ./v10-extracted

          echo "Projet V10 extrait avec succès."


      - name: "Détecter le projet Android"
        shell: bash
        run: |
          set -e

          echo "Recherche du projet Android..."

          if [ -d "./v10-extracted/v10-project" ]; then
            PROJECT_DIR="./v10-extracted/v10-project"

          elif [ -d "./v10-extracted/YOUNGEST-BUSINESS-V10-FIREBASE" ]; then
            PROJECT_DIR="./v10-extracted/YOUNGEST-BUSINESS-V10-FIREBASE"

          elif [ -f "./v10-extracted/settings.gradle" ]; then
            PROJECT_DIR="./v10-extracted"

          elif [ -f "./v10-extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="./v10-extracted"

          else
            PROJECT_DIR=$(find ./v10-extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERREUR : projet Android introuvable."
              echo "Fichiers trouvés :"
              find ./v10-extracted -maxdepth 5 -type f | head -100
              exit 1
            fi
          fi

          echo "Projet Android trouvé : $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERREUR : dossier app introuvable."
            exit 1
          fi

          echo "Dossier app trouvé."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT_DIR transmis aux prochaines étapes."


      - name: "Installer la configuration Firebase"
        shell: bash
        run: |
          set -e

          echo "Recherche de la configuration Firebase..."

          if [ -f "./google-services (2).json" ]; then
            FIREBASE_FILE="./google-services (2).json"

          elif [ -f "./google-services.json" ]; then
            FIREBASE_FILE="./google-services.json"

          else
            echo "ERREUR : aucun fichier google-services.json trouvé à la racine du dépôt."
            echo "Fichiers présents :"
            ls -lah
            exit 1
          fi

          echo "Configuration Firebase trouvée : $FIREBASE_FILE"

          echo "Création du fichier Firebase dans le module app..."

          mkdir -p "$PROJECT_DIR/app"

          rm -f "$PROJECT_DIR/app/google-services.json"

          cp "$FIREBASE_FILE" "$PROJECT_DIR/app/google-services.json"

          echo "google-services.json copié avec succès."

          echo "Vérification du fichier..."

          test -s "$PROJECT_DIR/app/google-services.json"

          echo "Firebase est correctement installé dans le projet Android."


      - name: "Vérifier la configuration du projet"
        shell: bash
        run: |
          set -e

          echo "Vérification du projet Android..."

          echo "Projet : $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "app/build.gradle trouvé."

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts trouvé."

          else
            echo "ERREUR : fichier Gradle du module app introuvable."
            exit 1
          fi

          echo "Vérification de Firebase..."

          test -f "$PROJECT_DIR/app/google-services.json"

          echo "google-services.json trouvé."

          echo "Projet Android prêt pour la compilation."


      - name: "Préparer la clé de signature"
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Préparation de la clé de signature..."

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          echo "Vérification de la clé..."

          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "youngest_business" > /dev/null

          echo "Clé de signature correcte."


      - name: "Construire l'APK V10 Firebase"
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "youngest_business"
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Vérification de Gradle..."

          gradle --version

          echo "Nettoyage du projet..."

          gradle clean

          echo "Compilation de l'APK Release Firebase..."

          gradle assembleRelease

          echo "Compilation terminée."

          echo "APK généré :"

          find app/build/outputs/apk/release \
            -type f \
            -maxdepth 2 \
            -print \
            -exec ls -lh {} \;


      - name: "Vérifier l'APK"
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : app-release.apk introuvable."
            exit 1
          fi

          echo "APK trouvé :"

          ls -lh "$APK"

          echo "Vérification de la signature..."

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "Signature APK valide."


      - name: "Publier l'APK V10 Firebase"
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V10-FIREBASE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
