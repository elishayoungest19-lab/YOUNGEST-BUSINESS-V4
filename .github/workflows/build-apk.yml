name: Build YOUNGEST'S BUSINESS V24 Payments and Transfers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract, build and verify V24 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V24 ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche du ZIP V24 dans le dépôt..."

          ZIP_PATH="$(find "$GITHUB_WORKSPACE" -type f \
            -iname '*V24*.zip' \
            ! -path '*/.git/*' \
            -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Aucun ZIP V24 trouvé dans le dépôt."
            echo "Vérifiez que le ZIP contenant le nouveau code V24 a été ajouté."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP sélectionné : $ZIP_PATH"

          mkdir -p "$RUNNER_TEMP/v24-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/v24-source"

          SETTINGS_PATH="$(find "$RUNNER_TEMP/v24-source" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_PATH" ]; then
            echo "::error::Aucun settings.gradle trouvé dans le ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_PATH")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projet Android : $PROJECT_DIR"

      - name: Verify V24 source and app version
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json introuvable."
            exit 1
          }

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          test -f "$BUILD_FILE" || {
            echo "::error::Fichier Gradle de l'application introuvable."
            exit 1
          }

          echo "=== Version déclarée ==="
          grep -nE 'versionCode|versionName' "$BUILD_FILE" || true

          echo "=== Vérification de l'interface V24 ==="
          grep -nE 'PAIEMENTS & TRANSFERTS|Envoyer de l’argent|Envoyer de l.argent|Historique|Rapports' "$MAIN" || true

          if ! grep -Eq 'versionCode[[:space:]]*=?[[:space:]]*24([^0-9]|$)' "$BUILD_FILE"; then
            echo "::error::Le code source doit déclarer versionCode 24."
            exit 1
          fi

          echo "Vérification de la version source terminée."

      - name: Prepare release signing
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secrets de signature manquants."
            echo "Configurez KEYSTORE_BASE64, KEYSTORE_PASSWORD et KEY_PASSWORD."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$PROJECT_DIR/release-keystore.jks"

          test -s "$PROJECT_DIR/release-keystore.jks"

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(keytool -list -v \
              -keystore "$PROJECT_DIR/release-keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | sed -n 's/^Alias name: //p' | head -n 1)"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Alias de signature introuvable. Configurez KEY_ALIAS."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean :app:assembleRelease --no-daemon
          else
            gradle clean :app:assembleRelease --no-daemon
          fi

      - name: Verify APK version and signature
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "::error::APK release introuvable."
            exit 1
          }

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | head -n 3

          echo "$BADGING" | grep -q "versionCode='24'" || {
            echo "::error::L'APK généré n'est pas en version 24."
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-apk/YOUNGEST-BUSINESS-V24-PAYMENTS-TRANSFERS-RELEASE.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-apk/YOUNGEST-BUSINESS-V24-PAYMENTS-TRANSFERS-RELEASE.apk" \
            | tee "$GITHUB_WORKSPACE/release-apk/SHA256SUMS.txt"

      - name: Upload verified V24 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V24-PAYMENTS-TRANSFERS-RELEASE
          path: release-apk/*
          if-no-files-found: error
          retention-days: 30
