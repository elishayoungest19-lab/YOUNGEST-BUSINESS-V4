name: Build YOUNGEST'S BUSINESS V23 Journal Mobile Money

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract, build and verify V23 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V23 ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-READY.zip"
          ZIP_PATH="$(find "$GITHUB_WORKSPACE" -type f -name "$ZIP_NAME" -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::ZIP V23 not found: $ZIP_NAME"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/v23-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/v23-source"

          SETTINGS_PATH="$(find "$RUNNER_TEMP/v23-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_PATH" ]; then
            echo "::error::No Gradle settings file found inside V23 ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_PATH")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | head -100

      - name: Verify V23 source and Firebase config
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          test -f "$MAIN"
          test -f "$PROJECT_DIR/app/google-services.json"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          test -f "$BUILD_FILE"

          echo "=== App version ==="
          grep -nE 'versionCode|versionName' "$BUILD_FILE"

          echo "=== Journal and transfer methods ==="
          grep -nE 'JOURNAL ENVOIS|moneyJournalForm|void transfers' "$MAIN" || true

          grep -q 'JOURNAL ENVOIS' "$MAIN" || {
            echo "::error::Journal label missing"
            exit 1
          }

          grep -q 'moneyJournalForm' "$MAIN" || {
            echo "::error::Journal form method missing"
            exit 1
          }

          grep -q 'void transfers' "$MAIN" || {
            echo "::error::Existing transfers method missing"
            exit 1
          }

          grep -q 'versionCode[[:space:]]\+23' "$BUILD_FILE" ||
          grep -q 'versionCode[[:space:]]*=[[:space:]]*23' "$BUILD_FILE" || {
            echo "::error::App versionCode is not 23"
            exit 1
          }

          echo "V23 source checks passed."

      - name: Prepare release signing
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] ||
             [ -z "${KEYSTORE_PASSWORD:-}" ] ||
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD."
            exit 1
          fi

          # IMPORTANT: the keystore must be placed where app/build.gradle expects it.
          echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/release-keystore.jks"
          test -s "$PROJECT_DIR/release-keystore.jks"

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(keytool -list -v \
              -keystore "$PROJECT_DIR/release-keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
              sed -n 's/^Alias name: //p' | head -n 1)"
          fi

          test -n "$ALIAS" || {
            echo "::error::Could not determine key alias. Configure KEY_ALIAS."
            exit 1
          }

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean :app:assembleRelease --no-daemon
          else
            gradle clean :app:assembleRelease --no-daemon
          fi

      - name: Verify APK version and signature
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "::error::Release APK not found."
            exit 1
          }

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | head -n 3

          echo "$BADGING" | grep -q "versionCode='23'" || {
            echo "::error::APK versionCode is not 23."
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk" \
            | tee "$GITHUB_WORKSPACE/release-apk/SHA256SUMS.txt"

      - name: Upload verified V23 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE
          path: release-apk/*
          if-no-files-found: error
          retention-days: 30
