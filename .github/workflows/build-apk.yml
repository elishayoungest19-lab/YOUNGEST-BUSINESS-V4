name: "Build YOUNGEST'S BUSINESS V10 Firebase APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V10 Firebase"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          echo "Installation des composants Android..."
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Composants Android installés."

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Décompresser le projet V10 Firebase"
        shell: bash
        run: |
          set -e

          ZIP_FILE="./YOUNGEST-BUSINESS-V10-FIREBASE-PREPARE-1.zip"

          echo "Recherche du fichier V10..."
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : le fichier V10 est introuvable."
            echo "Fichiers présents dans le dépôt :"
            ls -lah
            exit 1
          fi

          echo "ZIP V10 trouvé :"
          ls -lh "$ZIP_FILE"

          echo "Décompression du projet V10..."
          unzip -o "$ZIP_FILE" -d ./v10-project

          echo "Contenu du projet V10 :"
          ls -lah ./v10-project

      - name: "Préparer le projet Android"
        shell: bash
        run: |
          set -e

          cd ./v10-project

          echo "Vérification du fichier Firebase..."
          test -f app/google-services.json

          echo "Vérification du projet Android..."
          test -f app/build.gradle
          test -f settings.gradle

          echo "Projet V10 Firebase prêt."

      - name: "Préparer la clé de signature"
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          cd ./v10-project

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          echo "Clé de signature préparée."

      - name: "Construire l'APK V10 Firebase"
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd ./v10-project

          chmod +x gradlew

          echo "Nettoyage..."
          ./gradlew clean

          echo "Compilation de l'APK Release..."
          ./gradlew assembleRelease

          echo "APK généré :"
          ls -lh app/build/outputs/apk/release/

      - name: "Vérifier l'APK"
        shell: bash
        run: |
          set -e

          APK="./v10-project/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK trouvé :"
          ls -lh "$APK"

          echo "Vérification de la signature..."
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

          echo "Signature APK valide."

      - name: "Publier l'APK V10 Firebase"
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V10-FIREBASE
          path: ./v10-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
