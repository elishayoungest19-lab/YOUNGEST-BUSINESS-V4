name: Build YOUNGEST'S BUSINESS V28 Chat Notifications

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V28 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V28 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          ZIP_PATH=""
          for NAME in \
            "YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS-source.zip" \
            "YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS.zip"
          do
            ZIP_PATH="$(find "$ROOT" -maxdepth 5 -type f -name "$NAME" -print -quit)"
            [ -z "$ZIP_PATH" ] || break
          done
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::V28 source ZIP not found. Upload the V28 source ZIP to the repository."
            find "$ROOT" -type f -iname '*.zip' -print || true
            exit 1
          fi
          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/v28-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"
          SETTINGS="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS" || { echo "::error::Gradle settings file missing"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V28 source and notification backend
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          test -f "$MAIN" && test -f "$SERVICE" && test -f "$PROJECT_DIR/app/google-services.json"
          grep -Eq 'versionCode[[:space:]]+28([[:space:]]|$)' "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'Écrire votre message ici' "$MAIN"
          grep -Fq 'void contactPage()' "$MAIN"
          grep -Fq 'renderInlineClientChat' "$MAIN"
          if grep -Fq 'CHAT SERVICE CLIENT",BLUE); chat.setOnClickListener' "$MAIN"; then
            echo "::error::Standalone chat button is still present on the main/client dashboard."
            exit 1
          fi
          grep -Fq 'notifyClientOnAdminChatReply' "$PROJECT_DIR/functions/index.js"
          grep -Fq 'onDocumentCreated' "$PROJECT_DIR/functions/index.js"
          grep -Fq 'match /yb_chat_conversations/' "$PROJECT_DIR/firestore.rules"
          node --check "$PROJECT_DIR/functions/index.js"
          echo 'V28 source checks passed.'

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          ALIAS="${KEY_ALIAS:-}"
          if [ -z "$ALIAS" ]; then
            ALIAS="$(keytool -list -v -keystore release-keystore.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n 1)"
          fi
          test -n "$ALIAS" || { echo "::error::Set the KEY_ALIAS repository secret"; exit 1; }
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean :app:assembleRelease

      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Release APK missing"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | head -n 3
          echo "$BADGING" | grep -q "versionCode='28'" || { echo "::error::APK versionCode is not 28"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK" "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS.apk"
          sha256sum "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS.apk" > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      - name: Upload signed V28 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
