concurrency: name: Build YOUNGEST'S BUSINESS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Installer les composants Android nécessaires
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Décompresser le projet YOUNGEST'S BUSINESS V6
        shell: bash
        run: |
          set -e

          echo "Recherche automatique du ZIP V6..."

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name "YOUNGEST-BUSINESS-V6-*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun ZIP V6 trouvé."
            echo "Fichiers présents dans le dépôt :"
            ls -lah
            exit 1
          fi

          echo "ZIP V6 trouvé : $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP_FILE" -d extracted

          echo "Vérification de la structure..."

          if [ -f extracted/settings.gradle ]; then
            PROJECT_ROOT="extracted"
          else
            PROJECT_ROOT=$(find extracted -name settings.gradle \
              -type f -print -quit | xargs dirname)

            if [ -z "$PROJECT_ROOT" ]; then
              echo "ERREUR : settings.gradle introuvable."
              find extracted -maxdepth 4 -type f | sort
              exit 1
            fi
          fi

          echo "Projet Android trouvé dans : $PROJECT_ROOT"

          cp -a "$PROJECT_ROOT/app" .

          if [ -d "$PROJECT_ROOT/gradle" ]; then
            cp -a "$PROJECT_ROOT/gradle" .
          fi

          cp -a "$PROJECT_ROOT/build.gradle" .
          cp -a "$PROJECT_ROOT/settings.gradle" .

          if [ -f "$PROJECT_ROOT/gradle.properties" ]; then
            cp -a "$PROJECT_ROOT/gradle.properties" .
          fi

          echo "Projet Android préparé correctement."

      - name: Vérifier Gradle
        run: |
          gradle --version
          java --version

      - name: Nettoyer le projet
        run: |
          gradle --no-daemon clean

      - name: Construire l'APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Vérifier que l'APK existe
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
