name: Build YOUNGEST'S BUSINESS V28 Chat Notifications

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V28 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V28 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_PATH=""

          for NAME in \
            "YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS-source-CORRIGE-WORKFLOW-FIX.zip" \
            "YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS-source-CORRIGE.zip" \
            "YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS-source.zip" \
            "YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS.zip"
          do
            ZIP_PATH="$(find "$ROOT" -maxdepth 5 -type f -name "$NAME" -print -quit)"
            if [ -n "$ZIP_PATH" ]; then
              echo "ZIP trouvé : $ZIP_PATH"
              break
            fi
          done

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Aucun ZIP source V28 reconnu dans le dépôt."
            find "$ROOT" -type f -iname '*.zip' -print || true
            exit 1
          fi

          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v28-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Fichier settings.gradle introuvable dans le ZIP."
            find "$DEST" -maxdepth 4 -type f -print || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projet Android trouvé dans : $PROJECT_DIR"

      - name: Verify V28 source and chat backend
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          test -f "$MAIN" || { echo "::error::MainActivity.java introuvable"; exit 1; }
          test -f "$SERVICE" || { echo "::error::AppNotificationService.java introuvable"; exit 1; }
          test -f "$GRADLE" || { echo "::error::app/build.gradle introuvable"; exit 1; }
          test -f "$PROJECT_DIR/app/google-services.json" || { echo "::error::google-services.json introuvable"; exit 1; }
          test -f "$RULES" || { echo "::error::firestore.rules introuvable"; exit 1; }
          test -f "$FUNCTIONS" || { echo "::error::functions/index.js introuvable"; exit 1; }

          grep -Eq 'versionCode[[:space:]]+28([[:space:]]|$)' "$GRADLE"

          grep -Fq 'void contactPage()' "$MAIN"
          grep -Fq 'Écrire votre message ici' "$MAIN"
          grep -Fq 'openChatEntry()' "$MAIN"
          grep -Fq 'openChatConversation(String conversationId,boolean admin)' "$MAIN"
          grep -Fq 'adminChatInbox()' "$MAIN"
          grep -Fq 'PhoneAuthProvider.verifyPhoneNumber(options)' "$MAIN"

          grep -Fq 'FirebaseMessagingService' "$SERVICE"
          grep -Fq 'onMessageReceived' "$SERVICE"

          grep -Fq 'match /yb_chat_conversations/' "$RULES"
          grep -Fq 'match /yb_notification_tokens/' "$RULES"

          grep -Fq 'onDocumentCreated' "$FUNCTIONS"
          node --check "$FUNCTIONS"

          echo "Vérifications V28 réussies."

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secrets de signature manquants : KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(keytool -list -v \
              -keystore release-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | sed -n 's/^Alias name: //p' | head -n 1)"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Configure le secret KEY_ALIAS dans GitHub."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean :app:assembleRelease

      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "::error::APK release introuvable."
            exit 1
          }

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"

          echo "$BADGING" | head -n 3

          echo "$BADGING" | grep -q "versionCode='28'" || {
            echo "::error::Le versionCode de l'APK n'est pas 28."
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      - name: Upload signed V28 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V28-CHAT-NOTIFICATIONS
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
