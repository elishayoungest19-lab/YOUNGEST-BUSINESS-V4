name: Build YOUNGEST'S BUSINESS V30 Chat Robust

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V30 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V30 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_NAME="YOUNGEST-BUSINESS-V30-CHAT-ROBUST-source.zip"

          ZIP_PATH="$(find "$ROOT" \
            -maxdepth 5 \
            -type f \
            -name "$ZIP_NAME" \
            -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::ZIP V30 introuvable : $ZIP_NAME"
            echo "Fichiers ZIP trouvés dans le dépôt :"
            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -iname '*.zip' \
              -print || true
            exit 1
          fi

          echo "ZIP source V30 trouvé : $ZIP_PATH"

          echo "Vérification de l'archive..."
          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v30-source"
          mkdir -p "$DEST"

          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le ZIP V30."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projet Android V30 : $PROJECT_DIR"

      - name: Verify V30 source and chat components
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "=== Vérification des fichiers V30 ==="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json introuvable."
            exit 1
          }

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java introuvable."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js introuvable."
            exit 1
          }

          echo "Vérification versionCode 30..."

          grep -Eq \
            'versionCode[[:space:]]+30([[:space:]]|$)' \
            "$GRADLE" || {
              echo "::error::Le code source n'est pas en version 30."
              exit 1
            }

          echo "Vérification applicationId..."

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE" || {
              echo "::error::applicationId incorrect."
              exit 1
            }

          echo "Vérification du chat client..."

          grep -Fq 'void contactPage()' "$MAIN"
          grep -Fq 'Écrire votre message ici' "$MAIN"
          grep -Fq 'openChatEntry()' "$MAIN"
          grep -Fq 'openClientConversationWithDraft' "$MAIN"

          echo "Vérification de la boîte Admin..."

          grep -Fq 'adminChatInbox()' "$MAIN"

          echo "Vérification Phone Auth..."

          grep -Fq \
            'PhoneAuthProvider.verifyPhoneNumber(options)' \
            "$MAIN"

          echo "Vérification Firebase Messaging..."

          grep -Fq 'FirebaseMessagingService' "$SERVICE"
          grep -Fq 'onMessageReceived' "$SERVICE"

          echo "Vérification Firestore Chat..."

          grep -Fq \
            'match /yb_chat_conversations/' \
            "$RULES"

          grep -Fq \
            'match /yb_notification_tokens/' \
            "$RULES"

          echo "Vérification Cloud Functions..."

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS"

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS"

          node --check "$FUNCTIONS"

          echo ""
          echo "========================================="
          echo "   V30 SOURCE CHECKS PASSED"
          echo "========================================="

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then

            echo "::error::Secrets de signature manquants :"
            echo "::error::KEYSTORE_BASE64"
            echo "::error::KEYSTORE_PASSWORD"
            echo "::error::KEY_PASSWORD"

            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | \
            base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(keytool -list -v \
              -keystore release-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              2>/dev/null \
              | sed -n 's/^Alias name: //p' \
              | head -n 1)"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Configure le secret KEY_ALIAS dans GitHub."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          echo "Keystore Release configuré."

      - name: Build release APK V30
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Compilation de YOUNGEST'S BUSINESS V30..."

          gradle --no-daemon clean :app:assembleRelease

      - name: Verify APK signature, package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release introuvable après compilation."
            exit 1
          fi

          echo "=== Vérification signature APK ==="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "=== Vérification identité APK ==="

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging "$APK"
          )"

          echo "$BADGING" | head -n 5

          echo "$BADGING" | grep -q \
            "package: name='com.aistudio.youngestbiz.mbkz'" || {
              echo "::error::ApplicationId de l'APK incorrect."
              exit 1
            }

          echo "$BADGING" | grep -q \
            "versionCode='30'" || {
              echo "::error::La version de l'APK compilé n'est pas 30."
              exit 1
            }

          echo ""
          echo "Identité APK V30 validée."

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V30-CHAT-ROBUST.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V30-CHAT-ROBUST.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          echo ""
          echo "SHA256 :"
          cat "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      - name: Upload signed V30 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V30-CHAT-ROBUST
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
