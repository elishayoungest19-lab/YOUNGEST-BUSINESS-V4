name: Build YOUNGEST'S BUSINESS V37 Reports PDF + Journal Lumicash

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V37 REPORTS PDF + JOURNAL LUMICASH APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE DU VRAI ZIP V37
      # =========================================================
      - name: Find exact V37 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_NAME="YOUNGEST-BUSINESS-V37-REPORTS-PDF-JOURNAL-LUMICASH-source.zip"

          ZIP_PATH="$(find "$ROOT" -type f -name "$ZIP_NAME" -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Le ZIP V37 exact est introuvable."
            find "$ROOT" -type f -iname '*.zip' -print | sort || true
            exit 1
          fi

          echo "ZIP V37 EXACT TROUVE : $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v37-source"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le ZIP V37."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      # =========================================================
      # IDENTITE V37
      # =========================================================
      - name: Verify exact V37 identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="$PROJECT_DIR/app/build.gradle"

          grep -Eq 'versionCode[[:space:]]+37([[:space:]]|$)' "$GRADLE" || {
            echo "::error::versionCode 37 absent."
            exit 1
          }

          grep -Fq "versionName '1.30.0'" "$GRADLE" || {
            echo "::error::versionName 1.30.0 absent."
            exit 1
          }

          grep -Fq "applicationId 'com.aistudio.youngestbiz.mbkz'" "$GRADLE" || {
            echo "::error::applicationId incorrect."
            exit 1
          }

          grep -Fq "namespace 'com.aistudio.youngestbiz.mbkz'" "$GRADLE" || {
            echo "::error::namespace incorrect."
            exit 1
          }

          echo "V37 / 1.30.0 / applicationId : OK"

      # =========================================================
      # FICHIERS PROJET
      # =========================================================
      - name: Verify V37 project files
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"
          GOOGLE="$PROJECT_DIR/app/google-services.json"

          for file in "$MAIN" "$SERVICE" "$RULES" "$FUNCTIONS" "$GOOGLE"; do
            test -f "$file" || { echo "::error::Fichier manquant : $file"; exit 1; }
          done

          echo "Fichiers Firebase/Android : OK"

      # =========================================================
      # PROTECTION INTERFACE ADMIN
      # =========================================================
      - name: Verify existing Admin Cards interface
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          for label in \
            'TABLEAU DE BORD' \
            'GESTION DES CLIENTS' \
            'GESTION DES PRÊTS' \
            'REMBOURSEMENTS' \
            'DEMANDES DE PRÊTS CLIENTS' \
            'CONTACTEZ-NOUS' \
            'JOURNAL LUMICASH'
          do
            grep -Fq "$label" "$MAIN" || {
              echo "::error::Carte $label absente."
              exit 1
            }
          done

          echo "INTERFACE ADMIN CARDS PRESERVEE : OK"

      # =========================================================
      # RAPPORT MENSUEL -> VRAI PDF
      # =========================================================
      - name: Verify monthly report real PDF export
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          for check in \
            'CREATE_REPORT_PDF' \
            'pendingReportPdfText' \
            'pendingReportPdfName' \
            'ACTION_CREATE_DOCUMENT' \
            'application/pdf' \
            'writeTextPdf(uri,pendingReportPdfText' \
            'GÉNÉRER / EXPORTER CE RAPPORT'
          do
            grep -Fq "$check" "$MAIN" || {
              echo "::error::Export PDF du rapport mensuel incomplet : $check"
              exit 1
            }
          done

          if grep -Fq 'Intent.ACTION_SEND' "$MAIN"; then
            echo "::error::Ancien export texte Intent.ACTION_SEND encore présent dans MainActivity."
            exit 1
          fi

          echo "RAPPORTS MENSUELS -> VRAI PDF : OK"

      # =========================================================
      # JOURNAL LUMICASH V37
      # =========================================================
      - name: Verify Journal Lumicash V37
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          RULES="$PROJECT_DIR/firestore.rules"

          for check in \
            'lumicashJournalPage()' \
            'lumicashAgentPage(' \
            'lumicashForm(' \
            'LUMICASH_AGENT_1 = "ELISHA YOUNGEST"' \
            'LUMICASH_AGENT_2 = "BLESSING"' \
            'LUMICASH_COLLECTION = "yb_lumicash_journal"' \
            'Rapport journalier — aujourd'hui' \
            'Rapport mensuel — ce mois' \
            'Numéro du client' \
            'Frais de dépôt' \
            'HISTORIQUE DES TRANSACTIONS' \
            'EXPORTER LE RAPPORT EN PDF' \
            'uploadLumicashEntry' \
            'loadLumicashCloud'
          do
            grep -Fq "$check" "$MAIN" || {
              echo "::error::Fonction Journal Lumicash manquante : $check"
              exit 1
            }
          done

          grep -Fq 'match /yb_lumicash_journal/' "$RULES" || {
            echo "::error::Règle Firestore Journal Lumicash absente."
            exit 1
          }

          grep -Fq 'allow read, create, update, delete: if isAdmin();' "$RULES" || {
            echo "::error::Accès Firestore Journal Lumicash incorrect."
            exit 1
          }

          echo "JOURNAL LUMICASH V37 : OK"

      # =========================================================
      # CHAT CLIENT -> ADMIN
      # =========================================================
      - name: Verify V37 client chat delivery preservation
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          for check in \
            'persistPendingChatDraft' \
            'openChatEntry()' \
            'requestChatPhoneNumber()' \
            'signInAnonymously' \
            'KEY_PENDING_CHAT_PHONE' \
            'openOrCreateClientConversation()' \
            'whereEqualTo("ownerUid"' \
            'createConversationAndSendDraft' \
            'conversation.set(c)' \
            'message.set(msg)' \
            'msg.put("ownerUid",user.getUid())'
          do
            grep -Fq "$check" "$MAIN" || {
              echo "::error::$check absent."
              exit 1
            }
          done

          if grep -Fq 'transaction.get(conversation)' "$MAIN"; then
            echo "::error::Ancienne transaction client encore présente."
            exit 1
          fi

          echo "ENVOI CLIENT DIRECT + ownerUid : OK"

      # =========================================================
      # CHAT ADMIN -> CLIENT
      # =========================================================
      - name: Verify V37 admin reply delivery preservation
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          for check in \
            'adminChatInbox()' \
            'adminConversation.get()' \
            'm.put("ownerUid",ownerUid)' \
            'm.put("senderRole","admin")'
          do
            grep -Fq "$check" "$MAIN" || {
              echo "::error::$check absent dans le code V37."
              exit 1
            }
          done

          echo "REPONSE ADMIN AVEC ownerUid : OK"

      # =========================================================
      # FIRESTORE RULES
      # =========================================================
      - name: Verify V37 Firestore chat rules
        shell: bash
        run: |
          set -euo pipefail
          RULES="$PROJECT_DIR/firestore.rules"

          for check in \
            'function isSignedIn()' \
            'function isAdmin()' \
            'StxrZBDeUodj7YVPmXRA2AbWcUF2' \
            'elishayoungest19@gmail.com' \
            'match /yb_chat_conversations/' \
            'match /messages/{messageId}' \
            'request.resource.data.senderUid == request.auth.uid' \
            'request.resource.data.ownerUid == request.auth.uid' \
            'request.resource.data.senderRole == "client"' \
            'request.resource.data.senderRole == "admin"'
          do
            grep -Fq "$check" "$RULES" || {
              echo "::error::Rule manquante : $check"
              exit 1
            }
          done

          echo "RULES CHAT V37 : OK"

      # =========================================================
      # NOTIFICATIONS
      # =========================================================
      - name: Verify Firebase notifications
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          grep -Fq 'FirebaseMessagingService' "$SERVICE" || exit 1
          grep -Fq 'onMessageReceived' "$SERVICE" || exit 1
          grep -Fq 'onDocumentCreated' "$FUNCTIONS" || exit 1
          grep -Fq 'notifyClientWhenAdminReplies' "$FUNCTIONS" || exit 1
          node --check "$FUNCTIONS"

          echo "NOTIFICATIONS FIREBASE : OK"

      # =========================================================
      # SIGNATURE : UTILISE LE SYSTEME DU VRAI build.gradle V37
      # =========================================================
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 manquant."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD manquant."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD manquant."; exit 1; }

          KEYSTORE_FILE="$PROJECT_DIR/release-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE" || { echo "::error::Keystore vide/invalide."; exit 1; }
          chmod 600 "$KEYSTORE_FILE"

          KEY_ALIAS="$(keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | awk -F': ' '/^Alias name:/{print $2; exit}')"

          test -n "$KEY_ALIAS" || {
            echo "::error::Impossible de récupérer l'alias du keystore."
            exit 1
          }

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

          echo "Keystore : OK"
          echo "Alias récupéré automatiquement : $KEY_ALIAS"

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build signed V37 APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleRelease --stacktrace

      # =========================================================
      # VERIFICATION APK
      # =========================================================
      - name: Verify generated V37 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::APK release introuvable."; exit 1; }

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"

          echo "$BADGING" | grep -Fq "package: name='com.aistudio.youngestbiz.mbkz'" || exit 1
          echo "$BADGING" | grep -Fq "versionCode='37'" || exit 1
          echo "$BADGING" | grep -Fq "versionName='1.30.0'" || exit 1

          echo "APK package/version/signature : OK"

      # =========================================================
      # ARTIFACT
      # =========================================================
      - name: Prepare final V37 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
             "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V37-REPORTS-PDF-JOURNAL-LUMICASH.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V37-REPORTS-PDF-JOURNAL-LUMICASH.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      - name: Upload signed V37 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V37-REPORTS-PDF-JOURNAL-LUMICASH
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Final V37 verification
        shell: bash
        run: |
          echo "=============================================="
          echo "       YOUNGEST'S BUSINESS V37"
          echo "=============================================="
          echo "ADMIN CARDS : PRESERVEES"
          echo "CLIENT -> ADMIN : CORRIGE"
          echo "ADMIN -> CLIENT : CORRIGE"
          echo "ownerUid DES DEUX COTES : VERIFIE"
          echo "FIRESTORE RULES : VERIFIEES"
          echo "NOTIFICATIONS : VERIFIEES"
          echo "APK SIGNE : VERIFIE"
          echo "VERSION : 37 / 1.30.0"
          echo "BUILD V37 TERMINE AVEC SUCCES."
