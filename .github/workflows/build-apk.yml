
name: Build Android APK V22 Rapports Mensuels

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK V22
    runs-on: ubuntu-latest

    steps:
      # 1. Recuperer le depot
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # 2. Installer Java 17
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Installer Android SDK
      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 4. Ajouter les outils Android au PATH
      - name: Configurer Android Build Tools
        shell: bash
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$BUILD_TOOLS/apksigner"
          test -f "$BUILD_TOOLS/aapt"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      # 5. Installer Gradle
      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Trouver le ZIP V22
      - name: Trouver le ZIP V22 Rapports Mensuels
        shell: bash
        run: |
          set -e
          ZIP_NAME="YOUNGEST-BUSINESS-V22-RAPPORTS-MENSUELS.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERREUR : ZIP V22 introuvable a la racine du depot."
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP V22 selectionne : $ZIP_NAME"
          ls -lh "$ZIP_NAME"
          echo "ZIP_PATH=$ZIP_NAME" >> "$GITHUB_ENV"

      # 7. Extraire le projet V22
      - name: Extraire le projet V22
        shell: bash
        run: |
          set -e
          rm -rf v22-extracted
          mkdir -p v22-extracted
          unzip -q "$ZIP_PATH" -d v22-extracted

          echo "Contenu extrait :"
          find v22-extracted -maxdepth 3 -type f | head -100

      # 8. Detecter le projet Android
      - name: Detecter le projet Android V22
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find v22-extracted \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERREUR : projet Gradle Android introuvable dans le ZIP V22."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERREUR : app/google-services.json introuvable."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERREUR : configuration Gradle du module app introuvable."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android V22 detecte : $PROJECT_DIR"

      # 9. Verifier le contenu du projet
      - name: Verifier le projet V22
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Configuration de l'application :"
          grep -nE "applicationId|versionCode|versionName" \
            app/build.gradle app/build.gradle.kts 2>/dev/null || true

          echo "Recherche des fonctionnalites de rapports :"
          grep -RniE "rapport|report|echeance|échéance" \
            app/src/main 2>/dev/null | head -80 || true

          echo "Verification du projet terminee."

      # 10. Preparer le keystore de signature
      - name: Preparer le keystore Release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERREUR : secret KEYSTORE_BASE64 absent."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERREUR : secret KEYSTORE_PASSWORD absent."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERREUR : secret KEY_PASSWORD absent."
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$PROJECT_DIR/release-keystore.jks"

          keytool -list \
            -keystore "$PROJECT_DIR/release-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null

          KEY_ALIAS=$(keytool -list -v \
            -keystore "$PROJECT_DIR/release-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep "Alias name:" | head -1 \
            | sed 's/.*Alias name: //')

          test -n "$KEY_ALIAS" || {
            echo "ERREUR : alias du keystore introuvable."
            exit 1
          }

          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "Keystore configure."

      # 11. Nettoyer le projet
      - name: Nettoyer le projet V22
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean
          else
            gradle clean
          fi

      # 12. Compiler l'APK V22
      - name: Compiler APK V22 Release
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            gradle :app:assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          fi

      # 13. Verifier et preparer l'APK
      - name: Verifier APK V22
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK Release introuvable."
            exit 1
          fi

          apksigner verify --verbose "$APK"

          APK_INFO=$(aapt dump badging "$APK")
          echo "$APK_INFO" | head -5

          echo "$APK_INFO" | grep \
            "package: name='com.aistudio.youngestbiz.mbkz'" || {
              echo "ERREUR : applicationId inattendu."
              exit 1
            }

          mkdir -p release-v22
          cp "$APK" \
            release-v22/YOUNGEST-BUSINESS-V22-RAPPORTS-MENSUELS.apk

          echo "APK V22 prepare avec succes."
          ls -lh release-v22/

      # 14. Publier le veritable Artifact V22
      - name: Publier Artifact V22
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V22-RAPPORTS-MENSUELS
          path: release-v22/YOUNGEST-BUSINESS-V22-RAPPORTS-MENSUELS.apk
          if-no-files-found: error
          retention-days: 14
