name: "Build YOUNGEST'S BUSINESS V8 APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V8"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4


      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: ""


      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"


      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation des composants Android..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Composants Android installés."


      - name: "Décompresser le projet V8"
        shell: bash
        run: |
          set -e

          ZIP_FILE="./YOUNGEST-BUSINESS-V8-SECURISEE.zip"

          echo "Recherche du fichier V8..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : le fichier V8 est introuvable."
            ls -lh
            exit 1
          fi

          echo "ZIP V8 trouvé."

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/settings.gradle" ]; then
            echo "ERREUR : settings.gradle introuvable."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Projet Android V8 détecté."

          rm -rf app
          rm -rf gradle

          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties

          cp -a extracted/app .
          cp -a extracted/gradle .
          cp -a extracted/build.gradle .
          cp -a extracted/settings.gradle .
          cp -a extracted/gradle.properties .

          echo "Projet V8 préparé."


      - name: "Vérifier Gradle"
        shell: bash
        run: |
          set -e
          gradle --version


      - name: "Nettoyer le projet"
        shell: bash
        run: |
          set -e
          gradle --no-daemon clean


      - name: "Construire l'APK Release"
        shell: bash
        run: |
          set -e

          echo "Construction de la version Release V8..."

          gradle --no-daemon assembleRelease --stacktrace

          echo "Recherche de l'APK Release..."

          find app/build/outputs/apk -type f -name "*.apk" -print


      - name: "Préparer la clé de signature"
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Décodage du keystore..."

          echo "$KEYSTORE_BASE64" | base64 --decode > youngest-business-release.jks

          chmod 600 youngest-business-release.jks

          echo "Keystore préparé."


      - name: "Signer l'APK V8"
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APK_UNSIGNED=$(find app/build/outputs/apk -type f -name "*-unsigned.apk" | head -n 1)

          if [ -z "$APK_UNSIGNED" ]; then
            echo "APK Release non signé introuvable."

            echo "APK disponibles :"
            find app/build/outputs/apk -type f -name "*.apk" -print

            exit 1
          fi

          echo "APK Release trouvé : $APK_UNSIGNED"

          mkdir -p signed

          ZIPALIGNED_APK="signed/YOUNGEST-BUSINESS-V8-aligned.apk"
          FINAL_APK="signed/YOUNGEST-BUSINESS-V8.apk"

          echo "Alignement de l'APK..."

          zipalign \
            -p \
            4 \
            "$APK_UNSIGNED" \
            "$ZIPALIGNED_APK"

          echo "Signature de l'APK..."

          apksigner sign \
            --ks youngest-business-release.jks \
            --ks-key-alias youngest_business \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$FINAL_APK" \
            "$ZIPALIGNED_APK"

          echo "Vérification de la signature..."

          apksigner verify \
            --verbose \
            "$FINAL_APK"

          echo "Signature V8 validée."


      - name: "Afficher l'APK final"
        shell: bash
        run: |
          set -e

          echo "APK FINAL :"

          ls -lh signed/YOUNGEST-BUSINESS-V8.apk

          test -f signed/YOUNGEST-BUSINESS-V8.apk

          echo ""
          echo "YOUNGEST'S BUSINESS V8 est prêt."


      - name: "Publier l'APK V8"
        uses: actions/upload-artifact@v4
        with:
          name: "YOUNGEST-BUSINESS-V8-RELEASE"
          path: "signed/YOUNGEST-BUSINESS-V8.apk"
          if-no-files-found: error
