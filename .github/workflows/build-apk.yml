name: Build YOUNGEST'S BUSINESS V34 Chat Persistent Delivery

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V34 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE ET EXTRACTION DU SOURCE V34
      # =========================================================

      - name: Find and extract V34 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_PATH=""

          echo "========================================="
          echo "     RECHERCHE DU SOURCE V34"
          echo "========================================="

          ZIP_PATH="$(
            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -iname 'YOUNGEST-BUSINESS-V34-CHAT-PERSISTENT-DELIVERY-source*.zip' \
              -print \
              | sort \
              | tail -n 1
          )"

          if [ -z "$ZIP_PATH" ]; then
            echo ""
            echo "::error::ZIP source V34 introuvable."

            echo ""
            echo "Fichiers ZIP présents dans le dépôt :"

            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -iname '*.zip' \
              -print || true

            exit 1
          fi

          echo ""
          echo "ZIP source V34 trouvé :"
          echo "$ZIP_PATH"

          # -----------------------------------------------------
          # VERIFICATION DE L'ARCHIVE
          # -----------------------------------------------------

          echo ""
          echo "Vérification de l'archive V34..."

          unzip -t "$ZIP_PATH"

          # -----------------------------------------------------
          # EXTRACTION
          # -----------------------------------------------------

          DEST="$RUNNER_TEMP/v34-source"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction du projet V34..."

          unzip -q "$ZIP_PATH" -d "$DEST"

          # -----------------------------------------------------
          # DETECTION DU PROJET ANDROID
          # -----------------------------------------------------

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le ZIP V34."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android V34 détecté :"
          echo "$PROJECT_DIR"

      # =========================================================
      # VERIFICATION DU SOURCE V34
      # =========================================================

      - name: Verify V34 source and chat components
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "========================================="
          echo "        VERIFICATION SOURCE V34"
          echo "========================================="

          # -----------------------------------------------------
          # FICHIERS PRINCIPAUX
          # -----------------------------------------------------

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json introuvable."
            exit 1
          }

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java introuvable."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js introuvable."
            exit 1
          }

          echo "OK : fichiers principaux présents."

          # -----------------------------------------------------
          # VERSION CODE 34
          # -----------------------------------------------------

          grep -Eq \
            'versionCode[[:space:]]+34([[:space:]]|$)' \
            "$GRADLE" || {

            echo "::error::Le code source n'est pas en version 34."

            grep -n "versionCode" "$GRADLE" || true

            exit 1
          }

          echo "OK : versionCode 34."

          # -----------------------------------------------------
          # VERSION NAME
          # -----------------------------------------------------

          grep -Fq \
            "versionName '1.27.0'" \
            "$GRADLE" || {

            echo "::error::versionName 1.27.0 introuvable."

            grep -n "versionName" "$GRADLE" || true

            exit 1
          }

          echo "OK : versionName 1.27.0."

          # -----------------------------------------------------
          # APPLICATION ID
          # -----------------------------------------------------

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE" || {

            echo "::error::applicationId incorrect."
            exit 1
          }

          echo "OK : applicationId correct."

          # -----------------------------------------------------
          # CHAT CLIENT
          # -----------------------------------------------------

          grep -Fq \
            'void contactPage()' \
            "$MAIN" || {

            echo "::error::contactPage() introuvable."
            exit 1
          }

          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {

            echo "::error::openChatEntry() introuvable."
            exit 1
          }

          grep -Fq \
            'openClientConversationWithDraft' \
            "$MAIN" || {

            echo "::error::openClientConversationWithDraft introuvable."
            exit 1
          }

          echo "OK : parcours Chat client."

          # -----------------------------------------------------
          # PERSISTANCE DU BROUILLON
          # -----------------------------------------------------

          grep -Fq \
            'SharedPreferences' \
            "$MAIN" || {

            echo "::error::SharedPreferences introuvable."
            exit 1
          }

          grep -Fq \
            'KEY_PENDING_CHAT_DRAFT' \
            "$MAIN" || {

            echo "::error::KEY_PENDING_CHAT_DRAFT introuvable."
            exit 1
          }

          echo "OK : persistance du brouillon Chat."

          # -----------------------------------------------------
          # TRANSACTION FIRESTORE
          # -----------------------------------------------------

          grep -Fq \
            'firestore.runTransaction' \
            "$MAIN" || {

            echo "::error::Transaction Firestore introuvable."
            exit 1
          }

          echo "OK : transaction Firestore."

          # -----------------------------------------------------
          # FIREBASE AUTH
          # -----------------------------------------------------

          grep -Fq \
            'firebaseAuth.signOut()' \
            "$MAIN" || {

            echo "::error::firebaseAuth.signOut() introuvable."
            exit 1
          }

          echo "OK : déconnexion Firebase."

          # -----------------------------------------------------
          # PHONE AUTH
          # -----------------------------------------------------

          grep -Fq \
            'PhoneAuthProvider.verifyPhoneNumber(options)' \
            "$MAIN" || {

            echo "::error::Phone Authentication introuvable."
            exit 1
          }

          echo "OK : Firebase Phone Authentication."

          # -----------------------------------------------------
          # ADMIN CHAT
          # -----------------------------------------------------

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {

            echo "::error::adminChatInbox() introuvable."
            exit 1
          }

          echo "OK : boîte Admin."

          # -----------------------------------------------------
          # ADMIN EMAIL
          # -----------------------------------------------------

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$MAIN" || {

            echo "::error::Gmail Admin introuvable dans MainActivity."
            exit 1
          }

          echo "OK : Gmail Admin."

          # -----------------------------------------------------
          # FIREBASE MESSAGING
          # -----------------------------------------------------

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {

            echo "::error::FirebaseMessagingService introuvable."
            exit 1
          }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {

            echo "::error::onMessageReceived introuvable."
            exit 1
          }

          echo "OK : Firebase Messaging."

          # -----------------------------------------------------
          # FIRESTORE CHAT
          # -----------------------------------------------------

          grep -Fq \
            'match /yb_chat_conversations/' \
            "$RULES" || {

            echo "::error::Règle yb_chat_conversations introuvable."
            exit 1
          }

          grep -Fq \
            'match /yb_notification_tokens/' \
            "$RULES" || {

            echo "::error::Règle yb_notification_tokens introuvable."
            exit 1
          }

          echo "OK : règles Firestore Chat."

          # -----------------------------------------------------
          # CLOUD FUNCTIONS
          # -----------------------------------------------------

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {

            echo "::error::onDocumentCreated introuvable."
            exit 1
          }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {

            echo "::error::notifyClientWhenAdminReplies introuvable."
            exit 1
          }

          node --check "$FUNCTIONS"

          echo "OK : Cloud Functions."

          echo ""
          echo "========================================="
          echo "       V34 SOURCE CHECKS PASSED"
          echo "========================================="

      # =========================================================
      # CONFIGURATION DE LA SIGNATURE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          echo "========================================="
          echo "      CONFIGURATION SIGNATURE V34"
          echo "========================================="

          cd "$PROJECT_DIR"

          # -----------------------------------------------------
          # VERIFICATION DES SECRETS
          # -----------------------------------------------------

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD manquant."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secret KEY_PASSWORD manquant."
            exit 1
          fi

          echo "OK : secrets principaux présents."

          # -----------------------------------------------------
          # CREATION DU KEYSTORE
          # -----------------------------------------------------

          printf '%s' "$KEYSTORE_BASE64" | \
            base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "::error::Le keystore n'a pas pu être créé."
            exit 1
          fi

          echo "OK : keystore Release créé."

          # -----------------------------------------------------
          # DETECTION DE L'ALIAS
          # -----------------------------------------------------

          ALIAS="${KEY_ALIAS:-}"

          if [ -n "$ALIAS" ]; then

            echo "KEY_ALIAS fourni par GitHub."
            echo "Vérification de l'alias..."

          else

            echo "KEY_ALIAS non fourni."
            echo "Détection automatique de l'alias du keystore..."

            KEYTOOL_VERBOSE="$RUNNER_TEMP/keytool-verbose.txt"
            KEYTOOL_SIMPLE="$RUNNER_TEMP/keytool-simple.txt"

            rm -f \
              "$KEYTOOL_VERBOSE" \
              "$KEYTOOL_SIMPLE"

            # -------------------------------------------------
            # PREMIERE METHODE : keytool -list -v
            # -------------------------------------------------

            keytool \
              -list \
              -v \
              -keystore release-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              > "$KEYTOOL_VERBOSE" 2>&1 || true

            ALIAS="$(
              sed -n \
                's/^[[:space:]]*Alias name:[[:space:]]*//p' \
                "$KEYTOOL_VERBOSE" \
                | head -n 1
            )"

            ALIAS="$(printf '%s' "$ALIAS" | xargs || true)"

            # -------------------------------------------------
            # DEUXIEME METHODE :
            # keytool -list simple
            #
            # Cette méthode corrige le problème observé
            # lorsque Alias name n'apparaît pas dans la sortie.
            # -------------------------------------------------

            if [ -z "$ALIAS" ]; then

              echo "Alias non trouvé avec la sortie détaillée."
              echo "Tentative avec la sortie simple de keytool..."

              if keytool \
                -list \
                -keystore release-keystore.jks \
                -storepass "$KEYSTORE_PASSWORD" \
                > "$KEYTOOL_SIMPLE" 2>&1
              then

                ALIAS="$(
                  awk -F',' '
                    /PrivateKeyEntry|SecretKeyEntry/ {
                      gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                      print $1
                      exit
                    }
                  ' "$KEYTOOL_SIMPLE"
                )"

                ALIAS="$(printf '%s' "$ALIAS" | xargs || true)"

              fi

            fi

            # -------------------------------------------------
            # TROISIEME METHODE :
            # rechercher une ligne d'entrée du keystore
            # -----------------------------------------------------

            if [ -z "$ALIAS" ]; then

              echo "Alias toujours introuvable."
              echo "Recherche avancée dans la sortie keytool..."

              ALIAS="$(
                grep \
                  -E \
                  ',[[:space:]]*(PrivateKeyEntry|SecretKeyEntry)[[:space:]]*$' \
                  "$KEYTOOL_SIMPLE" \
                  | head -n 1 \
                  | cut -d',' -f1 \
                  | xargs || true
              )

            fi

          fi

          # -----------------------------------------------------
          # VERIFICATION DE L'ALIAS
          # -----------------------------------------------------

          if [ -z "$ALIAS" ]; then

            echo "::error::Impossible de détecter l'alias du keystore."

            echo ""
            echo "===== SORTIE KEYTOOL DETAILLEE ====="

            cat "$KEYTOOL_VERBOSE" || true

            echo ""
            echo "===== SORTIE KEYTOOL SIMPLE ====="

            cat "$KEYTOOL_SIMPLE" || true

            echo ""
            echo "::error::Le keystore contient probablement un alias,"
            echo "::error::mais celui-ci n'a pas pu être détecté automatiquement."

            exit 1
          fi

          echo "OK : alias Release détecté."
          echo "Alias détecté : $ALIAS"

          # -----------------------------------------------------
          # VERIFICATION FINALE DE L'ALIAS
          # -----------------------------------------------------

          if ! keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$ALIAS" \
            >/dev/null 2>&1
          then

            echo "::error::L'alias détecté ne correspond pas au keystore."

            exit 1
          fi

          echo "OK : alias Release vérifié."

          # -----------------------------------------------------
          # VARIABLES POUR GRADLE
          # -----------------------------------------------------

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          echo ""
          echo "========================================="
          echo "   SIGNATURE V34 CONFIGUREE AVEC SUCCES"
          echo "========================================="

      # =========================================================
      # COMPILATION V34
      # =========================================================

      - name: Build release APK V34
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "   COMPILATION YOUNGEST'S BUSINESS V34"
          echo "========================================="

          gradle \
            --no-daemon \
            clean \
            :app:assembleRelease

          echo ""
          echo "Compilation V34 terminée."

      # =========================================================
      # VERIFICATION APK V34
      # =========================================================

      - name: Verify APK signature, package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release introuvable après compilation."
            exit 1
          fi

          echo "========================================="
          echo "       VERIFICATION SIGNATURE APK"
          echo "========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "========================================="
          echo "       VERIFICATION IDENTITE APK"
          echo "========================================="

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" | head -n 5

          # -----------------------------------------------------
          # APPLICATION ID
          # -----------------------------------------------------

          echo "$BADGING" | grep -q \
            "package: name='com.aistudio.youngestbiz.mbkz'" || {

            echo "::error::ApplicationId de l'APK incorrect."
            exit 1
          }

          # -----------------------------------------------------
          # VERSION CODE 34
          # -----------------------------------------------------

          echo "$BADGING" | grep -q \
            "versionCode='34'" || {

            echo "::error::La version de l'APK compilé n'est pas 34."
            exit 1
          }

          # -----------------------------------------------------
          # VERSION NAME
          # -----------------------------------------------------

          echo "$BADGING" | grep -q \
            "versionName='1.27.0'" || {

            echo "::error::La versionName de l'APK compilé n'est pas 1.27.0."
            exit 1
          }

          echo ""
          echo "OK : applicationId correct."
          echo "OK : versionCode 34."
          echo "OK : versionName 1.27.0."
          echo "OK : signature APK valide."

          # -----------------------------------------------------
          # CREATION ARTIFACT
          # -----------------------------------------------------

          mkdir -p \
            "$GITHUB_WORKSPACE/release-output"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V34-CHAT-PERSISTENT-DELIVERY.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V34-CHAT-PERSISTENT-DELIVERY.apk" \
            > \
            "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          echo ""
          echo "========================================="
          echo "          APK V34 PRET"
          echo "========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/release-output/"

          echo ""
          echo "SHA256 :"

          cat \
            "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      # =========================================================
      # UPLOAD ARTIFACT V34
      # =========================================================

      - name: Upload signed V34 APK artifact
        uses: actions/upload-artifact@v4

        with:
          name: YOUNGEST-BUSINESS-V34-CHAT-PERSISTENT-DELIVERY
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
