name: Build YOUNGEST'S BUSINESS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Installer les composants Android nécessaires
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Décompresser le projet YOUNGEST'S BUSINESS
        shell: bash
        run: |
          set -e

          echo "Recherche du fichier V6..."

          ZIP_FILE="./YOUNGEST-BUSINESS-V6-AJOUT-PRET-CLIENT.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : le fichier V6 est introuvable."
            ls -la
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP_FILE" -d extracted

          echo "Vérification de la structure du projet..."

          if [ ! -f "extracted/settings.gradle" ]; then
            echo "ERREUR : settings.gradle est introuvable."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Projet Android détecté correctement."

          cp -a extracted/app .
          cp -a extracted/build.gradle .
          cp -a extracted/settings.gradle .

          if [ -d "extracted/gradle" ]; then
            cp -a extracted/gradle .
          fi

          if [ -f "extracted/gradle.properties" ]; then
            cp -a extracted/gradle.properties .
          fi

          echo "Projet préparé."

      - name: Vérifier Gradle
        shell: bash
        run: |
          gradle --version
          java -version

      - name: Nettoyer le projet
        run: |
          gradle --no-daemon clean

      - name: Construire l'APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Vérifier que l'APK existe
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
