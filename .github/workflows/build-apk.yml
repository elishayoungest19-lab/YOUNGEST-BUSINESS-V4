name: "Build YOUNGEST'S BUSINESS APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation des composants Android..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Composants Android installés."

      - name: "Décompresser le projet YOUNGEST'S BUSINESS"
        shell: bash
        run: |
          set -e

          ZIP_FILE="./YOUNGEST-BUSINESS-V7-SECURISEE.zip"

          echo "Recherche du fichier : $ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : le fichier V7 est introuvable."
            echo ""
            echo "Fichiers présents dans le dépôt :"
            ls -la
            echo ""
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP_FILE" -d extracted

          echo "Contenu extrait :"
          ls -la extracted

          if [ ! -f "extracted/settings.gradle" ]; then
            echo "ERREUR : settings.gradle introuvable."
            echo ""
            echo "Recherche des fichiers Gradle :"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Projet Android détecté."

          rm -rf app
          rm -rf gradle

          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties

          cp -a extracted/app .
          cp -a extracted/gradle .
          cp -a extracted/build.gradle .
          cp -a extracted/settings.gradle .
          cp -a extracted/gradle.properties .

          echo "Projet préparé."

      - name: "Vérifier Gradle"
        shell: bash
        run: |
          set -e

          echo "Version de Gradle :"
          gradle --version

      - name: "Nettoyer le projet"
        shell: bash
        run: |
          set -e

          echo "Nettoyage du projet..."
          gradle --no-daemon clean

      - name: "Construire l'APK"
        shell: bash
        run: |
          set -e

          echo "Construction de YOUNGEST'S BUSINESS..."
          gradle --no-daemon assembleDebug --stacktrace

      - name: "Vérifier que l'APK existe"
        shell: bash
        run: |
          set -e

          echo "Vérification de l'APK..."

          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "APK créé avec succès !"
          echo ""

      - name: "Publier l'APK"
        uses: actions/upload-artifact@v4
        with:
          name: "YOUNGEST-BUSINESS-APK"
          path: "app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
