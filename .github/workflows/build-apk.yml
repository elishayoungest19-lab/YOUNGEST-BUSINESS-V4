name: Build YOUNGEST'S BUSINESS V32 Chat Delivery Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V32 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE ET EXTRACTION DU SOURCE V32
      # =========================================================

      - name: Find and extract V32 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_PATH=""

          echo "========================================="
          echo "     RECHERCHE DU SOURCE V32"
          echo "========================================="

          for ZIP_NAME in \
            "YOUNGEST-BUSINESS-V32-CHAT-DELIVERY-FIX-source.zip" \
            "YOUNGEST-BUSINESS-V32-CHAT-DELIVERY-FIX-source-1.zip" \
            "YOUNGEST-BUSINESS-V32-CHAT-DELIVERY-FIX-source-2.zip"
          do
            ZIP_PATH="$(find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -name "$ZIP_NAME" \
              -print -quit)"

            if [ -n "$ZIP_PATH" ]; then
              echo "ZIP source V32 trouvé :"
              echo "$ZIP_PATH"
              break
            fi
          done

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::ZIP source V32 introuvable."

            echo ""
            echo "Fichiers ZIP présents dans le dépôt :"

            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -iname '*.zip' \
              -print || true

            exit 1
          fi

          echo ""
          echo "Vérification de l'archive V32..."

          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v32-source"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction du projet V32..."

          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -print -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le ZIP V32."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android V32 détecté :"
          echo "$PROJECT_DIR"

      # =========================================================
      # VERIFICATION DU SOURCE V32
      # =========================================================

      - name: Verify V32 source and chat components
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "========================================="
          echo "        VERIFICATION SOURCE V32"
          echo "========================================="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json introuvable."
            exit 1
          }

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java introuvable."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js introuvable."
            exit 1
          }

          echo "OK : fichiers principaux présents."

          # -----------------------------------------------------
          # VERSION V32
          # -----------------------------------------------------

          grep -Eq \
            'versionCode[[:space:]]+32([[:space:]]|$)' \
            "$GRADLE" || {

            echo "::error::Le code source n'est pas en version 32."

            grep -n "versionCode" "$GRADLE" || true

            exit 1
          }

          echo "OK : versionCode 32."

          # -----------------------------------------------------
          # VERSION NAME
          # -----------------------------------------------------

          grep -Fq \
            "versionName '1.25.0'" \
            "$GRADLE" || {

            echo "::error::versionName 1.25.0 introuvable."
            grep -n "versionName" "$GRADLE" || true
            exit 1
          }

          echo "OK : versionName 1.25.0."

          # -----------------------------------------------------
          # APPLICATION ID
          # -----------------------------------------------------

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE" || {

            echo "::error::applicationId incorrect."
            exit 1
          }

          echo "OK : applicationId correct."

          # -----------------------------------------------------
          # CHAT CLIENT
          # -----------------------------------------------------

          grep -Fq \
            'void contactPage()' \
            "$MAIN" || {

            echo "::error::contactPage() introuvable."
            exit 1
          }

          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {

            echo "::error::openChatEntry() introuvable."
            exit 1
          }

          grep -Fq \
            'openClientConversationWithDraft' \
            "$MAIN" || {

            echo "::error::openClientConversationWithDraft introuvable."
            exit 1
          }

          echo "OK : parcours Chat client."

          # -----------------------------------------------------
          # SESSION FIREBASE ADMIN
          # -----------------------------------------------------

          grep -Fq \
            'firebaseAuth.signOut()' \
            "$MAIN" || {

            echo "::error::firebaseAuth.signOut() introuvable."
            exit 1
          }

          echo "OK : déconnexion Firebase."

          # -----------------------------------------------------
          # PHONE AUTH
          # -----------------------------------------------------

          grep -Fq \
            'PhoneAuthProvider.verifyPhoneNumber(options)' \
            "$MAIN" || {

            echo "::error::Phone Authentication introuvable."
            exit 1
          }

          echo "OK : Firebase Phone Authentication."

          # -----------------------------------------------------
          # ADMIN CHAT
          # -----------------------------------------------------

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {

            echo "::error::adminChatInbox() introuvable."
            exit 1
          }

          echo "OK : boîte Admin."

          # -----------------------------------------------------
          # ADMIN EMAIL
          # -----------------------------------------------------

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$MAIN" || {

            echo "::error::Gmail Admin introuvable dans MainActivity."
            exit 1
          }

          echo "OK : Gmail Admin."

          # -----------------------------------------------------
          # FIREBASE MESSAGING
          # -----------------------------------------------------

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {

            echo "::error::FirebaseMessagingService introuvable."
            exit 1
          }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {

            echo "::error::onMessageReceived introuvable."
            exit 1
          }

          echo "OK : Firebase Messaging."

          # -----------------------------------------------------
          # FIRESTORE CHAT
          # -----------------------------------------------------

          grep -Fq \
            'match /yb_chat_conversations/' \
            "$RULES" || {

            echo "::error::Règle yb_chat_conversations introuvable."
            exit 1
          }

          grep -Fq \
            'match /yb_notification_tokens/' \
            "$RULES" || {

            echo "::error::Règle yb_notification_tokens introuvable."
            exit 1
          }

          echo "OK : règles Firestore Chat."

          # -----------------------------------------------------
          # CLOUD FUNCTIONS
          # -----------------------------------------------------

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {

            echo "::error::onDocumentCreated introuvable."
            exit 1
          }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {

            echo "::error::notifyClientWhenAdminReplies introuvable."
            exit 1
          }

          node --check "$FUNCTIONS"

          echo "OK : Cloud Functions."

          echo ""
          echo "========================================="
          echo "       V32 SOURCE CHECKS PASSED"
          echo "========================================="

      # =========================================================
      # CONFIGURATION SIGNATURE
      # =========================================================

      - name: Configure release signing
        shell: bash

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then

            echo "::error::Secrets de signature manquants."
            echo "::error::KEYSTORE_BASE64"
            echo "::error::KEYSTORE_PASSWORD"
            echo "::error::KEY_PASSWORD"

            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | \
            base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then

            ALIAS="$(
              keytool -list -v \
                -keystore release-keystore.jks \
                -storepass "$KEYSTORE_PASSWORD" \
                2>/dev/null \
                | sed -n 's/^Alias name: //p' \
                | head -n 1
            )"

          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Configure le secret KEY_ALIAS dans GitHub."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          echo "OK : keystore Release configuré."

      # =========================================================
      # COMPILATION V32
      # =========================================================

      - name: Build release APK V32
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "   COMPILATION YOUNGEST'S BUSINESS V32"
          echo "========================================="

          gradle \
            --no-daemon \
            clean \
            :app:assembleRelease

          echo ""
          echo "Compilation V32 terminée."

      # =========================================================
      # VERIFICATION APK V32
      # =========================================================

      - name: Verify APK signature, package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release introuvable après compilation."
            exit 1
          fi

          echo "========================================="
          echo "       VERIFICATION SIGNATURE APK"
          echo "========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "========================================="
          echo "       VERIFICATION IDENTITE APK"
          echo "========================================="

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" | head -n 5

          # -----------------------------------------------------
          # APPLICATION ID
          # -----------------------------------------------------

          echo "$BADGING" | grep -q \
            "package: name='com.aistudio.youngestbiz.mbkz'" || {

            echo "::error::ApplicationId de l'APK incorrect."
            exit 1
          }

          # -----------------------------------------------------
          # VERSION CODE 32
          # -----------------------------------------------------

          echo "$BADGING" | grep -q \
            "versionCode='32'" || {

            echo "::error::La version de l'APK compilé n'est pas 32."
            exit 1
          }

          echo ""
          echo "OK : applicationId correct."
          echo "OK : versionCode 32."
          echo "OK : signature APK valide."

          # -----------------------------------------------------
          # ARTIFACT
          # -----------------------------------------------------

          mkdir -p \
            "$GITHUB_WORKSPACE/release-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V32-CHAT-DELIVERY-FIX.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V32-CHAT-DELIVERY-FIX.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          echo ""
          echo "========================================="
          echo "          APK V32 PRET"
          echo "========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/release-output/"

          echo ""
          echo "SHA256 :"

          cat \
            "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      # =========================================================
      # UPLOAD ARTIFACT V32
      # =========================================================

      - name: Upload signed V32 APK artifact
        uses: actions/upload-artifact@v4

        with:
          name: YOUNGEST-BUSINESS-V32-CHAT-DELIVERY-FIX
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
