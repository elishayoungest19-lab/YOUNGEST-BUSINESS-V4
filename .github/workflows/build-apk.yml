name: Build YOUNGEST'S BUSINESS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Décompresser le projet V4
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          if [ -f "extracted/gradlew" ]; then
            cp -a extracted/. .
          else
            PROJECT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
              echo "ERREUR : projet Android introuvable dans le ZIP."
              find extracted -maxdepth 3 -type f | sort
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. .
          fi

          chmod +x gradlew

          echo "Structure du projet :"
          ls -la

      - name: Nettoyer le projet
        run: ./gradlew clean

      - name: Construire l'APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
