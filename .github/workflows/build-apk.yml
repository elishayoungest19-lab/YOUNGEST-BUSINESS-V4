
name: Build YOUNGEST'S BUSINESS V26 Chat Service Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V26 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V26 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_PATH=""

          # Prefer the exact name, then accept the GitHub -2 suffix.
          for NAME in \
            "YOUNGEST-BUSINESS-V26-CHAT-SERVICE-CLIENT.zip" \
            "YOUNGEST-BUSINESS-V26-CHAT-SERVICE-CLIENT-2.zip"
          do
            ZIP_PATH="$(find "$ROOT" -type f -name "$NAME" \
              ! -path "$ROOT/release-output/*" -print -quit)"
            if [ -n "$ZIP_PATH" ]; then
              break
            fi
          done

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::V26 ZIP not found. Expected the original filename or the -2.zip filename."
            echo "ZIP files found in repository:"
            find "$ROOT" -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Using source ZIP: $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v26-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found inside the ZIP."
            find "$DEST" -maxdepth 4 -type f -print | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Verify V26 source and chat markers
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          FIRESTORE="$PROJECT_DIR/firestore.rules"

          test -f "$MAIN" || {
            echo "::error::MainActivity.java not found at the expected path."
            exit 1
          }

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle not found."
            exit 1
          }

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::app/google-services.json is missing."
            exit 1
          }

          test -f "$FIRESTORE" || {
            echo "::error::firestore.rules is missing."
            exit 1
          }

          grep -Eq 'versionCode[[:space:]]+26([[:space:]]|$)' "$GRADLE" || {
            echo "::error::versionCode 26 not found in app/build.gradle."
            exit 1
          }

          for MARKER in \
            'void services()' \
            'void journalPage()' \
            'openChatEntry()' \
            'adminChatInbox()' \
            'PhoneAuthProvider.verifyPhoneNumber(options)'
          do
            if ! grep -Fq "$MARKER" "$MAIN"; then
              echo "::error::Required source marker missing: $MARKER"
              exit 1
            fi
          done

          grep -Fq 'match /yb_chat_conversations/' "$FIRESTORE" || {
            echo "::error::Chat conversation rule marker not found."
            exit 1
          }

          echo "V26 source and marker checks passed."

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(keytool -list -v \
              -keystore release-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
              sed -n 's/^Alias name: //p' | head -n 1)"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Could not determine the key alias. Set the KEY_ALIAS secret."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon clean :app:assembleRelease

      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK missing."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | head -n 3

          echo "$BADGING" | grep -q "versionCode='26'" || {
            echo "::error::APK versionCode is not 26."
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V26-CHAT-SERVICE-CLIENT.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V26-CHAT-SERVICE-CLIENT.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      - name: Upload signed V26 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V26-CHAT-SERVICE-CLIENT
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
          
