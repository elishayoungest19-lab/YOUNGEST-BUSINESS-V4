name: YOUNGEST'S BUSINESS V49 Wi-Fi Development Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'YOUNGEST-BUSINESS-V49-COMPLET-WIFI-V48-V49-source.zip'
      - '.github/workflows/yb-wifi-v49-dev.yml'

permissions:
  contents: read

concurrency:
  group: yb-wifi-v49-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V49-COMPLET-WIFI-V48-V49-source.zip

jobs:
  validate-source:
    name: Validate V49 source and Wi-Fi Web prototype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find source ZIP and detect project folders
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::Archive introuvable : $SOURCE_ZIP"
            echo "Archives ZIP présentes à la racine :"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' || true
            exit 1
          fi

          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/yb-v49"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          # Detect the project root by its expected Android and Web files;
          # do not assume a fixed top-level folder name inside the ZIP.
          ROOT=""
          while IFS= read -r -d '' WEB_INDEX; do
            CANDIDATE="$(dirname "$(dirname "$WEB_INDEX")")"
            if [ -s "$CANDIDATE/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java" ] \
              && [ -s "$CANDIDATE/app/build.gradle" ] \
              && { [ -s "$CANDIDATE/settings.gradle" ] || [ -s "$CANDIDATE/settings.gradle.kts" ]; } \
              && [ -s "$CANDIDATE/firestore.rules" ] \
              && [ -s "$CANDIDATE/.firebaserc" ]; then
              ROOT="$CANDIDATE"
              break
            fi
          done < <(find "$DEST" -type f -path '*/web-admin/index.html' -print0)

          if [ -z "$ROOT" ]; then
            echo "::error::Structure source non reconnue. Il faut un même dossier projet contenant web-admin/index.html, app/, settings.gradle, firestore.rules et .firebaserc."
            echo "Fichiers détectés pour diagnostic :"
            find "$DEST" -maxdepth 5 \( -name settings.gradle -o -name index.html -o -name MainActivity.java -o -name .firebaserc \) -print || true
            exit 1
          fi

          test -s "$ROOT/web-admin/app.js"
          test -s "$ROOT/web-admin/styles.css"
          test -s "$ROOT/app/src/main/AndroidManifest.xml"
          test -s "$ROOT/app/google-services.json"
          grep -q 'youngestsbusiness' "$ROOT/.firebaserc"

          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Source projet détectée : $ROOT"

      - name: Validate Web JavaScript and tariff document
        shell: bash
        run: |
          set -euo pipefail
          node --check "$SOURCE_ROOT/web-admin/app.js"

          if ! grep -Eiq 'YOUNGEST.?S B WIFI|B WIFI|WIFI' "$SOURCE_ROOT/web-admin/index.html"; then
            echo "::warning::Marqueur Wi-Fi non trouvé dans web-admin/index.html."
          fi

          TARIFF_DOC="$SOURCE_ROOT/README-V49-YB-WIFI-TARIFS-COUPON-UNIQUE.md"
          if [ -s "$TARIFF_DOC" ]; then
            grep -Eiq '2[[:space:]]*000|2000' "$TARIFF_DOC"
            grep -Eiq '3[[:space:]]*500|3500' "$TARIFF_DOC"
            grep -Eiq '5[[:space:]]*000|5000' "$TARIFF_DOC"
            grep -Eiq '8[[:space:]]*000|8000' "$TARIFF_DOC"
          else
            echo "::warning::Le document de tarifs attendu est absent; vérifiez les tarifs manuellement."
          fi

          echo "Contrôle de syntaxe Web terminé."

      - name: Report Android Wi-Fi integration status
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$SOURCE_ROOT/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          if grep -Eiq 'YOUNGEST.?S B WIFI|yb_wifi|wifiCoupon|couponWifi|wifiPage' "$MAIN"; then
            echo "Android : marqueur Wi-Fi détecté; une revue fonctionnelle reste nécessaire."
          else
            echo "::warning::L'interface Wi-Fi Android ne semble pas intégrée à MainActivity.java. La réussite du build ne prouvera pas que la fonctionnalité Wi-Fi existe."
          fi

      - name: Upload validated V49 source archive
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V49-WIFI-SOURCE-VALIDATED
          path: ${{ env.SOURCE_ZIP }}
          if-no-files-found: error
          retention-days: 30

  build-android-baseline:
    name: Build Android debug baseline (not production)
    runs-on: ubuntu-latest
    needs: validate-source
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source and detect Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          test -s "$ZIP_PATH"
          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/yb-v49-android"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          PROJECT_DIR=""
          while IFS= read -r -d '' SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -s "$CANDIDATE/app/build.gradle" ] \
              && [ -s "$CANDIDATE/app/src/main/AndroidManifest.xml" ] \
              && [ -s "$CANDIDATE/app/google-services.json" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projet Android Gradle non trouvé dans l'archive."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android détecté : $PROJECT_DIR"

      - name: Build debug baseline APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleDebug --stacktrace
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK" "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V49-ANDROID-BASELINE-DEBUG.apk"
          sha256sum "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V49-ANDROID-BASELINE-DEBUG.apk" > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"
          echo "::warning::APK de débogage uniquement. Ne pas distribuer comme version de production. La présence du module Wi-Fi fonctionnel n'est pas garantie."

      - name: Upload Android debug baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V49-ANDROID-BASELINE-DEBUG-NOT-PRODUCTION
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

# This workflow intentionally does not deploy Firebase Hosting or Firestore rules.
# It does not use production signing secrets. Production remains managed by build-apk.yml.
