name: Build YOUNGEST'S BUSINESS V23 Journal Mobile Money

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify V23 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify V23 source and Firebase config
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          test -f app/google-services.json
          grep -q "versionCode 23" app/build.gradle
          grep -q "versionName '1.17.0'" app/build.gradle
          grep -q 'JOURNAL ENVOIS' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'void moneyJournalForm()' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'void transfers()' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          echo "V23 source checks passed."

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Release signing secrets missing. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          if [ -n "${KEY_ALIAS:-}" ]; then
            ALIAS="$KEY_ALIAS"
          else
            ALIAS=$(keytool -list -v -keystore release-keystore.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n 1)
          fi
          test -n "$ALIAS"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle clean :app:assembleRelease --no-daemon

      - name: Verify APK version and signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='23'"
          mkdir -p release-apk
          cp "$APK" release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk
          sha256sum release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk | tee release-apk/SHA256SUMS.txt

      - name: Upload verified V23 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE
          path: release-apk/*
          if-no-files-found: error
          retention-days: 30
