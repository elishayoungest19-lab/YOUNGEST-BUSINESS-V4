
name: Deploy YOUNGEST'S BUSINESS V40 Journals Synchronization

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy V40 Web Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find and extract exact V40 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="YOUNGEST-BUSINESS-V40-JOURNAUX-SYNCHRONISATION-WEB-ANDROID-source-1.zip"
          ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP V40 introuvable : $ZIP_NAME"
            echo "Archives ZIP présentes dans le dépôt :"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print | sort
            exit 1
          fi

          echo "ZIP V40 trouvé : $ZIP_NAME"
          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v40-source"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          FIREBASE_JSON="$(find "$DEST" -type f -name firebase.json -print -quit)"

          if [ -z "$FIREBASE_JSON" ]; then
            echo "::error::firebase.json absent du ZIP V40."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$FIREBASE_JSON")"

          for file in \
            "$PROJECT_DIR/.firebaserc" \
            "$PROJECT_DIR/firestore.rules" \
            "$PROJECT_DIR/web-admin/index.html" \
            "$PROJECT_DIR/web-admin/app.js" \
            "$PROJECT_DIR/web-admin/styles.css"
          do
            if [ ! -s "$file" ]; then
              echo "::error::Fichier requis absent ou vide : $file"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet V40 extrait et fichiers essentiels trouvés."

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const dir = process.env.PROJECT_DIR;
          const firebasePath = path.join(dir, "firebase.json");
          const rcPath = path.join(dir, ".firebaserc");

          const config = JSON.parse(fs.readFileSync(firebasePath, "utf8"));
          const rc = JSON.parse(fs.readFileSync(rcPath, "utf8"));

          if (rc.projects?.default !== "youngestsbusiness") {
            throw new Error(".firebaserc ne cible pas youngestsbusiness.");
          }

          const hosting = Array.isArray(config.hosting)
            ? config.hosting
            : [config.hosting];

          if (!hosting.some(h => h && h.public === "web-admin")) {
            throw new Error("Firebase Hosting ne cible pas web-admin.");
          }

          if (!config.firestore ||
              config.firestore.rules !== "firestore.rules") {
            throw new Error("Configuration des règles Firestore incorrecte.");
          }

          console.log("Configuration Firebase V40 valide.");
          NODE

      - name: Verify Web Admin JavaScript
        shell: bash
        run: |
          set -euo pipefail

          WEB="$PROJECT_DIR/web-admin"

          node --check "$WEB/app.js"

          echo "Syntaxe JavaScript valide."

      - name: Verify required journal references
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/web-admin/app.js"
          HTML="$PROJECT_DIR/web-admin/index.html"

          for term in \
            "yb_mobile_money_journal" \
            "yb_lumicash_journal"
          do
            if ! grep -Fq "$term" "$APP"; then
              echo "::error::Référence de collection absente du Web Admin : $term"
              exit 1
            fi
          done

          if ! grep -Fq "Journal des envois" "$HTML"; then
            echo "::error::Rubrique Journal des envois absente."
            exit 1
          fi

          if ! grep -Fq "Journal LUMICASH" "$HTML"; then
            echo "::error::Rubrique Journal LUMICASH absente."
            exit 1
          fi

          echo "Rubriques et références des journaux trouvées."

      - name: Verify Firebase deployment credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON manquant."
            exit 1
          fi

          CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIAL_FILE"

          node - "$CREDENTIAL_FILE" <<'NODE'
          const fs = require("fs");
          const credentials = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          if (
            !credentials.project_id ||
            !credentials.client_email ||
            !credentials.private_key
          ) {
            throw new Error("JSON du compte de service incomplet.");
          }

          if (credentials.project_id !== "youngestsbusiness") {
            throw new Error("Le compte de service vise un autre projet.");
          }

          console.log("Identifiants du compte de service valides.");
          NODE

          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIAL_FILE" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools
          firebase --version

      - name: Verify Firebase project access
        shell: bash
        run: |
          set -euo pipefail

          firebase projects:list --json > "$RUNNER_TEMP/firebase-projects.json"

          node - "$RUNNER_TEMP/firebase-projects.json" <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(
            fs.readFileSync(process.argv[2], "utf8")
          );

          const projects = Array.isArray(data)
            ? data
            : Array.isArray(data.result)
              ? data.result
              : [];

          if (!projects.some(p => p.projectId === "youngestsbusiness")) {
            throw new Error(
              "Le projet youngestsbusiness n'est pas accessible."
            );
          }

          console.log("Accès au projet Firebase confirmé.");
          NODE

      - name: Deploy V40 Web Admin and Firestore rules
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          firebase deploy \
            --only hosting,firestore:rules \
            --project youngestsbusiness \
            --non-interactive

      - name: Show deployed V40 URL
        shell: bash
        run: |
          echo "Déploiement V40 terminé."
          echo "Administration Web : https://youngestsbusiness.web.app"
          echo "URL alternative : https://youngestsbusiness.firebaseapp.com"
          
