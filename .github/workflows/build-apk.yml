name: Build YOUNGEST'S BUSINESS V35 Admin Cards Real Chat FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V35 ADMIN CARDS REAL CHAT APK
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE EXACTE DU ZIP V35 CORRIGE
      # =========================================================
      - name: Find exact V35 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_NAME="YOUNGEST-BUSINESS-V35-ADMIN-CARDS-REAL-CHAT-FIXED-source.zip"

          echo "=============================================="
          echo "       RECHERCHE DU VRAI SOURCE V35"
          echo "=============================================="

          ZIP_PATH="$(
            find "$ROOT" \
              -type f \
              -name "$ZIP_NAME" \
              -print \
              -quit
          )"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Le ZIP V35 exact est introuvable."
            echo ""
            echo "ZIP V35 attendu :"
            echo "$ZIP_NAME"
            echo ""
            echo "ZIP disponibles dans le dépôt :"
            find "$ROOT" -type f -iname "*.zip" -print | sort || true
            exit 1
          fi

          echo ""
          echo "ZIP V35 EXACT TROUVE :"
          echo "$ZIP_PATH"

          echo ""
          echo "=============================================="
          echo "       TEST DE L'ARCHIVE V35"
          echo "=============================================="

          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v35-source"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction du vrai source V35..."
          unzip -q "$ZIP_PATH" -d "$DEST"
          echo "Extraction terminée."

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le ZIP V35."
            find "$DEST" -maxdepth 5 -type f -print | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "       VRAI PROJET ANDROID V35"
          echo "=============================================="
          echo "$PROJECT_DIR"

      # =========================================================
      # IDENTITE EXACTE V35
      # =========================================================
      - name: Verify exact V35 identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          test -f "$GRADLE_FILE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Eq 'versionCode[[:space:]]+35([[:space:]]|$)' "$GRADLE_FILE" || {
            echo "::error::Ce source n'est PAS V35 : versionCode 35 absent."
            exit 1
          }

          grep -Fq "versionName '1.28.0'" "$GRADLE_FILE" || {
            echo "::error::versionName 1.28.0 absent."
            exit 1
          }

          grep -Fq "applicationId 'com.aistudio.youngestbiz.mbkz'" "$GRADLE_FILE" || {
            echo "::error::applicationId incorrect."
            exit 1
          }

          grep -Fq "namespace 'com.aistudio.youngestbiz.mbkz'" "$GRADLE_FILE" || {
            echo "::error::namespace incorrect."
            exit 1
          }

          echo "versionCode 35 : OK"
          echo "versionName 1.28.0 : OK"
          echo "applicationId : OK"
          echo "namespace : OK"

      # =========================================================
      # VERIFICATION FICHIERS PROJET
      # =========================================================
      - name: Verify V35 project files
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"
          GOOGLE="$PROJECT_DIR/app/google-services.json"

          test -f "$MAIN" || { echo "::error::MainActivity.java introuvable."; exit 1; }
          test -f "$SERVICE" || { echo "::error::AppNotificationService.java introuvable."; exit 1; }
          test -f "$RULES" || { echo "::error::firestore.rules introuvable."; exit 1; }
          test -f "$FUNCTIONS" || { echo "::error::functions/index.js introuvable."; exit 1; }
          test -f "$GOOGLE" || { echo "::error::google-services.json introuvable."; exit 1; }

          echo "MainActivity.java : OK"
          echo "AppNotificationService.java : OK"
          echo "firestore.rules : OK"
          echo "functions/index.js : OK"
          echo "google-services.json : OK"

      # =========================================================
      # PROTECTION INTERFACE ADMIN
      # =========================================================
      - name: Verify existing Admin Cards interface
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          for label in \
            'TABLEAU DE BORD' \
            'GESTION DES CLIENTS' \
            'GESTION DES PRÊTS' \
            'REMBOURSEMENTS' \
            'DEMANDES DE PRÊTS CLIENTS' \
            'CONTACTEZ-NOUS'
          do
            grep -Fq "$label" "$MAIN" || {
              echo "::error::Carte $label absente."
              exit 1
            }
            echo "$label : OK"
          done

          echo "INTERFACE ADMIN EXISTANTE PRESERVEE."

      # =========================================================
      # VERIFICATION CHAT CLIENT
      # =========================================================
      - name: Verify real client Chat delivery path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          for check in \
            'persistPendingChatDraft' \
            'openChatEntry()' \
            'requestChatPhoneNumber()' \
            'signInAnonymously' \
            'KEY_PENDING_CHAT_PHONE' \
            'openOrCreateClientConversation()' \
            'whereEqualTo("ownerUid"' \
            'createConversationAndSendDraft' \
            'conversation.set(c)' \
            'message.set(msg)' \
            'msg.put("ownerUid"'
          do
            grep -Fq "$check" "$MAIN" || {
              echo "::error::$check absent."
              exit 1
            }
            echo "$check : OK"
          done

          echo "CHEMIN CHAT CLIENT : VALIDE"

      # =========================================================
      # VERIFICATION CHAT ADMIN
      # =========================================================
      - name: Verify Chat administration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          for check in \
            'adminChatInbox()' \
            'FIREBASE_ADMIN_EMAIL.equalsIgnoreCase' \
            'yb_chat_conversations' \
            'Collections.sort(docs'
          do
            grep -Fq "$check" "$MAIN" || {
              echo "::error::$check absent."
              exit 1
            }
            echo "$check : OK"
          done

      # =========================================================
      # VERIFICATION REGLES FIREBASE CHAT
      # =========================================================
      - name: Verify Firebase rules for V35 Chat
        shell: bash
        run: |
          set -euo pipefail

          RULES="$PROJECT_DIR/firestore.rules"

          for check in \
            'function isSignedIn()' \
            'function isAdmin()' \
            'StxrZBDeUodj7YVPmXRA2AbWcUF2' \
            'elishayoungest19@gmail.com' \
            'match /yb_chat_conversations/' \
            'request.resource.data.ownerUid == request.auth.uid' \
            'request.resource.data.phone is string' \
            'request.resource.data.status == "OPEN"' \
            'match /messages/{messageId}' \
            'request.resource.data.senderUid == request.auth.uid' \
            'request.resource.data.senderRole == "client"' \
            'request.resource.data.senderRole == "admin"'
          do
            grep -Fq "$check" "$RULES" || {
              echo "::error::$check absent."
              exit 1
            }
            echo "$check : OK"
          done

          echo "REGLES FIREBASE CHAT : OK"

      # =========================================================
      # VERIFICATION NOTIFICATIONS
      # =========================================================
      - name: Verify Firebase notifications
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          grep -Fq 'FirebaseMessagingService' "$SERVICE" || {
            echo "::error::FirebaseMessagingService absent."
            exit 1
          }

          grep -Fq 'onMessageReceived' "$SERVICE" || {
            echo "::error::onMessageReceived absent."
            exit 1
          }

          grep -Fq 'onDocumentCreated' "$FUNCTIONS" || {
            echo "::error::onDocumentCreated absent."
            exit 1
          }

          grep -Fq 'notifyClientWhenAdminReplies' "$FUNCTIONS" || {
            echo "::error::notifyClientWhenAdminReplies absent."
            exit 1
          }

          node --check "$FUNCTIONS"

          echo "FirebaseMessagingService : OK"
          echo "onMessageReceived : OK"
          echo "onDocumentCreated : OK"
          echo "notifyClientWhenAdminReplies : OK"
          echo "Cloud Functions syntax : OK"

      # =========================================================
      # CONFIGURATION SIGNATURE
      #
      # Le vrai app/build.gradle V35 utilise :
      # - release-keystore.jks à la racine du projet
      # - ANDROID_KEYSTORE_PASSWORD
      # - ANDROID_KEY_ALIAS
      # - ANDROID_KEY_PASSWORD
      #
      # On respecte donc exactement cette configuration.
      # =========================================================
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 manquant."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "::error::KEYSTORE_PASSWORD manquant."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::KEY_PASSWORD manquant."
            exit 1
          }

          KEYSTORE_FILE="$PROJECT_DIR/release-keystore.jks"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE" || {
            echo "::error::Keystore vide ou invalide."
            exit 1
          }

          chmod 600 "$KEYSTORE_FILE"

          KEY_ALIAS="$(
            keytool -list -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              2>/dev/null |
              awk -F': ' '/^Alias name:/{print $2; exit}'
          )"

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Impossible de récupérer l'alias du keystore."
            echo "Vérifie KEYSTORE_BASE64 et KEYSTORE_PASSWORD."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Keystore : OK"
          echo "Alias du keystore récupéré automatiquement : $KEY_ALIAS"

      # =========================================================
      # VERIFICATION CONFIGURATION SIGNATURE
      # =========================================================
      - name: Verify V35 release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          KEYSTORE_FILE="$PROJECT_DIR/release-keystore.jks"

          grep -Fq 'signingConfigs' "$GRADLE_FILE" || {
            echo "::error::signingConfigs absent du vrai app/build.gradle V35."
            exit 1
          }

          grep -Fq 'release-keystore.jks' "$GRADLE_FILE" || {
            echo "::error::Le Gradle V35 n'utilise pas release-keystore.jks."
            exit 1
          }

          grep -Fq 'ANDROID_KEYSTORE_PASSWORD' "$GRADLE_FILE" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD absent du Gradle V35."
            exit 1
          }

          grep -Fq 'ANDROID_KEY_ALIAS' "$GRADLE_FILE" || {
            echo "::error::ANDROID_KEY_ALIAS absent du Gradle V35."
            exit 1
          }

          grep -Fq 'ANDROID_KEY_PASSWORD' "$GRADLE_FILE" || {
            echo "::error::ANDROID_KEY_PASSWORD absent du Gradle V35."
            exit 1
          }

          test -f "$KEYSTORE_FILE" || {
            echo "::error::release-keystore.jks introuvable."
            exit 1
          }

          echo "Gradle signingConfig V35 : OK"
          echo "release-keystore.jks : OK"
          echo "ANDROID_KEYSTORE_PASSWORD : OK"
          echo "ANDROID_KEY_ALIAS : OK"
          echo "ANDROID_KEY_PASSWORD : OK"

      # =========================================================
      # BUILD APK RELEASE
      # =========================================================
      - name: Build signed V35 APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "          BUILD APK V35"
          echo "=============================================="

          gradle --version

          gradle clean assembleRelease --stacktrace

      # =========================================================
      # VERIFICATION APK
      # =========================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK" || {
            echo "::error::APK release introuvable."
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          }

          echo "APK trouve : $APK"

          ls -lh "$APK"

          echo ""
          echo "Verification AndroidManifest / package / version..."

          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"

          grep -Fq "package: name='com.aistudio.youngestbiz.mbkz'" "$RUNNER_TEMP/apk-badging.txt" || {
            echo "::error::Package APK incorrect."
            exit 1
          }

          grep -Fq "versionCode='35'" "$RUNNER_TEMP/apk-badging.txt" || {
            echo "::error::versionCode APK incorrect."
            exit 1
          }

          grep -Fq "versionName='1.28.0'" "$RUNNER_TEMP/apk-badging.txt" || {
            echo "::error::versionName APK incorrect."
            exit 1
          }

          echo "Package : OK"
          echo "versionCode 35 : OK"
          echo "versionName 1.28.0 : OK"

      # =========================================================
      # RENOMMAGE APK
      # =========================================================
      - name: Rename final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          FINAL="$PROJECT_DIR/app/build/outputs/apk/release/YOUNGEST-BUSINESS-V35-ADMIN-CARDS-REAL-CHAT-FIXED.apk"

          cp "$APK" "$FINAL"

          test -f "$FINAL"

          echo "APK FINAL :"
          echo "$FINAL"

      # =========================================================
      # ARTIFACT
      # =========================================================
      - name: Upload V35 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V35-ADMIN-CARDS-REAL-CHAT-FIXED
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/YOUNGEST-BUSINESS-V35-ADMIN-CARDS-REAL-CHAT-FIXED.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # RESUME FINAL
      # =========================================================
      - name: Final V35 verification
        shell: bash
        run: |
          echo "=============================================="
          echo "       YOUNGEST'S BUSINESS V35"
          echo "=============================================="
          echo ""
          echo "ADMIN CARDS : PRESERVEES"
          echo "REAL CHAT CLIENT -> ADMIN : VERIFIE"
          echo "ownerUid MESSAGE : VERIFIE"
          echo "FIREBASE RULES : VERIFIEES"
          echo "NOTIFICATIONS : VERIFIEES"
          echo "APK SIGNE : VERIFIE"
          echo "VERSION : 35 / 1.28.0"
          echo ""
          echo "BUILD V35 TERMINE AVEC SUCCES."
          
