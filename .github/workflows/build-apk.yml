name: "Build YOUNGEST'S BUSINESS V14 Validation Client Bureau Firebase APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V14 Validation Client Bureau Firebase"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation de platform-tools..."
          sdkmanager --install "platform-tools"

          echo "Installation de la plateforme Android 35..."
          sdkmanager --install "platforms;android-35"

          echo "Installation de Build Tools 35.0.0..."
          sdkmanager --install "build-tools;35.0.0"

          echo "Composants Android installés avec succès."

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Trouver et décompresser le projet V14"
        shell: bash
        run: |
          set -e

          echo "Recherche automatique du ZIP V14..."

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "YOUNGEST-BUSINESS-V14-VALIDATION-CLIENT-BUREAU-FIREBASE*.zip" \
            -print | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP V14 trouvé."
            echo "Fichiers présents dans le dépôt :"
            ls -lah
            exit 1
          fi

          echo "Fichier V14 trouvé :"
          ls -lh "$ZIP_FILE"

          rm -rf ./v14-extracted
          mkdir -p ./v14-extracted

          unzip -o "$ZIP_FILE" -d ./v14-extracted

          echo "Contenu extrait :"
          ls -lah ./v14-extracted

      - name: "Préparer le projet Android V14"
        shell: bash
        run: |
          set -e

          echo "Recherche du projet Android V14..."

          if [ -f "./v14-extracted/settings.gradle" ]; then
            PROJECT_DIR="./v14-extracted"

          elif [ -f "./v14-extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="./v14-extracted"

          else
            PROJECT_DIR=$(find ./v14-extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERREUR : aucun projet Gradle Android trouvé."
              find ./v14-extracted -maxdepth 4 -type f | head -100
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projet Android V14 détecté :"
          echo "$PROJECT_DIR"

          echo "Contenu du projet :"
          ls -lah "$PROJECT_DIR"

          echo "Vérification de app..."
          test -d "$PROJECT_DIR/app"

          echo "Vérification du projet Gradle..."
          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "settings.gradle trouvé."
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle.kts trouvé."
          else
            echo "ERREUR : fichier settings Gradle introuvable."
            exit 1
          fi

          echo "Projet V14 prêt."

      - name: "Installer la configuration Firebase"
        shell: bash
        run: |
          set -e

          echo "Recherche de la configuration Firebase..."

          if [ -f "./google-services (2).json" ]; then
            echo "google-services (2).json trouvé à la racine."

            mkdir -p "$PROJECT_DIR/app"

            cp "./google-services (2).json" \
              "$PROJECT_DIR/app/google-services.json"

          elif [ -f "./google-services.json" ]; then
            echo "google-services.json trouvé à la racine."

            mkdir -p "$PROJECT_DIR/app"

            cp "./google-services.json" \
              "$PROJECT_DIR/app/google-services.json"

          elif [ -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "google-services.json déjà présent dans le projet V14."

          else
            echo "ERREUR : google-services.json introuvable."
            exit 1
          fi

          echo "Configuration Firebase installée."

          ls -lh "$PROJECT_DIR/app/google-services.json"

      - name: "Préparer la clé de signature"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          echo "Vérification de la clé de signature..."

          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "youngest_business" > /dev/null

          echo "Clé de signature vérifiée avec succès."

      - name: "Construire l'APK V14 Validation Client Bureau Firebase"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "youngest_business"
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Version de Gradle :"
          gradle --version

          echo "Nettoyage du projet V14..."
          gradle clean

          echo "Construction de l'APK V14..."
          gradle assembleRelease

          echo "Construction V14 terminée avec succès."

      - name: "Vérifier l'APK V14"
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK V14 introuvable."
            exit 1
          fi

          echo "APK V14 trouvé :"
          ls -lh "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "Vérification de la signature..."

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK V14 signé et vérifié avec succès."

      - name: "Publier l'APK V14 Validation Client Bureau Firebase"
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V14-VALIDATION-CLIENT-BUREAU-FIREBASE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
