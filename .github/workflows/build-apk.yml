name: "Build YOUNGEST'S BUSINESS V15 Transfert Mobile Money RDC"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V15 Mobile Money Transfer RDC"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation de platform-tools..."
          sdkmanager --install "platform-tools"

          echo "Installation de la plateforme Android 35..."
          sdkmanager --install "platforms;android-35"

          echo "Installation de Build Tools 35.0.0..."
          sdkmanager --install "build-tools;35.0.0"

          echo "Composants Android installés avec succès."

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Trouver et décompresser le projet V15"
        shell: bash
        run: |
          set -e

          echo "Recherche du ZIP V15..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "YOUNGEST-BUSINESS-V15-TRANSFERT-MOBILE-MONEY-RDC*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : ZIP V15 introuvable."
            echo "Les fichiers présents dans le dépôt sont :"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP V15 trouvé : $ZIP_FILE"

          rm -rf v15-extracted
          mkdir -p v15-extracted

          unzip -q "$ZIP_FILE" -d v15-extracted

          echo "Contenu extrait :"
          find v15-extracted -maxdepth 3 -type f | sort

      - name: "Localiser le projet Android V15"
        shell: bash
        run: |
          set -e

          SETTINGS=$(find v15-extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle introuvable dans le projet V15."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet Android V15 trouvé dans : $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERREUR : dossier app introuvable."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERREUR : fichier Gradle de l'application introuvable."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: "Vérifier que le projet est bien V15"
        shell: bash
        run: |
          set -e

          echo "Vérification du contenu V15..."

          if [ -f "$PROJECT_DIR/README-V15-TRANSFERT-MOBILE-MONEY-RDC.md" ]; then
            echo "README V15 trouvé."
          else
            echo "AVERTISSEMENT : README V15 non trouvé."
          fi

          echo "Version Android déclarée :"
          grep -n "versionName" "$PROJECT_DIR/app/build.gradle" || true

          echo "Application ID :"
          grep -n "applicationId" "$PROJECT_DIR/app/build.gradle" || true

      - name: "Vérifier Firebase"
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "google-services.json trouvé dans le projet V15."
          elif [ -f "./google-services (2).json" ]; then
            echo "google-services (2).json trouvé à la racine."

            cp "./google-services (2).json" \
              "$PROJECT_DIR/app/google-services.json"

          elif [ -f "./google-services.json" ]; then
            echo "google-services.json trouvé à la racine."

            cp "./google-services.json" \
              "$PROJECT_DIR/app/google-services.json"

          else
            echo "ERREUR : configuration Firebase introuvable."
            exit 1
          fi

          echo "Firebase est prêt."

      - name: "Préparer la clé de signature"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Création de la clé de signature..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : secret KEYSTORE_BASE64 manquant."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERREUR : release-keystore.jks vide ou invalide."
            exit 1
          fi

          echo "Vérification de la clé..."

          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "youngest_business" > /dev/null

          echo "Clé de signature vérifiée avec succès."

      - name: "Construire l'APK V15 Release"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "youngest_business"
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "Construction de YOUNGEST'S BUSINESS V15..."
          echo "Module : TRANSFERT MOBILE MONEY RDC"
          echo "Devise : FC"

          gradle -p "$PROJECT_DIR" clean

          gradle -p "$PROJECT_DIR" :app:assembleRelease --stacktrace

          echo "Construction V15 terminée."

      - name: "Vérifier l'APK"
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK Release introuvable."
            exit 1
          fi

          echo "APK trouvé : $APK"

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$APK"

          echo "Signature APK vérifiée avec succès."

      - name: "Renommer l'APK V15"
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)

          cp "$APK" \
            "$PROJECT_DIR/app/build/outputs/apk/release/YOUNGEST-BUSINESS-V15-TRANSFERT-MOBILE-MONEY-RDC.apk"

          echo "APK V15 préparé."

      - name: "Publier l'APK V15"
        uses: actions/upload-artifact@v4
        with:
          name: "YOUNGEST-BUSINESS-V15-TRANSFERT-MOBILE-MONEY-RDC"
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/YOUNGEST-BUSINESS-V15-TRANSFERT-MOBILE-MONEY-RDC.apk"
          if-no-files-found: error
