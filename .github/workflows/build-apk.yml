name: Build Android APK V16 Mobile Money RDC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V16 Mobile Money RDC
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver le ZIP V16
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f \
            -name 'YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC*.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP V16 introuvable."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP V16 trouvé : $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraire le projet V16
        shell: bash
        run: |
          set -e

          rm -rf v16-extracted
          mkdir -p v16-extracted

          unzip -o "${{ steps.find_zip.outputs.zip }}" \
            -d v16-extracted

          echo "Contenu extrait :"
          find v16-extracted -maxdepth 3 -type f | sort | head -200

      - name: Détecter le projet Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find v16-extracted -name settings.gradle -o -name settings.gradle.kts \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : settings.gradle introuvable."
            exit 1
          fi

          echo "Projet Android : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Vérifier le projet V16
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== settings.gradle ====="
          cat settings.gradle || true

          echo "===== build.gradle ====="
          cat build.gradle || true

          echo "===== app/build.gradle ====="
          cat app/build.gradle

          echo "===== README V16 ====="
          cat README-V16-TRANSFERT-MOBILE-MONEY-RDC.md || true

      - name: Configurer Firebase
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "google-services.json" ]; then
            echo "google-services.json déjà présent à la racine."
          elif [ -f "app/google-services.json" ]; then
            echo "google-services.json déjà présent dans app/."
          else
            SOURCE=$(find "$GITHUB_WORKSPACE" -type f \
              -name 'google-services.json' \
              | head -n 1)

            if [ -z "$SOURCE" ]; then
              echo "AVERTISSEMENT : google-services.json introuvable."
            else
              cp "$SOURCE" app/google-services.json
              echo "Firebase configuré depuis : $SOURCE"
            fi
          fi

      - name: Préparer le keystore de release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : le Secret KEYSTORE_BASE64 est vide ou absent."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERREUR : release-keystore.jks est vide."
            exit 1
          fi

          echo "Keystore créé avec succès."

      - name: Vérifier l'alias du keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Vérification du keystore..."

          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -q "youngestbusiness"

          echo "Alias youngestbusiness trouvé dans le keystore."

      - name: Nettoyer le projet V16
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --no-daemon

      - name: Construire l'APK Release V16
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: youngestbusiness
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Construction de l'APK V16..."
          echo "Alias utilisé : youngestbusiness"

          gradle :app:assembleRelease --no-daemon

      - name: Vérifier l'APK V16
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK V16 introuvable."
            exit 1
          fi

          echo "APK trouvé : $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Vérifier la signature APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$PROJECT_DIR/$APK_PATH"

          echo "Signature APK valide."

      - name: Afficher les informations finales
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== APK FINAL V16 ====="
          ls -lh "$APK_PATH"

          echo "===== APPLICATION ID ====="
          grep -n "applicationId" app/build.gradle || true

          echo "===== VERSION ====="
          grep -n "versionName" app/build.gradle || true

      - name: Publier APK V16
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
