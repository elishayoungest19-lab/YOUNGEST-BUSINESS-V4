name: Build YOUNGEST'S BUSINESS V35 Admin Cards Real Chat FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build and verify signed V35 ADMIN CARDS REAL CHAT APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE DU VRAI PROJET ANDROID
      #
      # IMPORTANT :
      # V35 ne recherche PLUS aucun ZIP V34.
      # Le build travaille directement sur le projet du dépôt.
      # =========================================================

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          echo "========================================="
          echo "       RECHERCHE PROJET ANDROID V35"
          echo "========================================="

          SETTINGS="$(
            find "$ROOT" \
              -maxdepth 4 \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Aucun settings.gradle trouvé à la racine du dépôt."
            echo ""
            echo "Structure trouvée :"
            find "$ROOT" -maxdepth 3 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android détecté :"
          echo "$PROJECT_DIR"

          echo ""
          echo "========================================="
          echo "        PROJET V35 DÉTECTÉ"
          echo "========================================="

      # =========================================================
      # VERIFICATION GRADLE
      # =========================================================

      - name: Verify Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "          VERIFICATION GRADLE"
          echo "========================================="

          gradle --version

          echo ""
          echo "Gradle disponible : OK"

      # =========================================================
      # IDENTITE EXACTE V35
      #
      # LE BUILD DOIT ÊTRE RÉELLEMENT V35.
      # AUCUN V34 NE SERA ACCEPTÉ.
      # =========================================================

      - name: Verify exact V35 identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          echo "========================================="
          echo "        IDENTITE EXACTE V35"
          echo "========================================="

          test -f "$GRADLE_FILE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Eq \
            'versionCode[[:space:]]+35([[:space:]]|$)' \
            "$GRADLE_FILE" || {
              echo "::error::VERSIONCODE 35 ABSENT."
              echo "Le projet est probablement encore en V34."
              exit 1
          }

          grep -Fq \
            "versionName '1.28.0'" \
            "$GRADLE_FILE" || {
              echo "::error::versionName 1.28.0 absent."
              exit 1
          }

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE_FILE" || {
              echo "::error::applicationId incorrect."
              exit 1
          }

          grep -Fq \
            "namespace 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE_FILE" || {
              echo "::error::namespace incorrect."
              exit 1
          }

          echo ""
          echo "versionCode 35 : OK"
          echo "versionName 1.28.0 : OK"
          echo "applicationId : OK"
          echo "namespace : OK"

      # =========================================================
      # FICHIERS PRINCIPAUX
      # =========================================================

      - name: Verify V35 project files
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"
          GOOGLE="$PROJECT_DIR/app/google-services.json"

          echo "========================================="
          echo "       VERIFICATION FICHIERS V35"
          echo "========================================="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java introuvable."
            exit 1
          }

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js introuvable."
            exit 1
          }

          test -f "$GOOGLE" || {
            echo "::error::google-services.json introuvable."
            exit 1
          }

          echo "MainActivity.java : OK"
          echo "AppNotificationService.java : OK"
          echo "firestore.rules : OK"
          echo "functions/index.js : OK"
          echo "google-services.json : OK"

      # =========================================================
      # PROTECTION DE L'INTERFACE ADMIN
      #
      # ON NE MODIFIE PAS L'INTERFACE.
      # ON VÉRIFIE SIMPLEMENT QUE LES CARTES EXISTENT.
      # =========================================================

      - name: Verify existing Admin Cards interface
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "       PROTECTION INTERFACE ADMIN"
          echo "========================================="

          grep -Fq \
            'TABLEAU DE BORD' \
            "$MAIN" || {
              echo "::error::Carte TABLEAU DE BORD absente."
              exit 1
          }

          grep -Fq \
            'GESTION DES CLIENTS' \
            "$MAIN" || {
              echo "::error::Carte GESTION DES CLIENTS absente."
              exit 1
          }

          grep -Fq \
            'GESTION DES PRÊTS' \
            "$MAIN" || {
              echo "::error::Carte GESTION DES PRÊTS absente."
              exit 1
          }

          grep -Fq \
            'REMBOURSEMENTS' \
            "$MAIN" || {
              echo "::error::Carte REMBOURSEMENTS absente."
              exit 1
          }

          grep -Fq \
            'DEMANDES DE PRÊTS CLIENTS' \
            "$MAIN" || {
              echo "::error::Carte DEMANDES DE PRÊTS CLIENTS absente."
              exit 1
          }

          grep -Fq \
            'CONTACTEZ-NOUS' \
            "$MAIN" || {
              echo "::error::Carte CONTACTEZ-NOUS absente."
              exit 1
          }

          echo ""
          echo "TABLEAU DE BORD : OK"
          echo "GESTION DES CLIENTS : OK"
          echo "GESTION DES PRÊTS : OK"
          echo "REMBOURSEMENTS : OK"
          echo "DEMANDES DE PRÊTS CLIENTS : OK"
          echo "CONTACTEZ-NOUS : OK"

          echo ""
          echo "========================================="
          echo "       INTERFACE ADMIN PRÉSERVÉE"
          echo "========================================="

      # =========================================================
      # VERIFICATION DU VRAI CHEMIN CHAT CLIENT
      # =========================================================

      - name: Verify real client Chat delivery path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "     VERIFICATION VRAI CHAT CLIENT"
          echo "========================================="

          # Bouton ENVOYER / brouillon
          grep -Fq \
            'persistPendingChatDraft' \
            "$MAIN" || {
              echo "::error::persistPendingChatDraft absent."
              exit 1
          }

          # Entrée Chat
          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {
              echo "::error::openChatEntry() absent."
              exit 1
          }

          # Numéro client
          grep -Fq \
            'requestChatPhoneNumber()' \
            "$MAIN" || {
              echo "::error::requestChatPhoneNumber() absent."
              exit 1
          }

          # Firebase Anonymous
          grep -Fq \
            'signInAnonymously' \
            "$MAIN" || {
              echo "::error::Firebase Anonymous Authentication absente."
              exit 1
          }

          # Numéro conservé
          grep -Fq \
            'KEY_PENDING_CHAT_PHONE' \
            "$MAIN" || {
              echo "::error::KEY_PENDING_CHAT_PHONE absent."
              exit 1
          }

          # Ouverture / création
          grep -Fq \
            'openOrCreateClientConversation()' \
            "$MAIN" || {
              echo "::error::openOrCreateClientConversation() absent."
              exit 1
          }

          # Recherche propriétaire
          grep -Fq \
            'whereEqualTo("ownerUid"' \
            "$MAIN" || {
              echo "::error::whereEqualTo(ownerUid) absent."
              exit 1
          }

          # Création
          grep -Fq \
            'createConversationAndSendDraft' \
            "$MAIN" || {
              echo "::error::createConversationAndSendDraft() absent."
              exit 1
          }

          # Conversation créée avant le message
          grep -Fq \
            'conversation.set(c)' \
            "$MAIN" || {
              echo "::error::conversation.set(c) absent."
              exit 1
          }

          # Message après création de conversation
          grep -Fq \
            'message.set(msg)' \
            "$MAIN" || {
              echo "::error::message.set(msg) absent."
              exit 1
          }

          echo ""
          echo "persistPendingChatDraft : OK"
          echo "openChatEntry : OK"
          echo "Firebase Anonymous Auth : OK"
          echo "requestChatPhoneNumber : OK"
          echo "KEY_PENDING_CHAT_PHONE : OK"
          echo "openOrCreateClientConversation : OK"
          echo "whereEqualTo(ownerUid) : OK"
          echo "createConversationAndSendDraft : OK"
          echo "conversation.set(c) : OK"
          echo "message.set(msg) : OK"

          echo ""
          echo "========================================="
          echo "      CHEMIN CHAT CLIENT VALIDÉ"
          echo "========================================="

      # =========================================================
      # VERIFICATION CHAT ADMIN
      # =========================================================

      - name: Verify Chat administration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "       VERIFICATION CHAT ADMIN"
          echo "========================================="

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {
              echo "::error::adminChatInbox() absent."
              exit 1
          }

          grep -Fq \
            'FIREBASE_ADMIN_EMAIL.equalsIgnoreCase' \
            "$MAIN" || {
              echo "::error::Identification Admin absente."
              exit 1
          }

          grep -Fq \
            'yb_chat_conversations' \
            "$MAIN" || {
              echo "::error::yb_chat_conversations absent."
              exit 1
          }

          grep -Fq \
            'Collections.sort(docs' \
            "$MAIN" || {
              echo "::error::Tri conversations Admin absent."
              exit 1
          }

          echo "adminChatInbox : OK"
          echo "Identification Admin : OK"
          echo "yb_chat_conversations : OK"
          echo "Tri conversations : OK"

      # =========================================================
      # VERIFICATION FIRESTORE RULES
      # =========================================================

      - name: Verify Firebase rules for real Chat
        shell: bash
        run: |
          set -euo pipefail

          RULES="$PROJECT_DIR/firestore.rules"

          echo "========================================="
          echo "       VERIFICATION REGLES FIREBASE"
          echo "========================================="

          grep -Fq \
            'function isSignedIn()' \
            "$RULES" || {
              echo "::error::isSignedIn() absent."
              exit 1
          }

          grep -Fq \
            'function isAdmin()' \
            "$RULES" || {
              echo "::error::isAdmin() absent."
              exit 1
          }

          grep -Fq \
            'StxrZBDeUodj7YVPmXRA2AbWcUF2' \
            "$RULES" || {
              echo "::error::UID Admin absent."
              exit 1
          }

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$RULES" || {
              echo "::error::Email Admin absent."
              exit 1
          }

          grep -Fq \
            'match /yb_chat_conversations/' \
            "$RULES" || {
              echo "::error::Collection Chat absente."
              exit 1
          }

          grep -Fq \
            'request.resource.data.ownerUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::ownerUid absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.phone is string' \
            "$RULES" || {
              echo "::error::phone absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.status == "OPEN"' \
            "$RULES" || {
              echo "::error::status OPEN absent."
              exit 1
          }

          grep -Fq \
            'match /messages/{messageId}' \
            "$RULES" || {
              echo "::error::Sous-collection messages absente."
              exit 1
          }

          grep -Fq \
            'function parentConversation()' \
            "$RULES" || {
              echo "::error::parentConversation() absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::senderUid absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderRole == "client"' \
            "$RULES" || {
              echo "::error::senderRole client absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderRole == "admin"' \
            "$RULES" || {
              echo "::error::senderRole admin absent."
              exit 1
          }

          grep -Fq \
            'match /yb_notification_tokens/' \
            "$RULES" || {
              echo "::error::Règle tokens notification absente."
              exit 1
          }

          echo ""
          echo "Rules Auth : OK"
          echo "Rules Admin : OK"
          echo "Rules Conversations : OK"
          echo "Rules Messages : OK"
          echo "Rules Notifications : OK"

          echo ""
          echo "========================================="
          echo "       REGLES FIREBASE VALIDÉES"
          echo "========================================="

      # =========================================================
      # VERIFICATION NOTIFICATIONS
      # =========================================================

      - name: Verify Firebase notifications
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "========================================="
          echo "       VERIFICATION NOTIFICATIONS"
          echo "========================================="

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {
              echo "::error::FirebaseMessagingService absent."
              exit 1
          }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {
              echo "::error::onMessageReceived absent."
              exit 1
          }

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {
              echo "::error::onDocumentCreated absent."
              exit 1
          }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {
              echo "::error::notifyClientWhenAdminReplies absent."
              exit 1
          }

          node --check "$FUNCTIONS"

          echo "FirebaseMessagingService : OK"
          echo "onMessageReceived : OK"
          echo "onDocumentCreated : OK"
          echo "notifyClientWhenAdminReplies : OK"
          echo "Cloud Functions syntax : OK"

      # =========================================================
      # CONFIGURATION SIGNATURE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "       CONFIGURATION SIGNATURE V35"
          echo "========================================="

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secrets de signature manquants."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | b
