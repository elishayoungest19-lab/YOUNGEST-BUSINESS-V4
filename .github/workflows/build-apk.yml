name: "Build YOUNGEST'S BUSINESS V8 APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V8"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4


      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: ""


      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"


      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation des composants Android..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Composants Android installés."


      - name: "Décompresser le projet V8"
        shell: bash
        run: |
          set -e

          ZIP_FILE="./YOUNGEST-BUSINESS-V8-SECURISEE.zip"

          echo "Recherche du fichier V8..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : le fichier V8 est introuvable."
            echo "Fichiers présents dans le dépôt :"
            ls -lh
            exit 1
          fi

          echo "ZIP V8 trouvé : $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/settings.gradle" ]; then
            echo "ERREUR : settings.gradle introuvable."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Projet Android V8 détecté."

          rm -rf app
          rm -rf gradle

          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties

          cp -a extracted/app .
          cp -a extracted/gradle .
          cp -a extracted/build.gradle .
          cp -a extracted/settings.gradle .
          cp -a extracted/gradle.properties .

          echo "Projet V8 préparé."


      - name: "Préparer le keystore V8"
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Préparation du keystore de signature..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : KEYSTORE_BASE64 est vide."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          chmod 600 release-keystore.jks

          echo "Keystore V8 préparé."

          ls -lh release-keystore.jks


      - name: "Vérifier Gradle"
        shell: bash
        run: |
          set -e
          gradle --version


      - name: "Nettoyer le projet"
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "youngest_business"
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          gradle --no-daemon clean


      - name: "Construire l'APK Release V8 signé"
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "youngest_business"
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Construction de YOUNGEST'S BUSINESS V8..."

          gradle --no-daemon assembleRelease --stacktrace

          echo "Construction Release terminée."


      - name: "Vérifier la signature de l'APK V8"
        shell: bash
        run: |
          set -e

          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERREUR : APK Release introuvable."
            echo "APK disponibles :"
            find app/build/outputs/apk -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK trouvé : $APK_FILE"

          echo "Vérification de la signature..."

          apksigner verify \
            --verbose \
            "$APK_FILE"

          echo "Signature V8 validée."


      - name: "Afficher l'APK final"
        shell: bash
        run: |
          set -e

          APK_FILE="app/build/outputs/apk/release/app-release.apk"

          echo "========================================"
          echo "YOUNGEST'S BUSINESS V8"
          echo "APK Release signé"
          echo "========================================"

          ls -lh "$APK_FILE"

          test -f "$APK_FILE"


      - name: "Publier l'APK V8"
        uses: actions/upload-artifact@v4
        with:
          name: "YOUNGEST-BUSINESS-V8-RELEASE"
          path: "app/build/outputs/apk/release/app-release.apk"
          if-no-files-found: error
