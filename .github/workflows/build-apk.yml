name: Build Android APK V23 Journal Mobile Money

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK V23 Journal Mobile Money
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver le ZIP V23 Journal Mobile Money
        id: find_zip
        shell: bash
        run: |
          set -e
          ZIP_NAME='YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY.zip'
          ZIP_PATH=$(find . -maxdepth 4 -type f -name "$ZIP_NAME" -print -quit)
          if [ -z "$ZIP_PATH" ]; then
            echo "ERREUR: ZIP introuvable. Televerse $ZIP_NAME a la racine du depot GitHub."
            echo "Fichiers ZIP trouves dans le depot:"
            find . -maxdepth 4 -type f -iname '*.zip' -print || true
            exit 1
          fi
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP V23 selectionne: $ZIP_PATH"

      - name: Extraire le projet V23
        shell: bash
        run: |
          set -e
          rm -rf v23-extracted
          mkdir -p v23-extracted
          unzip -q "$ZIP_PATH" -d v23-extracted

      - name: Detecter le projet Android
        shell: bash
        run: |
          set -e
          SETTINGS=$(find v23-extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERREUR: fichier settings.gradle introuvable dans le ZIP V23."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERREUR: configuration Gradle du module app introuvable."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android detecte: $PROJECT_DIR"

      - name: Configurer Firebase
        shell: bash
        run: |
          set -e
          if [ -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "Firebase deja configure dans app/."
          elif [ -f "$PROJECT_DIR/google-services.json" ]; then
            cp "$PROJECT_DIR/google-services.json" "$PROJECT_DIR/app/google-services.json"
          else
            SOURCE=$(find "$GITHUB_WORKSPACE" -type f -name google-services.json -print -quit)
            if [ -n "$SOURCE" ]; then
              cp "$SOURCE" "$PROJECT_DIR/app/google-services.json"
            else
              echo "ERREUR: google-services.json introuvable."
              exit 1
            fi
          fi

      - name: Verifier identite et journal V23
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          GRADLE_FILE=app/build.gradle
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE=app/build.gradle.kts
          grep -q 'com.aistudio.youngestbiz.mbkz' "$GRADLE_FILE"
          grep -q 'versionCode 23' "$GRADLE_FILE" || grep -q 'versionCode = 23' "$GRADLE_FILE"
          grep -q 'moneyJournalPage' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'ENREGISTRER UN ENVOI EFFECTUÉ' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          echo "Identite et fonctions principales du journal verifiees."

      - name: Preparer le keystore Release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo 'Secret KEYSTORE_BASE64 absent'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Secret KEYSTORE_PASSWORD absent'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Secret KEY_PASSWORD absent'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/release-keystore.jks"
          test -s "$PROJECT_DIR/release-keystore.jks"
          ALIAS=$(keytool -list -keystore "$PROJECT_DIR/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" -v 2>/dev/null | awk -F': ' '/Alias name:/ {print $2; exit}')
          test -n "$ALIAS" || { echo 'Alias du keystore introuvable'; exit 1; }
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Nettoyer et compiler V23 Release
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean :app:assembleRelease --no-daemon
          else
            gradle clean :app:assembleRelease --no-daemon
          fi

      - name: Verifier APK et signature
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo 'APK Release introuvable'; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.aistudio.youngestbiz.mbkz'"
          mkdir -p release-apk
          cp "$APK" release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk
          ls -lh release-apk/

      - name: Publier APK V23 Release
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE
          path: release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
