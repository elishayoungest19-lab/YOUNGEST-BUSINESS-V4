name: "Build YOUNGEST BUSINESS V16 Mobile Money RDC"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V16 Mobile Money RDC"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: "Installer les composants Android"
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Trouver le ZIP V16"
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : ZIP V16 introuvable."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP V16 trouvé : $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: "Extraire le projet V16"
        shell: bash
        run: |
          set -e

          rm -rf v16-extracted
          mkdir -p v16-extracted

          unzip -q "$ZIP_FILE" -d v16-extracted

          echo "Projet V16 extrait."

      - name: "Détecter le projet Android"
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/v16-extracted" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : projet Android introuvable."
            find "$GITHUB_WORKSPACE/v16-extracted" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet Android : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: "Vérifier le projet V16"
        shell: bash
        run: |
          echo "=== PROJET V16 ==="
          echo "$PROJECT_DIR"
          echo "=== FICHIERS ==="
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: "Configurer Firebase"
        shell: bash
        run: |
          set -e

          FIREBASE=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname "google-services*.json" | head -1 || true)

          if [ -n "$FIREBASE" ]; then
            mkdir -p "$PROJECT_DIR/app"
            cp "$FIREBASE" "$PROJECT_DIR/app/google-services.json"
            echo "Firebase configuré."
          else
            echo "Configuration Firebase déjà présente ou non nécessaire."
          fi

      - name: "Rendre Gradle exécutable"
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew" 2>/dev/null || true

      - name: "Nettoyer le projet V16"
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean --no-daemon

      - name: "Construire APK Release V16"
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: "Préparer APK V16"
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK V16 introuvable."
            exit 1
          fi

          mkdir -p final-apk

          cp "$APK" "final-apk/YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC.apk"

          echo "APK V16 préparé :"
          ls -lh "final-apk/YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC.apk"

      - name: "Vérifier la signature"
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "final-apk/YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC.apk"

      - name: "Publier APK V16"
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC
          path: final-apk/YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC.apk
          if-no-files-found: error
