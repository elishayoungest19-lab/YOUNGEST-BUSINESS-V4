name: "Build YOUNGEST'S BUSINESS V13 Client Bureau Firebase APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V13 Client Bureau Firebase"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation de platform-tools..."
          sdkmanager "platform-tools"

          echo "Installation de la plateforme Android 35..."
          sdkmanager "platforms;android-35"

          echo "Installation de Build Tools 35.0.0..."
          sdkmanager "build-tools;35.0.0"

          echo "Composants Android installés avec succès."

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Décompresser le projet V13 Client Bureau Firebase"
        shell: bash
        run: |
          set -e

          echo "Recherche automatique du fichier ZIP V13..."

          echo "Fichiers ZIP présents dans le dépôt :"
          find . -maxdepth 2 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "*V13*CLIENT*BUREAU*FIREBASE*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP V13 Client Bureau Firebase trouvé."
            echo ""
            echo "ZIP disponibles dans le dépôt :"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP V13 trouvé :"
          echo "$ZIP_FILE"

          rm -rf ./v13-extracted
          mkdir -p ./v13-extracted

          echo "Décompression du projet V13..."
          unzip -o "$ZIP_FILE" -d ./v13-extracted

          echo "Décompression terminée avec succès."

      - name: "Préparer le projet Android V13"
        shell: bash
        run: |
          set -e

          echo "Recherche du projet Android..."

          if [ -f "./v13-extracted/settings.gradle" ]; then
            PROJECT_DIR="./v13-extracted"

          elif [ -f "./v13-extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="./v13-extracted"

          elif [ -f "./v13-extracted/v13-project/settings.gradle" ]; then
            PROJECT_DIR="./v13-extracted/v13-project"

          elif [ -f "./v13-extracted/v13-project/settings.gradle.kts" ]; then
            PROJECT_DIR="./v13-extracted/v13-project"

          else
            PROJECT_DIR=$(find ./v13-extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERREUR : aucun projet Android contenant settings.gradle n'a été trouvé."
              echo ""
              echo "Contenu extrait :"
              find ./v13-extracted -maxdepth 4 -type f | head -200
              exit 1
            fi
          fi

          echo "Projet Android trouvé : $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERREUR : le dossier app est introuvable dans $PROJECT_DIR"
            exit 1
          fi

          echo "Dossier app trouvé avec succès."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: "Afficher la structure du projet"
        shell: bash
        run: |
          set -e

          echo "Projet sélectionné : $PROJECT_DIR"
          echo ""

          echo "Fichiers principaux :"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -200

      - name: "Installer la configuration Firebase"
        shell: bash
        run: |
          set -e

          echo "Recherche du google-services.json..."

          if [ -f "./google-services (2).json" ]; then
            echo "Configuration Firebase trouvée à la racine."
            cp "./google-services (2).json" "$PROJECT_DIR/app/google-services.json"

          elif [ -f "./google-services.json" ]; then
            echo "Configuration Firebase trouvée à la racine."
            cp "./google-services.json" "$PROJECT_DIR/app/google-services.json"

          elif [ -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "Configuration Firebase déjà présente dans le projet."

          else
            echo "ERREUR : google-services.json est introuvable."
            exit 1
          fi

          echo "Configuration Firebase installée."

          ls -lh "$PROJECT_DIR/app/google-services.json"

      - name: "Vérifier la configuration Firebase"
        shell: bash
        run: |
          set -e

          FIREBASE_FILE="$PROJECT_DIR/app/google-services.json"

          echo "Vérification de la configuration Firebase..."

          if [ ! -f "$FIREBASE_FILE" ]; then
            echo "ERREUR : google-services.json introuvable."
            exit 1
          fi

          echo "google-services.json trouvé."

          echo "Recherche du package Android configuré..."

          grep -o '"package_name"[[:space:]]*:[[:space:]]*"[^"]*"' \
            "$FIREBASE_FILE" || true

          echo "Configuration Firebase vérifiée."

      - name: "Préparer la clé de signature"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Préparation de la clé de signature..."

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          echo "Vérification de la clé de signature..."

          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "youngest_business" > /dev/null

          echo "Clé de signature vérifiée avec succès."

      - name: "Construire l'APK V13 Client Bureau Firebase"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "youngest_business"
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Version de Gradle :"
          gradle --version

          echo ""
          echo "Nettoyage du projet..."
          gradle clean

          echo ""
          echo "Construction de l'APK V13..."
          gradle assembleRelease

          echo ""
          echo "Construction V13 terminée avec succès."

      - name: "Vérifier l'APK V13"
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "Recherche de l'APK..."

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK V13 introuvable."
            echo ""
            echo "APK disponibles :"
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK V13 trouvé :"
          ls -lh "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo ""
          echo "Vérification de la signature..."

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "APK V13 signé et vérifié avec succès."

      - name: "Afficher les informations de l'APK"
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo "       YOUNGEST'S BUSINESS - V13"
          echo "       CLIENT + BUREAU + FIREBASE"
          echo "=============================================="
          echo ""

          echo "APK :"
          ls -lh "$APK"

          echo ""
          echo "Chemin :"
          echo "$APK"

          echo ""
          echo "Construction terminée avec succès."

      - name: "Publier l'APK V13 Client Bureau Firebase"
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V13-CLIENT-BUREAU-FIREBASE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
