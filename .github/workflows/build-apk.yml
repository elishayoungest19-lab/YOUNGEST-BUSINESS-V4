name: Build YOUNGEST'S BUSINESS V23 Journal Mobile Money

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose V23 project structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose project files
        shell: bash
        run: |
          set -u

          echo "======================================"
          echo "1. REPOSITORY ROOT"
          echo "======================================"
          pwd
          ls -la

          echo "======================================"
          echo "2. GRADLE PROJECT FILES"
          echo "======================================"
          find . -maxdepth 5 -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name gradlew \
          \) -print

          echo "======================================"
          echo "3. MAIN ACTIVITY AND FIREBASE CONFIG"
          echo "======================================"
          find . -type f \( \
            -name MainActivity.java \
            -o -name google-services.json \
          \) -print

          echo "======================================"
          echo "4. APP VERSION"
          echo "======================================"
          find . -type f -path '*/app/build.gradle' \
            -exec grep -nE 'versionCode|versionName' {} \; || true

          find . -type f -path '*/app/build.gradle.kts' \
            -exec grep -nE 'versionCode|versionName' {} \; || true

          echo "======================================"
          echo "5. JOURNAL AND TRANSFER METHODS"
          echo "======================================"
          find . -type f -name MainActivity.java \
            -exec grep -nE 'JOURNAL ENVOIS|moneyJournalForm|void transfers' {} \; || true

          echo "======================================"
          echo "DIAGNOSTIC FINISHED"
          echo "No APK was built in this diagnostic run."
          echo "======================================"
