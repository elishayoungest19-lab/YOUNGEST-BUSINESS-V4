name: "Build YOUNGEST'S BUSINESS V11 Sync Payment Firebase APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V11 Sync Payment Firebase"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4


      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: ""


      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation de platform-tools..."
          sdkmanager "platform-tools"

          echo "Installation de la plateforme Android 35..."
          sdkmanager "platforms;android-35"

          echo "Installation de Build Tools 35.0.0..."
          sdkmanager "build-tools;35.0.0"

          echo "Composants Android installés avec succès."


      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      - name: "Décompresser le projet V11 Sync Payment Firebase"
        shell: bash
        run: |
          set -e

          ZIP_FILE="./YOUNGEST-BUSINESS-V11-SYNC-PAYMENT-FIREBASE.zip"

          echo "Recherche du fichier V11 Firebase..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : le fichier V11 Firebase est introuvable."
            echo "Contenu du dépôt :"
            ls -lah
            exit 1
          fi

          echo "Fichier V11 trouvé :"
          ls -lh "$ZIP_FILE"

          rm -rf ./v11-extracted
          mkdir -p ./v11-extracted

          echo "Décompression du projet V11..."
          unzip -o "$ZIP_FILE" -d ./v11-extracted

          echo "Décompression terminée."

          echo "Contenu extrait :"
          find ./v11-extracted -maxdepth 3 -type f | head -100


      - name: "Préparer le projet Android V11"
        shell: bash
        run: |
          set -e

          echo "Recherche du projet Android V11..."

          if [ -d "./v11-extracted/v11-project" ]; then

            PROJECT_DIR="./v11-extracted/v11-project"

          elif [ -d "./v11-extracted/YOUNGEST-BUSINESS-V11-SYNC-PAYMENT-FIREBASE" ]; then

            PROJECT_DIR="./v11-extracted/YOUNGEST-BUSINESS-V11-SYNC-PAYMENT-FIREBASE"

          elif [ -f "./v11-extracted/settings.gradle" ]; then

            PROJECT_DIR="./v11-extracted"

          elif [ -f "./v11-extracted/settings.gradle.kts" ]; then

            PROJECT_DIR="./v11-extracted"

          else

            PROJECT_DIR=$(find ./v11-extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)

          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android V11 introuvable."
            echo "Arborescence complète :"
            find ./v11-extracted -maxdepth 5 -print
            exit 1
          fi

          echo "Projet Android trouvé : $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERREUR : dossier app introuvable."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: "Installer la configuration Firebase"
        shell: bash
        run: |
          set -e

          echo "Installation de google-services.json..."

          if [ -f "./google-services (2).json" ]; then

            cp "./google-services (2).json" \
              "$PROJECT_DIR/app/google-services.json"

          elif [ -f "./google-services.json" ]; then

            cp "./google-services.json" \
              "$PROJECT_DIR/app/google-services.json"

          elif [ -f "$PROJECT_DIR/app/google-services.json" ]; then

            echo "google-services.json déjà présent dans le projet V11."

          else

            echo "ERREUR : google-services.json introuvable."
            exit 1

          fi

          echo "Configuration Firebase installée."

          ls -lh "$PROJECT_DIR/app/google-services.json"


      - name: "Vérifier la configuration Firebase"
        shell: bash
        run: |
          set -e

          FIREBASE_FILE="$PROJECT_DIR/app/google-services.json"

          if [ ! -s "$FIREBASE_FILE" ]; then
            echo "ERREUR : google-services.json est vide ou absent."
            exit 1
          fi

          echo "Configuration Firebase détectée."

          if grep -q '"project_id"' "$FIREBASE_FILE"; then
            echo "Project Firebase détecté."
          else
            echo "ERREUR : project_id Firebase introuvable."
            exit 1
          fi


      - name: "Préparer la clé de signature"
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Préparation de la clé de signature..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : KEYSTORE_BASE64 est absent."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          echo "Vérification de l'alias de signature..."

          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "youngest_business" > /dev/null

          echo "Clé de signature prête."


      - name: "Construire l'APK V11 Sync Payment Firebase"
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "youngest_business"
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Version de Gradle :"
          gradle --version

          echo "Nettoyage du projet..."
          gradle clean

          echo "Construction de l'APK V11..."
          gradle assembleRelease

          echo "Construction V11 terminée."


      - name: "Vérifier l'APK V11"
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK V11 introuvable."
            exit 1
          fi

          echo "APK V11 trouvé :"
          ls -lh "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "Vérification de la signature..."

          "$APKSIGNER" verify --verbose "$APK"

          echo "Signature APK V11 vérifiée avec succès."


      - name: "Afficher les informations APK V11"
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "=========================================="
          echo "YOUNGEST'S BUSINESS V11"
          echo "SYNC + PAYMENT + FIREBASE"
          echo "=========================================="

          ls -lh "$APK"

          echo "APK prêt."


      - name: "Publier l'APK V11 Sync Payment Firebase"
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V11-SYNC-PAYMENT
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
