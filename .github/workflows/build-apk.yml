name: Build Android APK V23 Journal Mobile Money

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK V23 Journal Mobile Money
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurer Android Build Tools
        shell: bash
        run: |
          set -e
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver le ZIP V23 corrige
        id: find_zip
        shell: bash
        run: |
          set -e
          ZIP_NAME="YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-CORRIGE.zip"
          ZIP_PATH=$(find . -maxdepth 4 -type f -name "$ZIP_NAME" -print -quit)
          if [ -z "$ZIP_PATH" ]; then
            echo "ERREUR: ZIP V23 corrige introuvable: $ZIP_NAME"
            echo "Archives ZIP presentes dans le depot:"
            find . -maxdepth 4 -type f -iname '*.zip' -print | sort || true
            exit 1
          fi
          echo "ZIP V23 selectionne: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extraire le projet V23
        shell: bash
        run: |
          set -e
          rm -rf v23-extracted
          mkdir -p v23-extracted
          unzip -q "${{ steps.find_zip.outputs.zip_path }}" -d v23-extracted
          echo "Extraction terminee."

      - name: Detecter le projet Android
        shell: bash
        run: |
          set -e
          SETTINGS=$(find v23-extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERREUR: aucun settings.gradle(.kts) trouve dans le ZIP V23."
            find v23-extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERREUR: fichier Gradle du module app introuvable dans $PROJECT_DIR."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android detecte: $PROJECT_DIR"

      - name: Configurer Firebase
        shell: bash
        run: |
          set -e
          if [ -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "google-services.json deja present dans app/."
          elif [ -f "$PROJECT_DIR/google-services.json" ]; then
            cp "$PROJECT_DIR/google-services.json" "$PROJECT_DIR/app/google-services.json"
          else
            SOURCE=$(find "$GITHUB_WORKSPACE" -type f -name google-services.json -print -quit)
            if [ -n "$SOURCE" ]; then
              mkdir -p "$PROJECT_DIR/app"
              cp "$SOURCE" "$PROJECT_DIR/app/google-services.json"
            else
              echo "ERREUR: google-services.json introuvable."
              exit 1
            fi
          fi

      - name: Verifier le projet et le journal V23
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          GRADLE_FILE="app/build.gradle"
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE="app/build.gradle.kts"
          grep -q "com.aistudio.youngestbiz.mbkz" "$GRADLE_FILE" || {
            echo "ERREUR: applicationId attendu introuvable."
            exit 1
          }
          MAIN=$(find app/src/main -type f -name MainActivity.java -print -quit)
          if [ -z "$MAIN" ]; then
            echo "ERREUR: MainActivity.java introuvable."
            exit 1
          fi
          grep -qi "moneyJournalPage\|Journal des envois\|ENREGISTRER UN ENVOI" "$MAIN" || {
            echo "ERREUR: marqueur du journal Mobile Money introuvable dans MainActivity."
            exit 1
          }
          echo "Application et marqueur du journal detectes."
          echo "Version Gradle declaree:"
          grep -nE "versionCode|versionName" "$GRADLE_FILE" || true

      - name: Preparer le keystore Release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "ERREUR: secret KEYSTORE_BASE64 absent."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERREUR: secret KEYSTORE_PASSWORD absent."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERREUR: secret KEY_PASSWORD absent."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/release-keystore.jks"
          test -s "$PROJECT_DIR/release-keystore.jks"
          keytool -list -keystore "$PROJECT_DIR/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          KEY_ALIAS=$(keytool -list -v -keystore "$PROJECT_DIR/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/ {print $2; exit}')
          test -n "$KEY_ALIAS" || { echo "ERREUR: alias du keystore introuvable."; exit 1; }
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "Keystore Release valide."

      - name: Nettoyer le projet
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Compiler APK V23 Release signe
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          SIGNING_ARGS=(
            "-Pandroid.injected.signing.store.file=$PROJECT_DIR/release-keystore.jks"
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          )
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon "${SIGNING_ARGS[@]}"
          else
            gradle :app:assembleRelease --no-daemon "${SIGNING_ARGS[@]}"
          fi

      - name: Verifier APK et signature
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ERREUR: APK Release introuvable."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.aistudio.youngestbiz.mbkz'"
          mkdir -p release-apk
          cp "$APK" release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk
          echo "APK V23 verifie:"
          ls -lh release-apk/

      - name: Publier APK V23 Release
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE
          path: release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
