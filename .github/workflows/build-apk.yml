
name: Build YOUNGEST'S BUSINESS V42 Android and Deploy V47 Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: youngestsbusiness
  V47_WEB_ZIP: "YOUNGEST-BUSINESS-V47-WEB-RAPPELS-AUTOMATIQUES-ECHEANCES-source (1).zip"

jobs:
  build-android:
    if: github.event_name != 'schedule'
    name: Build and verify V42 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V42 Android source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="YOUNGEST-BUSINESS-V42-ANDROID-RECHERCHE-HEURE-HISTORIQUE-ACTUALISATION-PDF-LOGO-source.zip"
          ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Archive Android V42 introuvable : $ZIP_NAME"
            find "$GITHUB_WORKSPACE" -type f -iname '*V42*ANDROID*.zip' -print || true
            exit 1
          fi

          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/v42-android"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/google-services.json"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set Android version V42
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s, c = re.subn(r"(?m)^([ \t]*versionCode[ \t]+)\d+([ \t]*)$", r"\g<1>42\g<2>", s, count=1)
          s, n = re.subn(r"""(?m)^([ \t]*versionName[ \t]+)['"][^'"]+['"]([ \t]*)$""", r"\g<1>'1.35.0'\g<2>", s, count=1)
          if c != 1 or n != 1:
              raise SystemExit("Impossible de définir versionCode/versionName.")
          p.write_text(s, encoding="utf-8")
          PY

          grep -Eq 'versionCode[[:space:]]+42([[:space:]]|$)' "$PROJECT_DIR/app/build.gradle"
          grep -Fq "versionName '1.35.0'" "$PROJECT_DIR/app/build.gradle"
          grep -Fq "applicationId 'com.aistudio.youngestbiz.mbkz'" "$PROJECT_DIR/app/build.gradle"

      - name: Verify Android and Firebase source
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"

          test -s "$MAIN"
          test -s "$SERVICE"
          test -s "$PROJECT_DIR/firestore.rules"
          test -s "$PROJECT_DIR/functions/index.js"
          test -s "$PROJECT_DIR/web-admin/app.js"

          grep -Fq 'createLumicashJournalEntry' "$PROJECT_DIR/functions/index.js"
          grep -Fq 'yb_lumicash_journal' "$PROJECT_DIR/firestore.rules"
          node --check "$PROJECT_DIR/functions/index.js"
          node --check "$PROJECT_DIR/web-admin/app.js"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          KEYSTORE_FILE="$PROJECT_DIR/release-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build signed V42 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean :app:assembleRelease --stacktrace

      - name: Verify APK version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"

          echo "$BADGING" | grep -Fq "package: name='com.aistudio.youngestbiz.mbkz'"
          echo "$BADGING" | grep -Fq "versionCode='42'"
          echo "$BADGING" | grep -Fq "versionName='1.35.0'"

      - name: Prepare V42 APK artifact
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" release-output/YOUNGEST-BUSINESS-V42.apk
          sha256sum release-output/YOUNGEST-BUSINESS-V42.apk > release-output/SHA256SUMS.txt

      - name: Upload V42 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V42-ANDROID
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

  deploy-web:
    if: github.event_name != 'schedule'
    name: Deploy V47 Web Admin and Firestore rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          npm install --global firebase-tools

      - name: Find and extract exact V47 Web ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$V47_WEB_ZIP"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Archive V47 attendue introuvable : $V47_WEB_ZIP"
            echo "Archives V47 présentes :"
            find "$GITHUB_WORKSPACE" -type f -iname '*V47*.zip' -print || true
            exit 1
          fi

          echo "Archive Web V47 sélectionnée : $V47_WEB_ZIP"
          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v47-web"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          CONFIG="$(find "$DEST" -type f -name firebase.json -print -quit)"
          test -n "$CONFIG"
          WEB_PROJECT_DIR="$(dirname "$CONFIG")"

          test -f "$WEB_PROJECT_DIR/.firebaserc"
          grep -q '"default": "youngestsbusiness"' "$WEB_PROJECT_DIR/.firebaserc"
          test -f "$WEB_PROJECT_DIR/firestore.rules"
          test -f "$WEB_PROJECT_DIR/web-admin/index.html"
          test -f "$WEB_PROJECT_DIR/web-admin/app.js"
          test -f "$WEB_PROJECT_DIR/web-admin/styles.css"

          echo "WEB_PROJECT_DIR=$WEB_PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V47 archive and reversible archive support
        shell: bash
        run: |
          set -euo pipefail
          APP="$WEB_PROJECT_DIR/web-admin/app.js"
          RULES="$WEB_PROJECT_DIR/firestore.rules"
          REMINDERS="$WEB_PROJECT_DIR/.github/scripts/process-due-reminders.js"

          node --check "$APP"
          test -s "$REMINDERS"
          node --check "$REMINDERS"

          grep -q 'yb_loan_contact_logs' "$APP"
          grep -q 'yb_loan_contact_logs' "$RULES"
          grep -q 'yb_admin_due_notifications' "$RULES"

          # Arrêter avant déploiement si le code d'archivage/restauration
          # n'est pas présent dans la source V47.
          if ! grep -Eiq 'archive|archiv|restore|restaur' "$APP"; then
            echo "::error::Fonction d'archivage/restauration non détectée dans app.js."
            exit 1
          fi

          echo "Contrôles V47 terminés."

      - name: Authenticate Firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"

          CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS"
          chmod 600 "$CREDENTIALS"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS" >> "$GITHUB_ENV"

      - name: Deploy V47 Hosting and Firestore rules
        working-directory: ${{ env.WEB_PROJECT_DIR }}
        run: |
          set -euo pipefail
          firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Verify live V47 Hosting response
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://youngestsbusiness.web.app/ \
            -o "$RUNNER_TEMP/v47-live-index.html"

          grep -qi 'YOUNGEST' "$RUNNER_TEMP/v47-live-index.html"
          echo "Réponse Hosting vérifiée : https://youngestsbusiness.web.app"

  process-due-reminders:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Process daily loan reminders without Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find and extract exact V47 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$V47_WEB_ZIP"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Archive V47 attendue introuvable : $V47_WEB_ZIP"
            find "$GITHUB_WORKSPACE" -type f -iname '*V47*.zip' -print || true
            exit 1
          fi

          DEST="$RUNNER_TEMP/v47-reminders"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          SCRIPT="$(find "$DEST" -type f -path '*/.github/scripts/process-due-reminders.js' -print -quit)"
          test -n "$SCRIPT"

          PROJECT_DIR="$(dirname "$(dirname "$(dirname "$SCRIPT")")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "REMINDER_SCRIPT=$SCRIPT" >> "$GITHUB_ENV"

      - name: Authenticate Firebase Admin SDK
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"

          CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS"
          chmod 600 "$CREDENTIALS"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS" >> "$GITHUB_ENV"

      - name: Install Firebase Admin SDK
        run: npm install --prefix "$PROJECT_DIR/functions" --no-audit --no-fund

      - name: Verify and process due reminders
        env:
          FIREBASE_PROJECT_ID: youngestsbusiness
        run: |
          set -euo pipefail
          node --check "$REMINDER_SCRIPT"
          node "$REMINDER_SCRIPT"
          
