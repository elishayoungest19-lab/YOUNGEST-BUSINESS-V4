
name: Build YOUNGEST'S BUSINESS V27 Chat Contactez-Nous

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V27 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V27 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_PATH=""

          for NAME in \
            "YOUNGEST-BUSINESS-V27-CHAT-CONTACTEZ-NOUS-source.zip" \
            "YOUNGEST-BUSINESS-V27-CHAT-CONTACTEZ-NOUS.zip"
          do
            ZIP_PATH="$(find "$ROOT" -type f -name "$NAME" \
              ! -path "$ROOT/release-output/*" -print -quit)"
            if [ -n "$ZIP_PATH" ]; then
              break
            fi
          done

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::V27 source ZIP not found."
            echo "Upload the V27 source ZIP to the repository root."
            find "$ROOT" -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Using source ZIP: $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v27-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Verify V27 source and chat markers
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          FIRESTORE="$PROJECT_DIR/firestore.rules"

          test -f "$MAIN" || {
            echo "::error::MainActivity.java missing."
            exit 1
          }

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle missing."
            exit 1
          }

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::app/google-services.json missing."
            exit 1
          }

          test -f "$FIRESTORE" || {
            echo "::error::firestore.rules missing."
            exit 1
          }

          grep -Eq 'versionCode[[:space:]]+27([[:space:]]|$)' "$GRADLE" || {
            echo "::error::versionCode 27 not found."
            exit 1
          }

          for MARKER in \
            'void services()' \
            'void journalPage()' \
            'openChatEntry()' \
            'adminChatInbox()' \
            'PhoneAuthProvider.verifyPhoneNumber(options)' \
            'CONTACTEZ-NOUS' \
            'RÉPONDRE AU CHAT'
          do
            if ! grep -Fq "$MARKER" "$MAIN"; then
              echo "::error::Required V27 source marker missing: $MARKER"
              exit 1
            fi
          done

          grep -Fq 'match /yb_chat_conversations/' "$FIRESTORE" || {
            echo "::error::Chat Firestore rules missing."
            exit 1
          }

          echo "V27 source checks passed."

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secrets."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(keytool -list -v \
              -keystore release-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
              sed -n 's/^Alias name: //p' | head -n 1)"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Could not determine key alias."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean :app:assembleRelease

      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK missing."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | head -n 3

          echo "$BADGING" | grep -q "versionCode='27'" || {
            echo "::error::APK versionCode is not 27."
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V27-CHAT-CONTACTEZ-NOUS.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V27-CHAT-CONTACTEZ-NOUS.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      - name: Upload signed V27 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V27-CHAT-CONTACTEZ-NOUS
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
