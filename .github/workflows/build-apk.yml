name: Build Android APK V19 Synchronisation Firebase Requests Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK V19 Synchronisation Firebase Requests Fix
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ajouter Android Build Tools au PATH
        run: |
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Installer Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Trouver UNIQUEMENT le ZIP V19 Requests Fix
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "RECHERCHE DU ZIP V19 CORRIGE - REQUESTS FIX"
          echo "=============================================="

          EXPECTED="YOUNGEST-BUSINESS-V19-SYNCHRONISATION-FIREBASE-CORRIGEE-REQUESTS-FIX.zip"

          ZIP=$(find . -maxdepth 3 -type f \
            -name "$EXPECTED" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : le ZIP CORRIGE V19 est introuvable."
            echo ""
            echo "Fichier obligatoire :"
            echo "$EXPECTED"
            echo ""
            echo "===== ZIP DISPONIBLES DANS LE DEPOT ====="
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "ZIP CORRIGE TROUVE :"
          echo "$ZIP"
          echo "=============================================="

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extraire le projet V19 Requests Fix
        shell: bash
        run: |
          set -e

          rm -rf v19-extracted
          mkdir -p v19-extracted

          echo "Extraction du ZIP :"
          echo "$ZIP_PATH"

          unzip -q "$ZIP_PATH" -d v19-extracted

          echo "Extraction terminee."

      - name: Detecter le projet Android
        shell: bash
        run: |
          set -e

          PROJECT=$(find v19-extracted -type f \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : projet Android introuvable."
            find v19-extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          ROOT=$(dirname "$PROJECT")

          echo "Projet Android detecte : $ROOT"
          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verifier le projet V19
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

          echo "Projet Android V19 valide."

      - name: Verifier que le projet est bien le Requests Fix
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          echo "Verification du code V19..."

          if ! grep -R "yb_loan_requests" app/src/main/java >/dev/null 2>&1; then
            echo "ERREUR : yb_loan_requests introuvable."
            exit 1
          fi

          if ! grep -R "attachBureauRequestsListener" app/src/main/java >/dev/null 2>&1; then
            echo "ERREUR : listener Bureau des demandes introuvable."
            exit 1
          fi

          if ! grep -R "attachClientRequestsListener" app/src/main/java >/dev
