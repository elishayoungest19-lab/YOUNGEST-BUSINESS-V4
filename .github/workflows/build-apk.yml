name: Build YOUNGEST'S BUSINESS V34 Admin Cards

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V34 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract V34 Admin Cards source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_PATH=""

          echo "========================================="
          echo "   RECHERCHE DU SOURCE V34 ADMIN CARDS"
          echo "========================================="

          ZIP_PATH="$(
            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -name 'YOUNGEST-BUSINESS-V34-ADMIN-CARDS-SOURCE*.zip' \
              -print \
              | sort \
              | tail -n 1
          )

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Source V34 Admin Cards introuvable."

            echo ""
            echo "ZIP disponibles :"

            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -iname '*.zip' \
              -print || true

            exit 1
          fi

          echo ""
          echo "SOURCE V34 ADMIN CARDS TROUVE :"
          echo "$ZIP_PATH"

          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v34-source"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android detecte :"
          echo "$PROJECT_DIR"
