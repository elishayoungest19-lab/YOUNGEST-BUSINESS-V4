name: Build YOUNGEST'S BUSINESS V34 Chat Delivery Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V34 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE EXACTE DU SOURCE V34 CORRIGE
      # =========================================================

      - name: Find and extract V34 Chat Fixed source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          DEST="$RUNNER_TEMP/v34-chat-fixed"
          ZIP_NAME="YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-source-FIXED.zip"
          ZIP_PATH="$ROOT/$ZIP_NAME"

          echo "========================================="
          echo "   RECHERCHE DU SOURCE V34 CHAT FIXED"
          echo "========================================="

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Le ZIP V34 corrigé est introuvable : $ZIP_NAME"

            echo ""
            echo "ZIP présents dans le repository :"

            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo ""
          echo "SOURCE V34 CHAT FIXED TROUVE :"
          echo "$ZIP_PATH"

          echo ""
          echo "Verification de l'archive..."

          unzip -t "$ZIP_PATH"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction du source V34 corrige..."

          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le source V34 corrige."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android detecte :"
          echo "$PROJECT_DIR"

          echo ""
          echo "========================================="
          echo "   SOURCE V34 CHAT FIXED PRET"
          echo "========================================="

      # =========================================================
      # IDENTITE DU SOURCE V34
      # =========================================================

      - name: Verify V34 source identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="$PROJECT_DIR/app/build.gradle"

          echo "========================================="
          echo "       VERIFICATION IDENTITE V34"
          echo "========================================="

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Eq \
            'versionCode[[:space:]]+34([[:space:]]|$)' \
            "$GRADLE" || {
              echo "::error::versionCode 34 introuvable."
              exit 1
            }

          grep -Fq \
            "versionName '1.27.0'" \
            "$GRADLE" || {
              echo "::error::versionName 1.27.0 introuvable."
              exit 1
            }

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE" || {
              echo "::error::applicationId incorrect."
              exit 1
            }

          echo ""
          echo "OK : versionCode 34"
          echo "OK : versionName 1.27.0"
          echo "OK : applicationId correct."

      # =========================================================
      # VERIFICATION DE LA CORRECTION CHAT
      # =========================================================

      - name: Verify V34 Chat delivery fix
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "       VERIFICATION CORRECTION CHAT"
          echo "========================================="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          # -----------------------------------------------------
          # SESSION FIREBASE ANONYME
          # -----------------------------------------------------

          grep -Fq \
            'signInAnonymously' \
            "$MAIN" || {
              echo "::error::signInAnonymously absent."
              exit 1
            }

          # -----------------------------------------------------
          # IDENTIFICATION CLIENT
          # -----------------------------------------------------

          grep -Fq \
            'KEY_PENDING_CHAT_PHONE' \
            "$MAIN" || {
              echo "::error::KEY_PENDING_CHAT_PHONE absent."
              exit 1
            }

          grep -Fq \
            'KEY_PENDING_CHAT_DRAFT' \
            "$MAIN" || {
              echo "::error::KEY_PENDING_CHAT_DRAFT absent."
              exit 1
            }

          # -----------------------------------------------------
          # CHAT CLIENT
          # -----------------------------------------------------

          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {
              echo "::error::openChatEntry() absent."
              exit 1
            }

          grep -Fq \
            'openClientConversationWithDraft' \
            "$MAIN" || {
              echo "::error::openClientConversationWithDraft absent."
              exit 1
            }

          grep -Fq \
            'sendClientMessageAtomic' \
            "$MAIN" || {
              echo "::error::sendClientMessageAtomic absent."
              exit 1
            }

          # -----------------------------------------------------
          # CORRECTION CRITIQUE
          # -----------------------------------------------------

          grep -Fq \
            'conversation.set(c)' \
            "$MAIN" || {
              echo "::error::V34 correction conversation-first absente."
              exit 1
            }

          grep -Fq \
            'message.set(msg)' \
            "$MAIN" || {
              echo "::error::Ecriture du premier message apres creation de conversation absente."
              exit 1
            }

          grep -Fq \
            'V34 FIX CRITIQUE' \
            "$MAIN" || {
              echo "::error::Marqueur V34 FIX CRITIQUE absent."
              exit 1
            }

          # -----------------------------------------------------
          # ADMIN CHAT
          # -----------------------------------------------------

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {
              echo "::error::adminChatInbox() absent."
              exit 1
            }

          grep -Fq \
            'FIREBASE_ADMIN_EMAIL.equalsIgnoreCase' \
            "$MAIN" || {
              echo "::error::Controle Admin absent."
              exit 1
            }

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$MAIN" || {
              echo "::error::Email Admin absent."
              exit 1
            }

          # -----------------------------------------------------
          # LISTENER FIRESTORE
          # -----------------------------------------------------

          grep -Fq \
            'addSnapshotListener' \
            "$MAIN" || {
              echo "::error::Listener Firestore absent."
              exit 1
            }

          echo ""
          echo "OK : session Firebase anonyme"
          echo "OK : identification client"
          echo "OK : Chat client"
          echo "OK : creation conversation avant premier message"
          echo "OK : message ecrit apres creation conversation"
          echo "OK : Chat administration"
          echo "OK : listener Firestore"

          echo ""
          echo "========================================="
          echo "      V34 CHAT DELIVERY CHECK PASSED"
          echo "========================================="

      # =========================================================
      # VERIFICATION FIREBASE
      # =========================================================

      - name: Verify Firebase Chat configuration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "========================================="
          echo "       VERIFICATION FIREBASE / CHAT"
          echo "========================================="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java absent."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java absent."
            exit 1
          }

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json absent."
            exit 1
          }

          test -f "$RULES" || {
            echo "::error::firestore.rules absent."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js absent."
            exit 1
          }

          grep -Fq \
            'match /yb_chat_conversations/' \
            "$RULES" || {
              echo "::error::Regles yb_chat_conversations absentes."
              exit 1
            }

          grep -Fq \
            'request.auth.token.email == "elishayoungest19@gmail.com"' \
            "$RULES" || {
              echo "::error::Regle email Admin absente."
              exit 1
            }

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {
              echo "::error::FirebaseMessagingService absent."
              exit 1
            }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {
              echo "::error::onMessageReceived absent."
              exit 1
            }

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {
              echo "::error::onDocumentCreated absent."
              exit 1
            }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {
              echo "::error::notifyClientWhenAdminReplies absent."
              exit 1
            }

          node --check "$FUNCTIONS"

          echo ""
          echo "OK : Firebase / Firestore / Messaging / Functions"

      # =========================================================
      # SIGNATURE RELEASE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "       CONFIGURATION SIGNATURE V34"
          echo "========================================="

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 manquant."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD manquant."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEY_PASSWORD manquant."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "::error::Keystore vide."
            exit 1
          fi

          KEYTOOL_OUTPUT="$RUNNER_TEMP/keytool-output.txt"

          keytool \
            -list \
            -v \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            > "$KEYTOOL_OUTPUT" 2>&1 || {
              echo "::error::Impossible de lire le keystore."
              exit 1
            }

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(
              awk -F': ' \
                '/^[[:space:]]*Alias name:/ {
                  print $2
                  exit
                }' \
                "$KEYTOOL_OUTPUT"
            )"

            ALIAS="$(printf '%s' "$ALIAS" | xargs)"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Aucun alias detecte."
            exit 1
          fi

          keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$ALIAS" \
            >/dev/null 2>&1 || {
              echo "::error::Alias '$ALIAS' introuvable."
              exit 1
            }

          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

          echo ""
          echo "OK : keystore"
          echo "OK : alias"
          echo "OK : signature configuree."

      # =========================================================
      # COMPILATION
      # =========================================================

      - name: Build release APK V34
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "          COMPILATION APK V34"
          echo "========================================="

          gradle \
            --no-daemon \
            clean \
            :app:assembleRelease

          echo ""
          echo "APK V34 compile avec succes."

      # =========================================================
      # VERIFICATION APK
      # =========================================================

      - name: Verify APK signature package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release introuvable."
            exit 1
          fi

          echo "========================================="
          echo "       VERIFICATION APK V34"
          echo "========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" \
            | grep -q \
              "package: name='com.aistudio.youngestbiz.mbkz'" || {
                echo "::error::applicationId incorrect."
                exit 1
              }

          echo "$BADGING" \
            | grep -q \
              "versionCode='34'" || {
                echo "::error::versionCode different de 34."
                exit 1
              }

          echo "$BADGING" \
            | grep -q \
              "versionName='1.27.0'" || {
                echo "::error::versionName different de 1.27.0."
                exit 1
              }

          echo ""
          echo "OK : APK signe"
          echo "OK : applicationId correct"
          echo "OK : versionCode 34"
          echo "OK : versionName 1.27.0"

      # =========================================================
      # PREPARATION ARTIFACT
      # =========================================================

      - name: Prepare V34 release artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          echo ""
          echo "Artifact prepare :"
          ls -lh "$GITHUB_WORKSPACE/release-output"

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================

      - name: Upload signed V34 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
