name: Build Android APK V17 Mobile Money Direct API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V17 Mobile Money Direct API
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver le ZIP V17
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f \
            -name 'YOUNGEST-BUSINESS-V17-TRANSFERT-DIRECT-API-PIN-AUTO-NOM-FINAL.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP V17 FINAL introuvable."
            echo "ZIP disponibles :"
            find . -maxdepth 3 -type f -name '*.zip' | sort
            exit 1
          fi

          echo "ZIP V17 trouvé : $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraire le projet V17
        shell: bash
        run: |
          set -e

          rm -rf v17-extracted
          mkdir -p v17-extracted

          unzip -o "${{ steps.find_zip.outputs.zip }}" \
            -d v17-extracted

          echo "Projet V17 extrait."

      - name: Détecter le projet Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find v17-extracted \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android introuvable."
            exit 1
          fi

          echo "Projet Android : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Vérifier le projet V17
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== SETTINGS ====="
          cat settings.gradle 2>/dev/null || true
          cat settings.gradle.kts 2>/dev/null || true

          echo "===== BUILD GRADLE ====="
          cat build.gradle 2>/dev/null || true
          cat build.gradle.kts 2>/dev/null || true

          echo "===== APP BUILD GRADLE ====="
          cat app/build.gradle 2>/dev/null || true
          cat app/build.gradle.kts 2>/dev/null || true

      - name: Configurer Firebase
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "app/google-services.json" ]; then
            echo "Firebase déjà configuré."

          elif [ -f "google-services.json" ]; then
            cp google-services.json app/google-services.json
            echo "Firebase copié vers app/."

          else
            SOURCE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'google-services.json' \
              | head -n 1)

            if [ -n "$SOURCE" ]; then
              cp "$SOURCE" app/google-services.json
              echo "Firebase configuré depuis : $SOURCE"
            else
              echo "AVERTISSEMENT : google-services.json introuvable."
            fi
          fi

      - name: Préparer le keystore de release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : KEYSTORE_BASE64 est absent."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : KEYSTORE_PASSWORD est absent."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERREUR : KEY_PASSWORD est absent."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERREUR : keystore vide."
            exit 1
          fi

          echo "Keystore préparé."

      - name: Détecter automatiquement l'alias du keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          ALIAS=$(keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -v \
            | awk -F': ' '/Alias name:/ {print $2; exit}')

          if [ -z "$ALIAS" ]; then
            echo "ERREUR : alias du keystore introuvable."
            exit 1
          fi

          echo "Alias du keystore détecté."

          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Configurer la signature Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("../release-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          echo "Signature Android configurée."

      - name: Nettoyer le projet V17
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --no-daemon

      - name: Compiler APK V17 Release
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== SIGNATURE V17 ====="
          echo "Alias détecté : $ANDROID_KEY_ALIAS"
          echo "Keystore présent :"
          ls -lh release-keystore.jks

          gradle :app:assembleRelease --no-daemon

      - name: Vérifier APK généré
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK V17 introuvable."
            exit 1
          fi

          echo "APK V17 généré : $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Préparer le nom final de l'APK
        shell: bash
        run: |
          set -e

          mkdir -p release-apk

          cp "$APK_PATH" \
            "release-apk/YOUNGEST-BUSINESS-V17-TRANSFERT-DIRECT-API-PIN-AUTO-NOM-FINAL.apk"

          ls -lh release-apk/

      - name: Publier l'APK V17
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V17-TRANSFERT-DIRECT-API-PIN-AUTO-NOM-FINAL
          path: release-apk/YOUNGEST-BUSINESS-V17-TRANSFERT-DIRECT-API-PIN-AUTO-NOM-FINAL.apk
          if-no-files-found: error
