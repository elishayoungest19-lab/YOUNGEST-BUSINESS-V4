
name: YOUNGEST'S BUSINESS V50 Wi-Fi Integration Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'YOUNGEST-BUSINESS-V50-INTEGRATION-WIFI-BASE-V42-V47-DEV.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: yb-wifi-v50-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V50-INTEGRATION-WIFI-BASE-V42-V47-DEV.zip

jobs:
  validate-source:
    name: Validate V50 source and Wi-Fi integration baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract and detect V50 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::V50 source archive not found: $SOURCE_ZIP"
            exit 1
          fi

          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/yb-v50"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          ROOT=""
          while IFS= read -r -d '' WEB_INDEX; do
            CANDIDATE="$(dirname "$(dirname "$WEB_INDEX")")"
            if [ -s "$CANDIDATE/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java" ] \
              && [ -s "$CANDIDATE/app/build.gradle" ] \
              && { [ -s "$CANDIDATE/settings.gradle" ] || [ -s "$CANDIDATE/settings.gradle.kts" ]; } \
              && [ -s "$CANDIDATE/firestore.rules" ] \
              && [ -s "$CANDIDATE/.firebaserc" ]; then
              ROOT="$CANDIDATE"
              break
            fi
          done < <(find "$DEST" -type f -path '*/web-admin/index.html' -print0)

          if [ -z "$ROOT" ]; then
            echo "::error::V50 project structure not recognized."
            find "$DEST" -maxdepth 6 \
              \( -name settings.gradle -o -name index.html \
              -o -name MainActivity.java -o -name .firebaserc \) -print || true
            exit 1
          fi

          test -s "$ROOT/web-admin/app.js"
          test -s "$ROOT/web-admin/styles.css"
          test -s "$ROOT/app/src/main/AndroidManifest.xml"
          test -s "$ROOT/app/google-services.json"
          grep -q 'youngestsbusiness' "$ROOT/.firebaserc"

          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "V50 project detected: $ROOT"

      - name: Validate Web JavaScript and Wi-Fi markers
        shell: bash
        run: |
          set -euo pipefail

          node --check "$SOURCE_ROOT/web-admin/app.js"

          if grep -Eiq 'YOUNGEST.?S B WIFI|B WIFI|WIFI' \
            "$SOURCE_ROOT/web-admin/index.html"; then
            echo "Wi-Fi marker found in Web Admin."
          else
            echo "::warning::Wi-Fi marker not found in Web Admin."
          fi

          MAIN="$SOURCE_ROOT/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          if grep -Eiq 'YOUNGEST.?S B WIFI|yb_wifi|wifiCoupon|couponWifi|wifiPage' "$MAIN"; then
            echo "Android Wi-Fi marker found; functional testing is still required."
          else
            echo "::warning::Android Wi-Fi integration marker not found."
          fi

          echo "Web JavaScript syntax check passed."

      - name: Upload validated V50 source
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V50-WIFI-SOURCE-VALIDATED
          path: ${{ env.SOURCE_ZIP }}
          if-no-files-found: error
          retention-days: 30

  build-android-baseline:
    name: Build V50 Android debug APK (not production)
    runs-on: ubuntu-latest
    needs: validate-source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V50 Android project
        shell: bash
        run: |
          set -euo pipefail

          DEST="$RUNNER_TEMP/yb-v50-android"
          mkdir -p "$DEST"
          unzip -q "$GITHUB_WORKSPACE/$SOURCE_ZIP" -d "$DEST"

          PROJECT_DIR=""
          while IFS= read -r -d '' SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -s "$CANDIDATE/app/build.gradle" ] \
              && [ -s "$CANDIDATE/app/src/main/AndroidManifest.xml" ] \
              && [ -s "$CANDIDATE/app/google-services.json" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$DEST" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project not found in V50 archive."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project detected: $PROJECT_DIR"

      - name: Set non-production test version
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import pathlib, re, sys

          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s, code_count = re.subn(
              r'(?m)^([ \t]*versionCode[ \t]+)\d+([ \t]*)$',
              r'\g<1>50\g<2>', s, count=1
          )
          s, name_count = re.subn(
              r'''(?m)^([ \t]*versionName[ \t]+)['"][^'"]+['"]([ \t]*)$''',
              r"\g<1>'1.50.0-wifi-dev'\g<2>", s, count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  "Could not safely set V50 versionCode/versionName. "
                  "Review app/build.gradle manually."
              )

          p.write_text(s, encoding="utf-8")
          PY

          grep -Eq 'versionCode[[:space:]]+50([[:space:]]|$)' \
            "$PROJECT_DIR/app/build.gradle"

          grep -Fq 'com.aistudio.youngestbiz.mbkz' \
            "$PROJECT_DIR/app/build.gradle"

      - name: Build V50 debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleDebug --stacktrace

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V50-ANDROID-DEBUG-NOT-PRODUCTION.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V50-ANDROID-DEBUG-NOT-PRODUCTION.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          echo "::warning::Debug APK only. Not signed for production. Wi-Fi functionality must be tested separately."

      - name: Upload V50 Android test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V50-ANDROID-DEBUG-NOT-PRODUCTION
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

# Development checks only.
# No Firebase Hosting deployment, no Firestore rules deployment,
# and no production signing secrets are used.
