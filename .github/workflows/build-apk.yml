name: Build YOUNGEST'S BUSINESS V34 Chat Persistent Delivery

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V34 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE ET EXTRACTION DU VRAI SOURCE V33
      # =========================================================

      - name: Find and extract V33 source for V34
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_PATH=""

          echo "========================================="
          echo "   RECHERCHE DU VRAI SOURCE V33"
          echo "========================================="

          # Le dépôt contient actuellement le vrai source V33.
          # On accepte également les variantes -1, -2, -3, etc.

          ZIP_PATH="$(
            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -name 'YOUNGEST-BUSINESS-V33-CHAT-PERSISTENT-DELIVERY-source*.zip' \
              -print \
              | sort \
              | tail -n 1
          )"

          if [ -z "$ZIP_PATH" ]; then

            echo "::error::Aucun source V33 CHAT-PERSISTENT-DELIVERY trouvé."

            echo ""
            echo "ZIP disponibles dans le dépôt :"

            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              -iname '*.zip' \
              -print || true

            exit 1
          fi

          echo ""
          echo "SOURCE UTILISÉ :"
          echo "$ZIP_PATH"

          # =====================================================
          # VERIFICATION ARCHIVE
          # =====================================================

          echo ""
          echo "Vérification de l'archive..."

          unzip -t "$ZIP_PATH"

          # =====================================================
          # EXTRACTION
          # =====================================================

          DEST="$RUNNER_TEMP/v34-source"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction du source V33..."

          unzip -q "$ZIP_PATH" -d "$DEST"

          # =====================================================
          # DETECTION DU PROJET ANDROID
          # =====================================================

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android détecté :"
          echo "$PROJECT_DIR"

      # =========================================================
      # TRANSFORMATION V33 -> V34
      # =========================================================

      - name: Prepare source V34
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "       PREPARATION DU SOURCE V34"
          echo "========================================="

          GRADLE="$PROJECT_DIR/app/build.gradle"

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          echo ""
          echo "Version trouvée avant transformation :"

          grep -n "versionCode" "$GRADLE" || true
          grep -n "versionName" "$GRADLE" || true

          # -----------------------------------------------------
          # VERSION CODE 33 -> 34
          # -----------------------------------------------------

          sed -i \
            -E \
            "s/versionCode[[:space:]]+33/versionCode 34/" \
            "$GRADLE"

          # -----------------------------------------------------
          # VERSION NAME 1.26.0 -> 1.27.0
          # -----------------------------------------------------

          sed -i \
            -E \
            "s/versionName[[:space:]]+'1\.26\.0'/versionName '1.27.0'/" \
            "$GRADLE"

          echo ""
          echo "Version après transformation :"

          grep -n "versionCode" "$GRADLE" || true
          grep -n "versionName" "$GRADLE" || true

          # -----------------------------------------------------
          # VERIFICATION
          # -----------------------------------------------------

          grep -Eq \
            'versionCode[[:space:]]+34([[:space:]]|$)' \
            "$GRADLE" || {

            echo "::error::Impossible de définir versionCode 34."
            exit 1
          }

          grep -Fq \
            "versionName '1.27.0'" \
            "$GRADLE" || {

            echo "::error::Impossible de définir versionName 1.27.0."
            exit 1
          }

          echo ""
          echo "OK : source V33 transformé en V34."

      # =========================================================
      # VERIFICATION SOURCE V34
      # =========================================================

      - name: Verify V34 source and chat components
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          RULES="$PROJECT_DIR/firestore.rules"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "========================================="
          echo "        VERIFICATION SOURCE V34"
          echo "========================================="

          # -----------------------------------------------------
          # FICHIERS
          # -----------------------------------------------------

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json introuvable."
            exit 1
          }

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java introuvable."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js introuvable."
            exit 1
          }

          echo "OK : fichiers principaux présents."

          # -----------------------------------------------------
          # VERSION
          # -----------------------------------------------------

          grep -Eq \
            'versionCode[[:space:]]+34([[:space:]]|$)' \
            "$GRADLE" || {

            echo "::error::versionCode 34 introuvable."
            exit 1
          }

          grep -Fq \
            "versionName '1.27.0'" \
            "$GRADLE" || {

            echo "::error::versionName 1.27.0 introuvable."
            exit 1
          }

          echo "OK : versionCode 34."
          echo "OK : versionName 1.27.0."

          # -----------------------------------------------------
          # APPLICATION ID
          # -----------------------------------------------------

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE" || {

            echo "::error::applicationId incorrect."
            exit 1
          }

          echo "OK : applicationId."

          # -----------------------------------------------------
          # CHAT
          # -----------------------------------------------------

          grep -Fq \
            'void contactPage()' \
            "$MAIN" || {

            echo "::error::contactPage() introuvable."
            exit 1
          }

          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {

            echo "::error::openChatEntry() introuvable."
            exit 1
          }

          grep -Fq \
            'openClientConversationWithDraft' \
            "$MAIN" || {

            echo "::error::openClientConversationWithDraft introuvable."
            exit 1
          }

          echo "OK : parcours Chat client."

          # -----------------------------------------------------
          # PERSISTANCE
          # -----------------------------------------------------

          grep -Fq \
            'SharedPreferences' \
            "$MAIN" || {

            echo "::error::SharedPreferences introuvable."
            exit 1
          }

          grep -Fq \
            'KEY_PENDING_CHAT_DRAFT' \
            "$MAIN" || {

            echo "::error::KEY_PENDING_CHAT_DRAFT introuvable."
            exit 1
          }

          echo "OK : persistance du brouillon."

          # -----------------------------------------------------
          # TRANSACTION FIRESTORE
          # -----------------------------------------------------

          grep -Fq \
            'firestore.runTransaction' \
            "$MAIN" || {

            echo "::error::Transaction Firestore introuvable."
            exit 1
          }

          echo "OK : transaction Firestore."

          # -----------------------------------------------------
          # PHONE AUTH
          # -----------------------------------------------------

          grep -Fq \
            'PhoneAuthProvider.verifyPhoneNumber(options)' \
            "$MAIN" || {

            echo "::error::Phone Authentication introuvable."
            exit 1
          }

          echo "OK : Phone Authentication."

          # -----------------------------------------------------
          # ADMIN
          # -----------------------------------------------------

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {

            echo "::error::adminChatInbox() introuvable."
            exit 1
          }

          echo "OK : boîte Admin."

          # -----------------------------------------------------
          # GMAIL ADMIN
          # -----------------------------------------------------

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$MAIN" || {

            echo "::error::Gmail Admin introuvable."
            exit 1
          }

          echo "OK : Gmail Admin."

          # -----------------------------------------------------
          # FIREBASE MESSAGING
          # -----------------------------------------------------

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {

            echo "::error::FirebaseMessagingService introuvable."
            exit 1
          }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {

            echo "::error::onMessageReceived introuvable."
            exit 1
          }

          echo "OK : Firebase Messaging."

          # -----------------------------------------------------
          # FIRESTORE
          # -----------------------------------------------------

          grep -Fq \
            'match /yb_chat_conversations/' \
            "$RULES" || {

            echo "::error::Règle Chat introuvable."
            exit 1
          }

          grep -Fq \
            'match /yb_notification_tokens/' \
            "$RULES" || {

            echo "::error::Règle notifications introuvable."
            exit 1
          }

          echo "OK : règles Firestore."

          # -----------------------------------------------------
          # CLOUD FUNCTIONS
          # -----------------------------------------------------

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {

            echo "::error::onDocumentCreated introuvable."
            exit 1
          }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {

            echo "::error::notifyClientWhenAdminReplies introuvable."
            exit 1
          }

          node --check "$FUNCTIONS"

          echo "OK : Cloud Functions."

          echo ""
          echo "========================================="
          echo "       V34 SOURCE CHECKS PASSED"
          echo "========================================="

      # =========================================================
      # CONFIGURATION SIGNATURE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          echo "========================================="
          echo "      CONFIGURATION SIGNATURE V34"
          echo "========================================="

          cd "$PROJECT_DIR"

          # -----------------------------------------------------
          # SECRETS
          # -----------------------------------------------------

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 manquant."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD manquant."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEY_PASSWORD manquant."
            exit 1
          fi

          echo "OK : secrets principaux présents."

          # -----------------------------------------------------
          # CREATION KEYSTORE
          # -----------------------------------------------------

          printf '%s' "$KEYSTORE_BASE64" | \
            base64 --decode > release-keystore.jks

          test -s release-keystore.jks || {
            echo "::error::Keystore vide."
            exit 1
          }

          echo "OK : keystore Release créé."

          # -----------------------------------------------------
          # ALIAS
          # -----------------------------------------------------

          ALIAS="${KEY_ALIAS:-}"

          if [ -n "$ALIAS" ]; then

            echo "KEY_ALIAS fourni par GitHub."
            echo "Alias demandé : $ALIAS"

          else

            echo "KEY_ALIAS non fourni."
            echo "Détection automatique..."

            KEYTOOL="$RUNNER_TEMP/keytool.txt"

            rm -f "$KEYTOOL"

            if ! keytool \
              -list \
              -v \
              -keystore release-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              > "$KEYTOOL" 2>&1
            then

              echo "::error::Impossible de lire le keystore."

              cat "$KEYTOOL" || true

              exit 1
            fi

            # -------------------------------------------------
            # Alias name:
            # -------------------------------------------------

            ALIAS="$(
              sed -n \
                's/^[[:space:]]*Alias name:[[:space:]]*//p' \
                "$KEYTOOL" \
                | head -n 1
            )"

            ALIAS="$(printf '%s' "$ALIAS" | xargs || true)"

            # -------------------------------------------------
            # FALLBACK : première entrée du keystore
            # -------------------------------------------------

            if [ -z "$ALIAS" ]; then

              echo "Alias name non trouvé."

              ALIAS="$(
                grep \
                  -E \
                  '^[[:space:]]*[^,]+,[[:space:]]*(PrivateKeyEntry|SecretKeyEntry)' \
                  "$KEYTOOL" \
                  | head -n 1 \
                  | cut -d',' -f1 \
                  | xargs || true
              )

            fi

          fi

          # -----------------------------------------------------
          # VERIFICATION ALIAS
          # -----------------------------------------------------

          if [ -z "$ALIAS" ]; then

            echo "::error::Impossible de détecter l'alias du keystore."

            echo ""
            echo "===== SORTIE KEYTOOL ====="

            cat "$RUNNER_TEMP/keytool.txt" || true

            exit 1
          fi

          echo "OK : alias détecté."

          # -----------------------------------------------------
          # TEST ALIAS
          # -----------------------------------------------------

          if ! keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$ALIAS" \
            >/dev/null 2>&1
          then

            echo "::error::L'alias '$ALIAS' n'existe pas dans le keystore."

            exit 1
          fi

          echo "OK : alias vérifié."

          # -----------------------------------------------------
          # VARIABLES GRADLE
          # -----------------------------------------------------

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          echo ""
          echo "========================================="
          echo "   SIGNATURE V34 CONFIGUREE AVEC SUCCES"
          echo "========================================="

      # =========================================================
      # COMPILATION V34
      # =========================================================

      - name: Build release APK V34
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "   COMPILATION YOUNGEST'S BUSINESS V34"
          echo "========================================="

          gradle \
            --no-daemon \
            clean \
            :app:assembleRelease

          echo ""
          echo "========================================="
          echo "      COMPILATION V34 TERMINEE"
          echo "========================================="

      # =========================================================
      # VERIFICATION APK
      # =========================================================

      - name: Verify APK signature, package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK release introuvable."
            exit 1
          fi

          echo "========================================="
          echo "       VERIFICATION SIGNATURE APK"
          echo "========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "========================================="
          echo "       VERIFICATION IDENTITE APK"
          echo "========================================="

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" | head -n 5

          # -----------------------------------------------------
          # APPLICATION ID
          # -----------------------------------------------------

          echo "$BADGING" | grep -q \
            "package: name='com.aistudio.youngestbiz.mbkz'" || {

            echo "::error::ApplicationId incorrect."
            exit 1
          }

          # -----------------------------------------------------
          # VERSION CODE
          # -----------------------------------------------------

          echo "$BADGING" | grep -q \
            "versionCode='34'" || {

            echo "::error::versionCode 34 absent de l'APK."
            exit 1
          }

          # -----------------------------------------------------
          # VERSION NAME
          # -----------------------------------------------------

          echo "$BADGING" | grep -q \
            "versionName='1.27.0'" || {

            echo "::error::versionName 1.27.0 absent de l'APK."
            exit 1
          }

          echo ""
          echo "OK : applicationId correct."
          echo "OK : versionCode 34."
          echo "OK : versionName 1.27.0."
          echo "OK : signature APK valide."

          # =====================================================
          # ARTIFACT
          # =====================================================

          mkdir -p \
            "$GITHUB_WORKSPACE/release-output"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V34-CHAT-PERSISTENT-DELIVERY.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V34-CHAT-PERSISTENT-DELIVERY.apk" \
            > \
            "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          echo ""
          echo "========================================="
          echo "          APK V34 PRET"
          echo "========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/release-output/"

          echo ""
          echo "SHA256 :"

          cat \
            "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================

      - name: Upload signed V34 APK artifact
        uses: actions/upload-artifact@v4

        with:
          name: YOUNGEST-BUSINESS-V34-CHAT-PERSISTENT-DELIVERY
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
