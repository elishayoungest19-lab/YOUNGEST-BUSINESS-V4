name: Build YOUNGEST'S BUSINESS V34 Chat Delivery FINAL FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V34 CHAT FIXED APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE EXCLUSIVE DU VRAI SOURCE FIXED
      # =========================================================

      - name: Find exact V34 CHAT FIXED source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_NAME="YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-source-FIXED.zip"
          ZIP_PATH="$ROOT/$ZIP_NAME"

          echo "=============================================="
          echo "   RECHERCHE DU VRAI SOURCE V34 CHAT FIXED"
          echo "=============================================="

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Le vrai ZIP V34 FIXED est introuvable."
            echo "::error::Fichier obligatoire : $ZIP_NAME"
            exit 1
          fi

          echo ""
          echo "SOURCE TROUVE :"
          echo "$ZIP_PATH"

          echo ""
          echo "Verification ZIP..."

          unzip -t "$ZIP_PATH"

          echo ""
          echo "ZIP VALIDE."

          # -----------------------------------------------------
          # REFUS DES AUTRES ZIP IDENTIQUES
          # -----------------------------------------------------

          COUNT="$(
            find "$ROOT" \
              -type f \
              -name "$ZIP_NAME" \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Nombre incorrect de copies du source FIXED : $COUNT"
            echo "::error::Une seule copie exacte est autorisee."
            find "$ROOT" \
              -type f \
              -name "$ZIP_NAME" \
              -print || true
            exit 1
          fi

          # -----------------------------------------------------
          # EXTRACTION
          # -----------------------------------------------------

          DEST="$RUNNER_TEMP/v34-chat-fixed"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction du vrai source V34 FIXED..."

          unzip -q "$ZIP_PATH" -d "$DEST"

          # -----------------------------------------------------
          # RECHERCHE DU PROJET ANDROID
          # -----------------------------------------------------

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le source FIXED."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android detecte :"
          echo "$PROJECT_DIR"

          echo ""
          echo "=============================================="
          echo "   SOURCE V34 CHAT FIXED PRET"
          echo "=============================================="

      # =========================================================
      # IDENTITE V34
      # =========================================================

      - name: Verify exact V34 identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="$PROJECT_DIR/app/build.gradle"

          echo "=============================================="
          echo "        IDENTITE EXACTE V34"
          echo "=============================================="

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Eq \
            'versionCode[[:space:]]+34([[:space:]]|$)' \
            "$GRADLE" || {
              echo "::error::versionCode 34 absent."
              exit 1
            }

          grep -Fq \
            "versionName '1.27.0'" \
            "$GRADLE" || {
              echo "::error::versionName 1.27.0 absent."
              exit 1
            }

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE" || {
              echo "::error::applicationId incorrect."
              exit 1
            }

          echo ""
          echo "OK : versionCode 34"
          echo "OK : versionName 1.27.0"
          echo "OK : applicationId com.aistudio.youngestbiz.mbkz"

      # =========================================================
      # VERIFICATION DU CIRCUIT ENVOYER -> FIRESTORE
      # =========================================================

      - name: Verify real client Chat delivery path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "=============================================="
          echo "     VERIFICATION DU VRAI CIRCUIT CHAT"
          echo "=============================================="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          # -----------------------------------------------------
          # BOUTON ENVOYER
          # -----------------------------------------------------

          grep -Fq \
            'ENVOYER LE MESSAGE' \
            "$MAIN" || {
              echo "::error::Bouton ENVOYER LE MESSAGE absent."
              exit 1
            }

          grep -Fq \
            'persistPendingChatDraft(draft)' \
            "$MAIN" || {
              echo "::error::persistPendingChatDraft(draft) absent."
              exit 1
            }

          # -----------------------------------------------------
          # ENTREE CHAT
          # -----------------------------------------------------

          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {
              echo "::error::openChatEntry() absent."
              exit 1
            }

          grep -Fq \
            'openClientConversationWithDraft' \
            "$MAIN" || {
              echo "::error::openClientConversationWithDraft absent."
              exit 1
            }

          # -----------------------------------------------------
          # FIREBASE ANONYMOUS
          # -----------------------------------------------------

          grep -Fq \
            'signInAnonymously' \
            "$MAIN" || {
              echo "::error::Firebase Anonymous Auth absent."
              exit 1
            }

          # -----------------------------------------------------
          # NUMERO CLIENT
          # -----------------------------------------------------

          grep -Fq \
            'KEY_PENDING_CHAT_PHONE' \
            "$MAIN" || {
              echo "::error::KEY_PENDING_CHAT_PHONE absent."
              exit 1
            }

          grep -Fq \
            'requestChatPhoneNumber()' \
            "$MAIN" || {
              echo "::error::requestChatPhoneNumber() absent."
              exit 1
            }

          # -----------------------------------------------------
          # RECHERCHE CONVERSATION
          # -----------------------------------------------------

          grep -Fq \
            'openOrCreateClientConversation()' \
            "$MAIN" || {
              echo "::error::openOrCreateClientConversation() absent."
              exit 1
            }

          grep -Fq \
            'whereEqualTo("ownerUid",user.getUid())' \
            "$MAIN" || {
              echo "::error::Recherche ownerUid absente."
              exit 1
            }

          # -----------------------------------------------------
          # CREATION CONVERSATION
          # -----------------------------------------------------

          grep -Fq \
            'createConversationAndSendDraft' \
            "$MAIN" || {
              echo "::error::createConversationAndSendDraft() absent."
              exit 1
            }

          # -----------------------------------------------------
          # CORRECTION CRITIQUE
          # -----------------------------------------------------

          grep -Fq \
            'conversation.set(c)' \
            "$MAIN" || {
              echo "::error::conversation.set(c) absent."
              exit 1
            }

          grep -Fq \
            'message.set(msg)' \
            "$MAIN" || {
              echo "::error::message.set(msg) absent."
              exit 1
            }

          grep -Fq \
            'V34 FIX CRITIQUE' \
            "$MAIN" || {
              echo "::error::Marqueur V34 FIX CRITIQUE absent."
              exit 1
            }

          # -----------------------------------------------------
          # COLLECTION FIRESTORE
          # -----------------------------------------------------

          grep -Fq \
            'yb_chat_conversations' \
            "$MAIN" || {
              echo "::error::Collection yb_chat_conversations absente."
              exit 1
            }

          # -----------------------------------------------------
          # ENVOI MESSAGE EXISTANT
          # -----------------------------------------------------

          grep -Fq \
            'sendClientMessageAtomic' \
            "$MAIN" || {
              echo "::error::sendClientMessageAtomic() absent."
              exit 1
            }

          echo ""
          echo "OK : bouton ENVOYER"
          echo "OK : persistPendingChatDraft()"
          echo "OK : openChatEntry()"
          echo "OK : Firebase Anonymous Auth"
          echo "OK : requestChatPhoneNumber()"
          echo "OK : openOrCreateClientConversation()"
          echo "OK : whereEqualTo(ownerUid)"
          echo "OK : createConversationAndSendDraft()"
          echo "OK : conversation.set(c)"
          echo "OK : message.set(msg)"
          echo "OK : yb_chat_conversations"

          echo ""
          echo "=============================================="
          echo "     VRAI CIRCUIT CHAT DETECTE"
          echo "=============================================="

      # =========================================================
      # VERIFICATION ADMIN
      # =========================================================

      - name: Verify Chat administration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "=============================================="
          echo "       VERIFICATION CHAT ADMINISTRATION"
          echo "=============================================="

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {
              echo "::error::adminChatInbox() absent."
              exit 1
            }

          grep -Fq \
            'addSnapshotListener' \
            "$MAIN" || {
              echo "::error::addSnapshotListener absent."
              exit 1
            }

          grep -Fq \
            'Collections.sort(docs' \
            "$MAIN" || {
              echo "::error::Tri des conversations Admin absent."
              exit 1
            }

          grep -Fq \
            'FIREBASE_ADMIN_EMAIL.equalsIgnoreCase' \
            "$MAIN" || {
              echo "::error::Contrôle email Admin absent."
              exit 1
            }

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$MAIN" || {
              echo "::error::Email Admin absent."
              exit 1
            }

          echo ""
          echo "OK : adminChatInbox()"
          echo "OK : listener Firestore"
          echo "OK : tri des conversations"
          echo "OK : identification Admin"

      # =========================================================
      # VERIFICATION FIRESTORE RULES
      # =========================================================

      - name: Verify Firebase rules are compatible with V34 Chat
        shell: bash
        run: |
          set -euo pipefail

          RULES="$PROJECT_DIR/firestore.rules"

          echo "=============================================="
          echo "       VERIFICATION REGLES FIRESTORE"
          echo "=============================================="

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          # -----------------------------------------------------
          # AUTHENTIFICATION
          # -----------------------------------------------------

          grep -Fq \
            'function isSignedIn()' \
            "$RULES" || {
              echo "::error::isSignedIn() absent."
              exit 1
            }

          grep -Fq \
            'function isAdmin()' \
            "$RULES" || {
              echo "::error::isAdmin() absent."
              exit 1
            }

          # -----------------------------------------------------
          # ADMIN
          # -----------------------------------------------------

          grep -Fq \
            'request.auth.uid == "StxrZBDeUodj7YVPmXRA2AbWcUF2"' \
            "$RULES" || {
              echo "::error::UID Admin absent des règles."
              exit 1
            }

          grep -Fq \
            'request.auth.token.email == "elishayoungest19@gmail.com"' \
            "$RULES" || {
              echo "::error::Email Admin absent des règles."
              exit 1
            }

          # -----------------------------------------------------
          # CONVERSATIONS
          # -----------------------------------------------------

          grep -Fq \
            'match /yb_chat_conversations/{conversationId}' \
            "$RULES" || {
              echo "::error::Collection yb_chat_conversations absente."
              exit 1
            }

          grep -Fq \
            'request.resource.data.ownerUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::ownerUid non vérifié."
              exit 1
            }

          grep -Fq \
            'request.resource.data.phone is string' \
            "$RULES" || {
              echo "::error::champ phone absent."
              exit 1
            }

          grep -Fq \
            'request.resource.data.status == "OPEN"' \
            "$RULES" || {
              echo "::error::statut OPEN absent."
              exit 1
            }

          # -----------------------------------------------------
          # MESSAGES
          # -----------------------------------------------------

          grep -Fq \
            'match /messages/{messageId}' \
            "$RULES" || {
              echo "::error::Sous-collection messages absente."
              exit 1
            }

          grep -Fq \
            'function parentConversation()' \
            "$RULES" || {
              echo "::error::parentConversation() absent."
              exit 1
            }

          grep -Fq \
            'request.resource.data.senderUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::senderUid non vérifié."
              exit 1
            }

          grep -Fq \
            'request.resource.data.senderRole == "client"' \
            "$RULES" || {
              echo "::error::senderRole client absent."
              exit 1
            }

          echo ""
          echo "OK : Authentification"
          echo "OK : Admin UID"
          echo "OK : Admin email"
          echo "OK : yb_chat_conversations"
          echo "OK : ownerUid"
          echo "OK : phone"
          echo "OK : status OPEN"
          echo "OK : messages"
          echo "OK : parentConversation()"
          echo "OK : senderUid"
          echo "OK : senderRole client"

          echo ""
          echo "=============================================="
          echo " FIRESTORE RULES V34 CHAT CHECK PASSED"
          echo "=============================================="

      # =========================================================
      # VERIFICATION FIREBASE PROJECT
      # =========================================================

      - name: Verify Firebase project files
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "=============================================="
          echo "       VERIFICATION FIREBASE PROJECT"
          echo "=============================================="

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json absent."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java absent."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js absent."
            exit 1
          }

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {
              echo "::error::FirebaseMessagingService absent."
              exit 1
            }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {
              echo "::error::onMessageReceived absent."
              exit 1
            }

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {
              echo "::error::onDocumentCreated absent."
              exit 1
            }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {
              echo "::error::notifyClientWhenAdminReplies absent."
              exit 1
            }

          node --check "$FUNCTIONS"

          echo ""
          echo "OK : google-services.json"
          echo "OK : Firebase Messaging"
          echo "OK : Cloud Functions"
          echo "OK : syntax Functions"

      # =========================================================
      # CONFIGURATION SIGNATURE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo 
