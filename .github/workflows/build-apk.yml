name: Build Android APK V19 Requests Sync Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK V19 Requests Sync Fix
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ajouter Android Build Tools au PATH
        run: |
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Installer Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Trouver UNIQUEMENT le ZIP V19 Requests Fix
        shell: bash
        run: |
          set -e

          EXPECTED="YOUNGEST-BUSINESS-V19-SYNCHRONISATION-FIREBASE-CORRIGEE-REQUESTS-FIX.zip"

          echo "Recherche du fichier obligatoire :"
          echo "$EXPECTED"

          ZIP=$(find . -maxdepth 3 -type f -name "$EXPECTED" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : le ZIP V19 Requests Fix est introuvable."
            echo "ZIP attendue : $EXPECTED"
            echo "ZIP disponibles :"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP V19 CORRIGEE TROUVEE : $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extraire le projet V19
        shell: bash
        run: |
          set -e

          rm -rf v19-extracted
          mkdir -p v19-extracted

          echo "Extraction de : $ZIP_PATH"

          unzip -q "$ZIP_PATH" -d v19-extracted

          echo "Extraction terminee."

      - name: Detecter le projet Android
        shell: bash
        run: |
          set -e

          PROJECT=$(find v19-extracted -type f -name "settings.gradle" -print -quit)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find v19-extracted -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : projet Android introuvable."
            find v19-extracted -maxdepth 5 -type f -print | head -200
            exit 1
          fi

          ROOT=$(dirname "$PROJECT")

          echo "Projet Android detecte : $ROOT"
          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verifier le projet V19
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERREUR : settings.gradle introuvable."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERREUR : app/build.gradle introuvable."
            exit 1
          fi

          echo "Projet Android V19 valide."

      - name: Verifier le code Requests Fix
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          echo "Verification du code de synchronisation..."

          if ! grep -R -q "yb_loan_requests" app/src/main/java; then
            echo "ERREUR : yb_loan_requests introuvable."
            exit 1
          fi

          if ! grep -R -q "attachBureauRequestsListener" app/src/main/java; then
            echo "ERREUR : attachBureauRequestsListener introuvable."
            exit 1
          fi

          if ! grep -R -q "attachClientRequestsListener" app/src/main/java; then
            echo "ERREUR : attachClientRequestsListener introuvable."
            exit 1
          fi

          echo "Code Requests Fix detecte."

      - name: Configurer Firebase
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if [ -f google-services.json ]; then
            mkdir -p app
            cp google-services.json app/google-services.json
            echo "google-services.json configure."
          elif [ -f app/google-services.json ]; then
            echo "google-services.json deja present."
          else
            echo "ERREUR : google-services.json introuvable."
            exit 1
          fi

      - name: Verifier Firebase Firestore
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if ! grep -R -q "FirebaseFirestore" app/src/main/java; then
            echo "ERREUR : FirebaseFirestore introuvable."
            exit 1
          fi

          echo "Firebase Firestore detecte."

      - name: Preparer le keystore Release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          cd "$ANDROID_ROOT"

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          ALIAS=$(keytool -list -keystore release-keystore.jks -storepass "$KEYSTORE_PASSWORD" -v | awk -F': ' '/Alias name:/ {print $2; exit}')

          if [ -z "$ALIAS" ]; then
            echo "ERREUR : alias du keystore introuvable."
            exit 1
          fi

          echo "Alias detecte : $ALIAS"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Verifier le keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          cd "$ANDROID_ROOT"

          if [ ! -f release-keystore.jks ]; then
            echo "ERREUR : keystore introuvable."
            exit 1
          fi

          keytool -list -keystore release-keystore.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null

          echo "Keystore Release valide."

      - name: Nettoyer le projet V19
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          cd "$ANDROID_ROOT"

          gradle clean --no-daemon

      - name: Compiler APK V19 Release
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          cd "$ANDROID_ROOT"

          gradle :app:assembleRelease --no-daemon

      - name: Verifier APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_ROOT"

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK non trouve."
            exit 1
          fi

          echo "APK trouve : $APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERREUR : apksigner introuvable."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "Signature APK valide."

      - name: Preparer APK final
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_ROOT/app/build/outputs/apk/release" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK Release introuvable."
            exit 1
          fi

          mkdir -p final-apk

          cp "$APK" "final-apk/YOUNGEST-BUSINESS-V19-REQUESTS-SYNC-FIX.apk"

          echo "APK final prepare."

      - name: Publier APK V19 Requests Fix
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V19-REQUESTS-SYNC-FIX
          path: final-apk/YOUNGEST-BUSINESS-V19-REQUESTS-SYNC-FIX.apk
          if-no-files-found: error
