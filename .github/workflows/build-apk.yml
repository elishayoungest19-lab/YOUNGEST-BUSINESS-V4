
name: Build YOUNGEST'S BUSINESS V25 Reports and Transfers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract, build and verify V25 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Select and extract V25 source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME='YOUNGEST-BUSINESS-V25-JOURNAL-PDF-DATE-CORRIGE.zip'
          ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_NAME"

          echo "Expected source ZIP: $ZIP_NAME"

          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::V25 source ZIP is missing or empty: $ZIP_NAME"
            echo "ZIP files found at repository root:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              -iname '*.zip' -printf '%f\n'
            exit 1
          fi

          SOURCE_SHA256="$(sha256sum "$ZIP_PATH" | awk '{print $1}')"

          echo "source_zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$SOURCE_SHA256" >> "$GITHUB_OUTPUT"

          unzip -tq "$ZIP_PATH"

          mkdir -p "$RUNNER_TEMP/v25-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/v25-source"

          SETTINGS_PATH="$(find "$RUNNER_TEMP/v25-source" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_PATH" ]; then
            echo "::error::No settings.gradle found in the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_PATH")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $PROJECT_DIR"

      - name: Verify source and Firebase configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          test -s "$MAIN" || {
            echo "::error::MainActivity.java missing or empty."
            exit 1
          }

          test -s "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json missing or empty."
            exit 1
          }

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          test -f "$BUILD_FILE" || {
            echo "::error::App Gradle build file not found."
            exit 1
          }

          echo "=== Android version ==="
          grep -nE 'versionCode|versionName' "$BUILD_FILE" || true

          if ! grep -Eq 'versionCode[[:space:]]*=?[[:space:]]*25([^0-9]|$)' "$BUILD_FILE"; then
            echo "::error::The source ZIP must declare versionCode 25."
            exit 1
          fi

          echo "=== Journal/PDF source indicators ==="
          grep -niE 'PdfDocument|journal|rapport|historique|CDF|USD|transfer|transfert' \
            "$MAIN" || true

          echo "Source checks passed."

      - name: Prepare release signing
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing release signing secrets."
            echo "Required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$PROJECT_DIR/release-keystore.jks"

          test -s "$PROJECT_DIR/release-keystore.jks"

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(keytool -list -v \
              -keystore "$PROJECT_DIR/release-keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | sed -n 's/^Alias name: //p' | head -n 1 || true)"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Signing alias not found. Configure KEY_ALIAS."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean :app:assembleRelease --no-daemon
          else
            gradle clean :app:assembleRelease --no-daemon
          fi

      - name: Verify APK version and signature
        id: verify
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          SOURCE_ZIP: ${{ steps.source.outputs.source_zip }}
          SOURCE_SHA256: ${{ steps.source.outputs.source_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "::error::Release APK not found."
            exit 1
          }

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | head -n 3

          echo "$BADGING" | grep -q "versionCode='25'" || {
            echo "::error::Built APK is not versionCode 25."
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/release-apk"

          APK_NAME="YOUNGEST-BUSINESS-V25-REPORTS-TRANSFERS-RELEASE.apk"
          cp "$APK" "$GITHUB_WORKSPACE/release-apk/$APK_NAME"

          APK_SHA256="$(sha256sum \
            "$GITHUB_WORKSPACE/release-apk/$APK_NAME" | awk '{print $1}')"

          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          sha256sum "$GITHUB_WORKSPACE/release-apk/$APK_NAME" \
            | tee "$GITHUB_WORKSPACE/release-apk/SHA256SUMS.txt"

          {
            echo "Source ZIP: $SOURCE_ZIP"
            echo "Source ZIP SHA-256: $SOURCE_SHA256"
            echo "Source commit: $GITHUB_SHA"
            echo "APK file: $APK_NAME"
            echo "APK SHA-256: $APK_SHA256"
            echo "APK versionCode: 25"
            echo "APK signature verification: PASSED"
          } > "$GITHUB_WORKSPACE/release-apk/BUILD-PROVENANCE.txt"

      - name: Upload verified V25 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V25-REPORTS-TRANSFERS-RELEASE
          path: release-apk/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish build summary
        if: always()
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.source_zip }}
          SOURCE_SHA256: ${{ steps.source.outputs.source_sha256 }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
        run: |
          {
            echo "## YOUNGEST'S BUSINESS V25 build"
            echo ""
            echo "- Source ZIP: ${SOURCE_ZIP:-not identified}"
            echo "- Source ZIP SHA-256: ${SOURCE_SHA256:-not available}"
            echo "- APK SHA-256: ${APK_SHA256:-not available}"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
