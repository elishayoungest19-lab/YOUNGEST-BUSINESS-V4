name: Build Android APK V23 Journal Mobile Money

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V23 Journal Mobile Money
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver le ZIP V23 Journal Mobile Money
        id: find_zip
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f -name 'YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY.zip' | sort | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP V23 Journal Mobile Money introuvable."
            find . -maxdepth 3 -type f -name '*V21*.zip' | sort || true
            exit 1
          fi
          echo "ZIP V23 trouve : $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraire le projet V23
        shell: bash
        run: |
          set -e
          rm -rf v23-extracted
          mkdir -p v23-extracted
          unzip -o "${{ steps.find_zip.outputs.zip }}" -d v23-extracted

      - name: Detecter le projet Android
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(find v23-extracted \( -name settings.gradle -o -name settings.gradle.kts \) -print | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android V20 introuvable."
            exit 1
          fi
          echo "Projet Android : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verifier identite V23 et module Journal Mobile Money
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          grep -q "applicationId 'com.aistudio.youngestbiz.mbkz'" app/build.gradle
          grep -q "versionCode 23" app/build.gradle
          grep -q "versionName '1.17.0'" app/build.gradle
          grep -q 'yb_loan_requests' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'moneyJournalPage' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'showMoneyJournalReport' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'ENREGISTRER UN ENVOI EFFECTUÉ' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'moneyJournalPage' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'showMoneyJournalReport' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'ENREGISTRER UN ENVOI EFFECTUÉ' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'attachBureauRequestsListener' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'loanRequestsListenerIsClient' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'whereEqualTo("requesterUid", clientUid)' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'q.clientId=clientUid' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'signInWithEmailAndPassword' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'StxrZBDeUodj7YVPmXRA2AbWcUF2' firestore.rules
          grep -q 'request.resource.data.status == "EN_ATTENTE"' firestore.rules
          grep -q 'addOnFailureListener' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          echo "Identite V23 et module Journal Mobile Money verifies."

      - name: Configurer Firebase
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f "app/google-services.json" ]; then
            echo "Firebase deja configure."
          elif [ -f "google-services.json" ]; then
            cp google-services.json app/google-services.json
          else
            SOURCE=$(find "$GITHUB_WORKSPACE" -type f -name 'google-services.json' | head -n 1)
            if [ -n "$SOURCE" ]; then
              cp "$SOURCE" app/google-services.json
            else
              echo "ERREUR : google-services.json introuvable."
              exit 1
            fi
          fi

      - name: Preparer le keystore Release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          ALIAS=$(keytool -list -keystore release-keystore.jks -storepass "$KEYSTORE_PASSWORD" -v 2>/dev/null | awk -F': ' '/Alias name:/ {print $2; exit}')
          test -n "$ALIAS"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Alias Release detecte."

      - name: Nettoyer et compiler V23 Release
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean --no-daemon
          gradle :app:assembleRelease --no-daemon

      - name: Verifier APK et signature
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK V21 : $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "APK Release signe et valide."
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Preparer l'APK V23
        shell: bash
        run: |
          set -e
          mkdir -p release-apk
          cp "$APK_PATH" "release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk"
          ls -lh release-apk/

      - name: Publier APK V23 Release
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE
          path: release-apk/YOUNGEST-BUSINESS-V23-JOURNAL-MOBILE-MONEY-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
