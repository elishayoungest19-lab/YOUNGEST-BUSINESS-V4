name: YOUNGEST'S BUSINESS V51 Wi-Fi Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - YOUNGEST-BUSINESS-V51-WIFI-WEB-ADMIN-FIREBASE-SOURCE.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

concurrency:
  group: yb-wifi-v51-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V51-WIFI-WEB-ADMIN-FIREBASE-SOURCE.zip

jobs:
  build-android:
    name: Build and verify V51 signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and verify V51 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          test -s "$ZIP_PATH" || {
            echo "::error::ZIP V51 introuvable à la racine du dépôt. Vérifiez le nom exact du fichier."
            exit 1
          }

          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v51-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          PROJECT_DIR=""

          while IFS= read -r -d '' SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -s "$CANDIDATE/app/build.gradle" ] \
              && [ -s "$CANDIDATE/app/src/main/AndroidManifest.xml" \
              ] && [ -s "$CANDIDATE/app/google-services.json" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find "$DEST" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projet Android Gradle introuvable dans le ZIP V51."
            exit 1
          fi

          test -s "$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set V51 version
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          python3 - "$GRADLE_FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          text, code_count = re.subn(
              r"(?m)^([ \t]*versionCode[ \t]+)\d+([ \t]*)$",
              r"\g<1>51\g<2>",
              text,
              count=1
          )

          text, name_count = re.subn(
              r"""(?m)^([ \t]*versionName[ \t]+)['"][^'"]+['"]([ \t]*)$""",
              r"\g<1>'1.51.0-wifi'\g<2>",
              text,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Impossible de définir sûrement la version V51.")

          if "com.aistudio.youngestbiz.mbkz" not in text:
              raise SystemExit("Application ID attendu introuvable.")

          path.write_text(text, encoding="utf-8")
          PY

          grep -Eq 'versionCode[[:space:]]+51([[:space:]]|$)' "$GRADLE_FILE"
          grep -Fq "com.aistudio.youngestbiz.mbkz" "$GRADLE_FILE"

      - name: Configure production signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::Secret KEYSTORE_BASE64 manquant."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "::error::Secret KEYSTORE_PASSWORD manquant."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::Secret KEY_PASSWORD manquant."
            exit 1
          }

          KEYSTORE_FILE="$PROJECT_DIR/release-keystore.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          KEY_ALIAS="$(
            keytool -list -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | awk -F': ' '/^Alias name:/{print $2; exit}'
          )"

          test -n "$KEY_ALIAS" || {
            echo "::error::Alias du keystore introuvable."
            exit 1
          }

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build V51 release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleRelease --stacktrace

      - name: Verify APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          )"

          echo "$BADGING" \
            | grep -Fq "package: name='com.aistudio.youngestbiz.mbkz'"

          echo "$BADGING" \
            | grep -Fq "versionCode='51'"

          echo "$BADGING" \
            | grep -Fq "versionName='1.51.0-wifi'"

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V51-WIFI-SIGNED.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V51-WIFI-SIGNED.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

      - name: Upload signed V51 APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V51-WIFI-SIGNED
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

# Android APK build only.
# Firebase Hosting and Firestore rules are not deployed by this workflow.
