name: Build YOUNGEST'S BUSINESS V34 Chat Delivery Final FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build and verify signed V34 CHAT FIXED APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # VERIFICATION GRADLE
      #
      # IMPORTANT :
      # Le ZIP V34 FIXED ne contient volontairement pas gradlew.
      # Nous utilisons donc le Gradle 8.9 installé par GitHub Actions.
      # =========================================================

      - name: Verify Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "        VERIFICATION GRADLE 8.9"
          echo "========================================="

          gradle --version

          echo ""
          echo "Gradle 8.9 disponible : OK"

      # =========================================================
      # RECHERCHE EXACTE DU VRAI SOURCE V34 FIXED
      # =========================================================

      - name: Find exact V34 CHAT FIXED source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          ZIP_NAME="YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-source-FIXED.zip"

          echo "========================================="
          echo "     RECHERCHE DU SOURCE V34 FIXED"
          echo "========================================="

          ZIP_PATH="$(
            find "$ROOT" \
              -maxdepth 6 \
              -type f \
              -name "$ZIP_NAME" \
              -print \
              -quit
          )"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Le vrai ZIP V34 FIXED est introuvable."
            echo ""
            echo "Fichier obligatoire :"
            echo "$ZIP_NAME"
            echo ""
            echo "ZIP actuellement présents dans le repository :"

            find "$ROOT" \
              -maxdepth 6 \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo ""
          echo "SOURCE EXACT TROUVE :"
          echo "$ZIP_PATH"

          echo ""
          echo "Verification de l'archive..."

          unzip -t "$ZIP_PATH"

          echo ""
          echo "Archive V34 FIXED valide."

          # -----------------------------------------------------
          # EXTRACTION
          # -----------------------------------------------------

          DEST="$RUNNER_TEMP/v34-fixed-source"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          unzip -q "$ZIP_PATH" -d "$DEST"

          echo ""
          echo "Extraction terminee."

          # -----------------------------------------------------
          # RECHERCHE DU PROJET ANDROID
          # -----------------------------------------------------

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le V34 FIXED."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android detecte :"
          echo "$PROJECT_DIR"

          echo ""
          echo "========================================="
          echo "     V34 FIXED SOURCE PRET"
          echo "========================================="

      # =========================================================
      # IDENTITE EXACTE V34
      # =========================================================

      - name: Verify exact V34 identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          echo "========================================="
          echo "       IDENTITE EXACTE V34"
          echo "========================================="

          test -f "$GRADLE_FILE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Eq \
            'versionCode[[:space:]]+34([[:space:]]|$)' \
            "$GRADLE_FILE" || {
              echo "::error::versionCode 34 absent."
              exit 1
          }

          grep -Fq \
            "versionName '1.27.0'" \
            "$GRADLE_FILE" || {
              echo "::error::versionName 1.27.0 absent."
              exit 1
          }

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE_FILE" || {
              echo "::error::applicationId incorrect."
              exit 1
          }

          grep -Fq \
            "namespace 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE_FILE" || {
              echo "::error::namespace incorrect."
              exit 1
          }

          echo "versionCode 34 : OK"
          echo "versionName 1.27.0 : OK"
          echo "applicationId : OK"
          echo "namespace : OK"

      # =========================================================
      # VERIFICATION DES FICHIERS FIREBASE
      # =========================================================

      - name: Verify Firebase project files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "       VERIFICATION FICHIERS FIREBASE"
          echo "========================================="

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"

          RULES="$PROJECT_DIR/firestore.rules"

          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          GOOGLE="$PROJECT_DIR/app/google-services.json"

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java introuvable."
            exit 1
          }

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js introuvable."
            exit 1
          }

          test -f "$GOOGLE" || {
            echo "::error::google-services.json introuvable."
            exit 1
          }

          echo "MainActivity.java : OK"
          echo "AppNotificationService.java : OK"
          echo "firestore.rules : OK"
          echo "functions/index.js : OK"
          echo "google-services.json : OK"

      # =========================================================
      # VERIFICATION DU VRAI CHEMIN CHAT CLIENT
      # =========================================================

      - name: Verify real client Chat delivery path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "     VERIFICATION CHEMIN CHAT CLIENT"
          echo "========================================="

          # -----------------------------------------------------
          # BOUTON ENVOYER
          # -----------------------------------------------------

          grep -Fq \
            'persistPendingChatDraft' \
            "$MAIN" || {
              echo "::error::persistPendingChatDraft absent."
              exit 1
          }

          # -----------------------------------------------------
          # ENTREE CHAT
          # -----------------------------------------------------

          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {
              echo "::error::openChatEntry() absent."
              exit 1
          }

          # -----------------------------------------------------
          # NUMERO CLIENT
          # -----------------------------------------------------

          grep -Fq \
            'requestChatPhoneNumber()' \
            "$MAIN" || {
              echo "::error::requestChatPhoneNumber() absent."
              exit 1
          }

          # -----------------------------------------------------
          # SESSION FIREBASE ANONYMOUS
          # -----------------------------------------------------

          grep -Fq \
            'signInAnonymously' \
            "$MAIN" || {
              echo "::error::Firebase Anonymous Authentication absente."
              exit 1
          }

          # -----------------------------------------------------
          # NUMERO CONSERVE
          # -----------------------------------------------------

          grep -Fq \
            'KEY_PENDING_CHAT_PHONE' \
            "$MAIN" || {
              echo "::error::KEY_PENDING_CHAT_PHONE absent."
              exit 1
          }

          # -----------------------------------------------------
          # OUVERTURE / CREATION CONVERSATION
          # -----------------------------------------------------

          grep -Fq \
            'openOrCreateClientConversation()' \
            "$MAIN" || {
              echo "::error::openOrCreateClientConversation() absent."
              exit 1
          }

          # -----------------------------------------------------
          # RECHERCHE PAR OWNER UID
          # -----------------------------------------------------

          grep -Fq \
            'whereEqualTo("ownerUid"' \
            "$MAIN" || {
              echo "::error::Recherche ownerUid absente."
              exit 1
          }

          # -----------------------------------------------------
          # CREATION CONVERSATION
          # -----------------------------------------------------

          grep -Fq \
            'createConversationAndSendDraft' \
            "$MAIN" || {
              echo "::error::createConversationAndSendDraft() absent."
              exit 1
          }

          # -----------------------------------------------------
          # CORRECTION CRITIQUE
          #
          # La conversation doit être créée AVANT le message.
          # -----------------------------------------------------

          grep -Fq \
            'V34 FIX CRITIQUE' \
            "$MAIN" || {
              echo "::error::Marqueur V34 FIX CRITIQUE absent."
              exit 1
          }

          grep -Fq \
            'conversation.set(c)' \
            "$MAIN" || {
              echo "::error::conversation.set(c) absent."
              exit 1
          }

          grep -Fq \
            'message.set(msg)' \
            "$MAIN" || {
              echo "::error::message.set(msg) absent."
              exit 1
          }

          echo ""
          echo "persistPendingChatDraft : OK"
          echo "openChatEntry : OK"
          echo "Firebase Anonymous Auth : OK"
          echo "requestChatPhoneNumber : OK"
          echo "openOrCreateClientConversation : OK"
          echo "whereEqualTo(ownerUid) : OK"
          echo "createConversationAndSendDraft : OK"
          echo "conversation.set(c) : OK"
          echo "message.set(msg) : OK"

          echo ""
          echo "========================================="
          echo "      CHEMIN CHAT CLIENT VALIDE"
          echo "========================================="

      # =========================================================
      # VERIFICATION ADMIN CHAT
      # =========================================================

      - name: Verify Chat administration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "       VERIFICATION CHAT ADMIN"
          echo "========================================="

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {
              echo "::error::adminChatInbox() absent."
              exit 1
          }

          grep -Fq \
            'FIREBASE_ADMIN_EMAIL.equalsIgnoreCase' \
            "$MAIN" || {
              echo "::error::Identification Admin par email absente."
              exit 1
          }

          grep -Fq \
            'Collections.sort(docs' \
            "$MAIN" || {
              echo "::error::Tri des conversations Admin absent."
              exit 1
          }

          grep -Fq \
            'yb_chat_conversations' \
            "$MAIN" || {
              echo "::error::Collection yb_chat_conversations absente du Chat Admin."
              exit 1
          }

          echo "adminChatInbox : OK"
          echo "Identification Admin : OK"
          echo "Lecture yb_chat_conversations : OK"
          echo "Tri conversations : OK"

      # =========================================================
      # VERIFICATION FIRESTORE RULES
      # =========================================================

      - name: Verify Firebase rules are compatible with V34 Chat
        shell: bash
        run: |
          set -euo pipefail

          RULES="$PROJECT_DIR/firestore.rules"

          echo "========================================="
          echo "       VERIFICATION REGLES FIREBASE"
          echo "========================================="

          # -----------------------------------------------------
          # AUTHENTIFICATION
          # -----------------------------------------------------

          grep -Fq \
            'function isSignedIn()' \
            "$RULES" || {
              echo "::error::function isSignedIn() absente."
              exit 1
          }

          grep -Fq \
            'function isAdmin()' \
            "$RULES" || {
              echo "::error::function isAdmin() absente."
              exit 1
          }

          # -----------------------------------------------------
          # ADMIN UID
          # -----------------------------------------------------

          grep -Fq \
            'StxrZBDeUodj7YVPmXRA2AbWcUF2' \
            "$RULES" || {
              echo "::error::UID Admin absent des règles."
              exit 1
          }

          # -----------------------------------------------------
          # ADMIN EMAIL
          # -----------------------------------------------------

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$RULES" || {
              echo "::error::Email Admin absent des règles."
              exit 1
          }

          # -----------------------------------------------------
          # COLLECTION CHAT
          # -----------------------------------------------------

          grep -Fq \
            'match /yb_chat_conversations/' \
            "$RULES" || {
              echo "::error::Collection yb_chat_conversations absente."
              exit 1
          }

          # -----------------------------------------------------
          # CREATION CLIENT
          # -----------------------------------------------------

          grep -Fq \
            'request.resource.data.ownerUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::Contrôle ownerUid absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.phone is string' \
            "$RULES" || {
              echo "::error::Contrôle phone absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.status == "OPEN"' \
            "$RULES" || {
              echo "::error::Statut OPEN absent."
              exit 1
          }

          # -----------------------------------------------------
          # MESSAGES
          # -----------------------------------------------------

          grep -Fq \
            'match /messages/{messageId}' \
            "$RULES" || {
              echo "::error::Sous-collection messages absente."
              exit 1
          }

          grep -Fq \
            'function parentConversation()' \
            "$RULES" || {
              echo "::error::parentConversation() absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::Contrôle senderUid absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderRole == "client"' \
            "$RULES" || {
              echo "::error::senderRole client absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderRole == "admin"' \
            "$RULES" || {
              echo "::error::senderRole admin absent."
              exit 1
          }

          # -----------------------------------------------------
          # TOKENS FCM
          # -----------------------------------------------------

          grep -Fq \
            'match /yb_notification_tokens/' \
            "$RULES" || {
              echo "::error::Règle tokens notification absente."
              exit 1
          }

          echo ""
          echo "Rules Auth : OK"
          echo "Rules Admin : OK"
          echo "Rules Chat conversations : OK"
          echo "Rules Chat messages : OK"
          echo "Rules notification tokens : OK"

          echo ""
          echo "========================================="
          echo "     REGLES FIREBASE COMPATIBLES V34"
          echo "========================================="

      # =========================================================
      # VERIFICATION NOTIFICATIONS
      # =========================================================

      - name: Verify Firebase notifications
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"

          echo "========================================="
          echo "       VERIFICATION NOTIFICATIONS"
          echo "========================================="

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {
              echo "::error::FirebaseMessagingService absent."
              exit 1
          }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {
              echo "::error::onMessageReceived absent."
              exit 1
          }

          echo "FirebaseMessagingService : OK"
          echo "onMessageReceived : OK"

      # =========================================================
      # VERIFICATION CLOUD FUNCTIONS
      # =========================================================

      - name: Verify Cloud Functions
        shell: bash
        run: |
          set -euo pipefail

          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "========================================="
          echo "       VERIFICATION CLOUD FUNCTIONS"
          echo "========================================="

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {
              echo "::error::onDocumentCreated absent."
              exit 1
          }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {
              echo "::error::notifyClientWhenAdminReplies absent."
              exit 1
          }

          node --check "$FUNCTIONS"

          echo "onDocumentCreated : OK"
          echo "notifyClientWhenAdminReplies : OK"
          echo "Syntax Node.js : OK"

      # =========================================================
      # CONFIGURATION SIGNATURE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "       CONFIGURATION SIGNATURE V34"
          echo "========================================="

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 manquant."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD manquant."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEY_PASSWORD manquant."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "::error::Keystore vide ou invalide."
            exit 1
          fi

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(
              keytool \
                -list \
                -v \
                -keystore release-keystore.jks \
                -storepass "$KEYSTORE_PASSWORD" \
                2>/dev/null \
                | sed -n 's/^Alias name: //p' \
                | head -n 1
            )"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::Impossible de déterminer KEY_ALIAS."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          echo "Keystore : OK"
          echo "Alias : OK"
          echo "Signature : OK"

      # =========================================================
      # VERIFICATION CONFIGURATION GRADLE RELEASE
      # =========================================================

      - name: Verify Gradle release configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          echo "========================================="
          echo "   VERIFICATION CONFIGURATION RELEASE"
          echo "========================================="

          grep -Fq \
            'signingConfigs' \
            "$GRADLE_FILE" || {
              echo "::error::signingConfigs absent."
              exit 1
          }

          grep -Fq \
            'release-keystore.jks' \
            "$GRADLE_FILE" || {
              echo "::error::release-keystore.jks absent."
              exit 1
          }

          grep -Fq \
            'ANDROID_KEYSTORE_PASSWORD' \
            "$GRADLE_FILE" || {
              echo "::error::ANDROID_KEYSTORE_PASSWORD absent."
              exit 1
          }

          grep -Fq \
            'ANDROID_KEY_ALIAS' \
            "$GRADLE_FILE" || {
              echo "::error::ANDROID_KEY_ALIAS absent."
              exit 1
          }

          grep -Fq \
            'ANDROID_KEY_PASSWORD' \
            "$GRADLE_FILE" || {
              echo "::error::ANDROID_KEY_PASSWORD absent."
              exit 1
          }

          echo "Configuration signingConfigs : OK"
          echo "Keystore release : OK"
          echo "Variables de signature : OK"

      # =========================================================
      # COMPILATION APK
      #
      # IMPORTANT :
      # On utilise "gradle", PAS "./gradlew".
      # =========================================================

      - name: Build release APK V34 CHAT FIXED
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "      COMPILATION APK V34 CHAT FIXED"
          echo "========================================="

          gradle \
            --no-daemon \
            clean \
            :app:assembleRelease

          echo ""
          echo "========================================="
          echo "       COMPILATION TERMINEE"
          echo "========================================="

      # =========================================================
      # VERIFICATION APK
      # =========================================================

      - name: Verify APK signature and identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "========================================="
          echo "        VERIFICATION APK V34"
          echo "========================================="

          if [ ! -s "$APK" ]; then
            echo "::error::APK release introuvable."
            exit 1
          fi

          echo "APK trouve :"
          echo "$APK"

          echo ""
          echo "Verification signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "Lecture des informations APK..."

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
              "package: name='com.aistudio.youngestbiz.mbkz'" || {
              echo "::error::applicationId incorrect."
              exit 1
          }

          echo "$BADGING" \
            | grep -q \
              "versionCode='34'" || {
              echo "::error::versionCode 34 absent."
              exit 1
          }

          echo "$BADGING" \
            | grep -q \
              "versionName='1.27.0'" || {
              echo "::error::versionName 1.27.0 absent."
              exit 1
          }

          echo ""
          echo "Signature : OK"
          echo "applicationId : OK"
          echo "versionCode 34 : OK"
          echo "versionName 1.27.0 : OK"

      # =========================================================
      # PREPARATION ARTIFACT FINAL
      # =========================================================

      - name: Prepare V34 CHAT FIXED artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          OUTPUT="$GITHUB_WORKSPACE/release-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          cp \
            "$APK" \
            "$OUTPUT/YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL.apk"

          sha256sum \
            "$OUTPUT/YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL.apk" \
            > "$OUTPUT/SHA256SUMS.txt"

          echo "========================================="
          echo "       ARTIFACT V34 CHAT FIXED"
          echo "========================================="

          ls -lh "$OUTPUT"

          echo ""
          echo "SHA256 :"
          cat "$OUTPUT/SHA256SUMS.txt"

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================

      - name: Upload V34 CHAT FIXED APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-FIXED
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # CONFIRMATION FINALE
      # =========================================================

      - name: Final V34 CHAT FIXED confirmation
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "===================================================="
          echo "       🎯 YOUNGEST'S BUSINESS V34 CHAT FIXED"
          echo "===================================================="
          echo ""
          echo "SOURCE : V34-CHAT-DELIVERY-FINAL-source-FIXED.zip"
          echo ""
          echo "CHAT CLIENT :"
          echo "  Bouton ENVOYER"
          echo "       ↓"
          echo "  persistPendingChatDraft()"
          echo "       ↓"
          echo "  openChatEntry()"
          echo "       ↓"
          echo "  Firebase Anonymous User"
          echo "       ↓"
          echo "  requestChatPhoneNumber()"
          echo "       ↓"
          echo "  openOrCreateClientConversation()"
          echo "       ↓"
          echo "  whereEqualTo(ownerUid)"
          echo "       ↓"
          echo "  createConversationAndSendDraft()"
          echo "       ↓"
          echo "  conversation.set(c)"
          echo "       ↓"
          echo "  message.set(msg)"
          echo "       ↓"
