name: "Build YOUNGEST’S BUSINESS V16 Mobile Money RDC"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V16 Mobile Money RDC"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation de platform-tools..."
          sdkmanager --install "platform-tools"

          echo "Installation de la plateforme Android 35..."
          sdkmanager --install "platforms;android-35"

          echo "Installation de Build Tools 35.0.0..."
          sdkmanager --install "build-tools;35.0.0"

          echo "Composants Android installés avec succès."

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Trouver et décompresser le projet V16"
        shell: bash
        run: |
          set -e

          echo "Recherche du ZIP V16..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname 'YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC*.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : ZIP V16 introuvable."
            echo "Fichiers présents dans le dépôt :"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP V16 trouvé : $ZIP_FILE"

          rm -rf v16-extracted
          mkdir -p v16-extracted

          unzip -q "$ZIP_FILE" -d v16-extracted

          echo "Contenu extrait :"
          find v16-extracted -maxdepth 3 -type f | sort | head -100

      - name: "Détecter la racine du projet Android"
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=$(find "$GITHUB_WORKSPACE/v16-extracted" \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            | head -1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERREUR : settings.gradle introuvable."
            find "$GITHUB_WORKSPACE/v16-extracted" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_ROOT")

          echo "Projet Android trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: "Afficher les informations V16"
        shell: bash
        run: |
          echo "Projet : $PROJECT_DIR"
          echo "Recherche des fichiers V16..."
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -150

      - name: "Copier la configuration Firebase"
        shell: bash
        run: |
          set -e

          FIREBASE_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
            \( -iname 'google-services*.json' -o -iname 'google-services (2).json' \) \
            | head -1 || true)

          if [ -n "$FIREBASE_FILE" ]; then
            echo "Configuration Firebase trouvée : $FIREBASE_FILE"

            mkdir -p "$PROJECT_DIR/app"

            cp "$FIREBASE_FILE" "$PROJECT_DIR/app/google-services.json"

            echo "google-services.json copié dans app/."
          else
            echo "Aucun fichier Firebase trouvé dans le dépôt."
          fi

      - name: "Préparer le keystore de signature"
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/youngest-business-release.jks"

            echo "Keystore préparé."

            cat > "$PROJECT_DIR/keystore.properties" <<EOF
storeFile=youngest-business-release.jks
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF

            echo "Configuration du keystore créée."
          else
            echo "Aucun KEYSTORE_BASE64 configuré."
            echo "Le build continuera avec la configuration existante du projet."
          fi

      - name: "Rendre Gradle exécutable"
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew" 2>/dev/null || true

      - name: "Nettoyer le projet"
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          ./gradlew clean --no-daemon

      - name: "Construire APK Release V16"
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          ./gradlew :app:assembleRelease --no-daemon

      - name: "Vérifier l'APK V16"
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERREUR : aucun APK Release trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/final-apk/YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC.apk"

          echo "APK V16 préparé."

      - name: "Vérifier la signature APK"
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/final-apk/YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ -f "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
            echo "Signature APK vérifiée avec succès."
          else
            echo "apksigner introuvable."
          fi

      - name: "Afficher la taille finale"
        shell: bash
        run: |
          ls -lh "$GITHUB_WORKSPACE/final-apk/YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC.apk"

      - name: "Publier l'APK V16"
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC
          path: final-apk/YOUNGEST-BUSINESS-V16-TRANSFERT-MOBILE-MONEY-RDC.apk
          if-no-files-found: error
