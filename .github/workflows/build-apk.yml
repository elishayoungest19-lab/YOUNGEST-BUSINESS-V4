name: Build YOUNGEST'S BUSINESS V34 Chat Delivery Final FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V34 CHAT FIXED APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE DU VRAI SOURCE V34 FIXED
      # =========================================================

      - name: Find exact V34 CHAT FIXED source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_NAME="YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-source-FIXED.zip"

          echo "========================================="
          echo "   RECHERCHE DU SOURCE V34 CHAT FIXED"
          echo "========================================="

          ZIP_PATH="$ROOT/$ZIP_NAME"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Le ZIP V34 FIXED est introuvable."
            echo "Fichier attendu : $ZIP_NAME"

            echo ""
            echo "ZIP disponibles :"

            find "$ROOT" \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo ""
          echo "ZIP V34 FIXED TROUVE :"
          echo "$ZIP_PATH"

          echo ""
          echo "Verification de l'archive..."

          unzip -t "$ZIP_PATH"

          DEST="$RUNNER_TEMP/v34-chat-fixed"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction..."

          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le ZIP V34 FIXED."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android detecte :"
          echo "$PROJECT_DIR"

          echo ""
          echo "========================================="
          echo "   SOURCE V34 CHAT FIXED DETECTE"
          echo "========================================="

      # =========================================================
      # IDENTITE EXACTE V34
      # =========================================================

      - name: Verify exact V34 identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="$PROJECT_DIR/app/build.gradle"

          echo "========================================="
          echo "       IDENTITE EXACTE V34"
          echo "========================================="

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Eq \
            'versionCode[[:space:]]+34([[:space:]]|$)' \
            "$GRADLE" || {
              echo "::error::versionCode 34 absent."
              exit 1
            }

          grep -Fq \
            "versionName '1.27.0'" \
            "$GRADLE" || {
              echo "::error::versionName 1.27.0 absent."
              exit 1
            }

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE" || {
              echo "::error::applicationId incorrect."
              exit 1
            }

          echo ""
          echo "OK : versionCode 34"
          echo "OK : versionName 1.27.0"
          echo "OK : applicationId correct"

      # =========================================================
      # VERIFICATION DU VRAI CHEMIN CLIENT CHAT
      # =========================================================

      - name: Verify real client Chat delivery path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "       VERIFICATION CHEMIN CHAT"
          echo "========================================="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          # -----------------------------------------------------
          # BOUTON ENVOYER
          # -----------------------------------------------------

          grep -Fq \
            'persistPendingChatDraft' \
            "$MAIN" || {
              echo "::error::persistPendingChatDraft absent."
              exit 1
            }

          # -----------------------------------------------------
          # ENTREE CHAT
          # -----------------------------------------------------

          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {
              echo "::error::openChatEntry() absent."
              exit 1
            }

          # -----------------------------------------------------
          # SESSION FIREBASE ANONYME
          # -----------------------------------------------------

          grep -Fq \
            'signInAnonymously' \
            "$MAIN" || {
              echo "::error::signInAnonymously absent."
              exit 1
            }

          # -----------------------------------------------------
          # NUMERO CLIENT
          # -----------------------------------------------------

          grep -Fq \
            'KEY_PENDING_CHAT_PHONE' \
            "$MAIN" || {
              echo "::error::KEY_PENDING_CHAT_PHONE absent."
              exit 1
            }

          # -----------------------------------------------------
          # DEMANDE NUMERO
          # -----------------------------------------------------

          grep -Fq \
            'requestChatPhoneNumber()' \
            "$MAIN" || {
              echo "::error::requestChatPhoneNumber absent."
              exit 1
            }

          # -----------------------------------------------------
          # OUVERTURE / CREATION CONVERSATION
          # -----------------------------------------------------

          grep -Fq \
            'openOrCreateClientConversation()' \
            "$MAIN" || {
              echo "::error::openOrCreateClientConversation absent."
              exit 1
            }

          # -----------------------------------------------------
          # RECHERCHE OWNER UID
          # -----------------------------------------------------

          grep -Fq \
            'whereEqualTo("ownerUid"' \
            "$MAIN" || {
              echo "::error::whereEqualTo(ownerUid) absent."
              exit 1
            }

          # -----------------------------------------------------
          # CREATION CONVERSATION
          # -----------------------------------------------------

          grep -Fq \
            'createConversationAndSendDraft' \
            "$MAIN" || {
              echo "::error::createConversationAndSendDraft absent."
              exit 1
            }

          # -----------------------------------------------------
          # CORRECTION CRITIQUE :
          # CONVERSATION AVANT MESSAGE
          # -----------------------------------------------------

          grep -Fq \
            'conversation.set(c)' \
            "$MAIN" || {
              echo "::error::conversation.set(c) absent."
              exit 1
            }

          grep -Fq \
            'message.set(msg)' \
            "$MAIN" || {
              echo "::error::message.set(msg) absent."
              exit 1
            }

          grep -Fq \
            'V34 FIX CRITIQUE' \
            "$MAIN" || {
              echo "::error::marqueur V34 FIX CRITIQUE absent."
              exit 1
            }

          # -----------------------------------------------------
          # COLLECTION FIRESTORE
          # -----------------------------------------------------

          grep -Fq \
            'yb_chat_conversations' \
            "$MAIN" || {
              echo "::error::yb_chat_conversations absent."
              exit 1
            }

          echo ""
          echo "OK : Bouton ENVOYER"
          echo "OK : persistPendingChatDraft()"
          echo "OK : openChatEntry()"
          echo "OK : Firebase Anonymous"
          echo "OK : requestChatPhoneNumber()"
          echo "OK : openOrCreateClientConversation()"
          echo "OK : whereEqualTo(ownerUid)"
          echo "OK : createConversationAndSendDraft()"
          echo "OK : conversation.set(c)"
          echo "OK : message.set(msg)"
          echo "OK : yb_chat_conversations"

          echo ""
          echo "========================================="
          echo "     VRAI CHEMIN CHAT CLIENT DETECTE"
          echo "========================================="

      # =========================================================
      # VERIFICATION CHAT ADMIN
      # =========================================================

      - name: Verify Chat administration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "       VERIFICATION CHAT ADMIN"
          echo "========================================="

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {
              echo "::error::adminChatInbox() absent."
              exit 1
            }

          grep -Fq \
            'addSnapshotListener' \
            "$MAIN" || {
              echo "::error::addSnapshotListener absent."
              exit 1
            }

          grep -Fq \
            'Collections.sort(docs' \
            "$MAIN" || {
              echo "::error::tri des conversations Admin absent."
              exit 1
            }

          grep -Fq \
            'FIREBASE_ADMIN_EMAIL.equalsIgnoreCase' \
            "$MAIN" || {
              echo "::error::verification Admin absente."
              exit 1
            }

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$MAIN" || {
              echo "::error::email Admin absent."
              exit 1
            }

          echo ""
          echo "OK : adminChatInbox()"
          echo "OK : Firestore listener"
          echo "OK : tri des conversations"
          echo "OK : identification Admin"

      # =========================================================
      # VERIFICATION REGLES FIREBASE COMPATIBLES
      # =========================================================

      - name: Verify Firebase rules are compatible with V34 Chat
        shell: bash
        run: |
          set -euo pipefail

          RULES="$PROJECT_DIR/firestore.rules"

          echo "========================================="
          echo "       VERIFICATION REGLES FIREBASE"
          echo "========================================="

          test -f "$RULES" || {
            echo "::error::firestore.rules absent."
            exit 1
          }

          # -----------------------------------------------------
          # AUTHENTIFICATION
          # -----------------------------------------------------

          grep -Fq \
            'function isSignedIn()' \
            "$RULES" || {
              echo "::error::isSignedIn absent."
              exit 1
            }

          grep -Fq \
            'function isAdmin()' \
            "$RULES" || {
              echo "::error::isAdmin absent."
              exit 1
            }

          # -----------------------------------------------------
          # ADMIN
          # -----------------------------------------------------

          grep -Fq \
            'StxrZBDeUodj7YVPmXRA2AbWcUF2' \
            "$RULES" || {
              echo "::error::UID Admin absent."
              exit 1
            }

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$RULES" || {
              echo "::error::email Admin absent."
              exit 1
            }

          # -----------------------------------------------------
          # CONVERSATIONS
          # -----------------------------------------------------

          grep -Fq \
            'match /yb_chat_conversations/{conversationId}' \
            "$RULES" || {
              echo "::error::règle conversations absente."
              exit 1
            }

          # -----------------------------------------------------
          # CLIENT ANONYME :
          # LE NUMERO DOIT VENIR DU DOCUMENT,
          # PAS DE request.auth.token.phone_number
          # -----------------------------------------------------

          grep -Fq \
            'request.resource.data.phone is string' \
            "$RULES" || {
              echo "::error::validation phone document absente."
              exit 1
            }

          grep -Fq \
            'request.resource.data.phone.matches' \
            "$RULES" || {
              echo "::error::validation format phone absente."
              exit 1
            }

          # -----------------------------------------------------
          # MESSAGES
          # -----------------------------------------------------

          grep -Fq \
            'match /messages/{messageId}' \
            "$RULES" || {
              echo "::error::règle messages absente."
              exit 1
            }

          grep -Fq \
            'function parentConversation()' \
            "$RULES" || {
              echo "::error::parentConversation absent."
              exit 1
            }

          # -----------------------------------------------------
          # CLIENT MESSAGE
          # -----------------------------------------------------

          grep -Fq \
            'request.resource.data.senderUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::senderUid validation absente."
              exit 1
            }

          grep -Fq \
            'request.resource.data.senderRole == "client"' \
            "$RULES" || {
              echo "::error::senderRole client absent."
              exit 1
            }

          # -----------------------------------------------------
          # TOKENS NOTIFICATION
          # -----------------------------------------------------

          grep -Fq \
            'match /yb_notification_tokens/{tokenId}' \
            "$RULES" || {
              echo "::error::règle tokens notification absente."
              exit 1
            }

          echo ""
          echo "OK : authentification"
          echo "OK : Admin"
          echo "OK : conversations"
          echo "OK : numéro client dans document"
          echo "OK : messages"
          echo "OK : tokens notification"

          echo ""
          echo "========================================="
          echo "   REGLES FIREBASE COMPATIBLES V34"
          echo "========================================="

      # =========================================================
      # VERIFICATION FICHIERS FIREBASE
      # =========================================================

      - name: Verify Firebase project files
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"
          GOOGLE="$PROJECT_DIR/app/google-services.json"

          echo "========================================="
          echo "       VERIFICATION FICHIERS FIREBASE"
          echo "========================================="

          test -f "$GOOGLE" || {
            echo "::error::google-services.json absent."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java absent."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js absent."
            exit 1
          }

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {
              echo "::error::FirebaseMessagingService absent."
              exit 1
            }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {
              echo "::error::onMessageReceived absent."
              exit 1
            }

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {
              echo "::error::onDocumentCreated absent."
              exit 1
            }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {
              echo "::error::notifyClientWhenAdminReplies absent."
              exit 1
            }

          node --check "$FUNCTIONS"

          echo ""
          echo "OK : google-services.json"
          echo "OK : Firebase Messaging"
          echo "OK : Cloud Functions"
          echo "OK : syntax functions/index.js"

      # =========================================================
      # CONFIGURATION SIGNATURE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "       CONFIGURATION SIGNATURE V34"
          echo "========================================="

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 manquant."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD manquant."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEY_PASSWORD manquant."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "::error::Keystore vide."
            exit 1
          fi

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(
              keytool \
                -list \
                -v \
                -keystore release-keystore.jks \
                -storepass "$KEYSTORE_PASSWORD" \
                2>/dev/null \
                | sed -n 's/^[[:space:]]*Alias name: //p' \
                | head -n 1
            )"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::KEY_ALIAS introuvable."
            exit 1
          fi

          keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$ALIAS" \
            >/dev/null 2>&1 || {
              echo "::error::Alias '$ALIAS' introuvable."
              exit 1
            }

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          echo ""
          echo "OK : keystore"
          echo "OK : alias"
          echo "OK : variables de signature"

      # =========================================================
      # VERIFICATION GRADLE AVANT COMPILATION
      # =========================================================

      - name: Verify Gradle project before build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "       VERIFICATION PROJET GRADLE"
          echo "========================================="

          test -f settings.gradle || \
          test -f settings.gradle.kts || {
            echo "::error::settings.gradle introuvable."
            exit 1
          }

          test -f app/build.gradle || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Fq \
            'signingConfigs' \
            app/build.gradle || {
              echo "::error::signingConfigs absent de app/build.gradle."
              exit 1
            }

          grep -Fq \
            'ANDROID_KEYSTORE_PASSWORD' \
            app/build.gradle || {
              echo "::error::configuration signature absente."
              exit 1
            }

          echo ""
          echo "OK : projet Gradle"
          echo "OK : app/build.gradle"
          echo "OK : signingConfigs"
          echo "OK : variables de signature"

      # =========================================================
      # COMPILATION REELLE
      # =========================================================

      - name: Build release APK V34 CHAT FIXED
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "       COMPILATION REELLE APK V34"
          echo "========================================="

          gradle \
            --no-daemon \
            clean \
            :app:assembleRelease

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::La compilation est terminée mais aucun APK n'a été produit."
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "       APK V34 CHAT FIXED CREE"
          echo "========================================="

          ls -lh "$APK"

      # =========================================================
      # VERIFICATION SIGNATURE APK
      # =========================================================

      - name: Verify APK signature and identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "========================================="
          echo "       VERIFICATION APK V34"
          echo "========================================="

          test -s "$APK" || {
            echo "::error::APK introuvable."
            exit 1
          }

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" \
            | grep -q \
              "package: name='com.aistudio.youngestbiz.mbkz'" || {
                echo "::error::applicationId incorrect dans APK."
                exit 1
              }

          echo "$BADGING" \
            | grep -q \
              "versionCode='34'" || {
                echo "::error::versionCode 34 absent dans APK."
                exit 1
              }

          echo "$BADGING" \
            | grep -q \
              "versionName='1.27.0'" || {
                echo "::error::versionName 1.27.0 absent dans APK."
                exit 1
              }

          echo ""
          echo "OK : APK signe"
          echo "OK : applicationId"
          echo "OK : versionCode 34"
          echo "OK : versionName 1.27.0"

      # =========================================================
      # PREPARATION ARTIFACT
      # =========================================================

      - name: Prepare V34 CHAT FIXED artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          OUTPUT="$GITHUB_WORKSPACE/release-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          cp \
            "$APK" \
            "$OUTPUT/YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL.apk"

          sha256sum \
            "$OUTPUT/YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL.apk" \
            > "$OUTPUT/SHA256SUMS.txt"

          echo ""
          echo "========================================="
          echo "       ARTIFACT V34 PREPARE"
          echo "========================================="

          ls -lh "$OUTPUT"

      # =========================================================
      # UPLOAD ARTIFACT FINAL
      # =========================================================

      - name: Upload V34 CHAT FIXED APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # FIN
      # =========================================================

      - name: Final V34 Chat Fixed confirmation
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "   YOUNGEST'S BUSINESS V34 CHAT DELIVERY FINAL"
          echo "======================================================"
          echo ""
          echo "BUILD : SUCCESS"
          echo "CHAT : FIXED SOURCE VERIFIED"
          echo "FIREBASE RULES : VERIFIED"
          echo "SIGNATURE : VERIFIED"
          echo "APK : CREATED"
          echo "ARTIFACT : UPLOADED"
          echo ""
          echo "Fichier final :"
          echo "YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL.apk"
          echo ""
          echo "======================================================"
