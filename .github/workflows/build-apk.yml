name: Build YOUNGEST'S BUSINESS V35 Admin Cards Real Chat FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build and verify signed V35 ADMIN CARDS REAL CHAT APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE EXACTE DU ZIP V35
      #
      # IMPORTANT :
      # Le dépôt contient le projet V35 sous forme de ZIP.
      # Nous utilisons UNIQUEMENT le vrai ZIP V35.
      # Aucun ZIP V34/V33/V32 ne sera utilisé.
      # =========================================================

      - name: Find exact V35 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          ZIP_NAME="YOUNGEST-BUSINESS-V35-ADMIN-CARDS-CHAT-FINAL-source.zip"

          echo "=============================================="
          echo "       RECHERCHE DU VRAI SOURCE V35"
          echo "=============================================="

          ZIP_PATH="$(
            find "$ROOT" \
              -type f \
              -name "$ZIP_NAME" \
              -print \
              -quit
          )"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Le ZIP V35 exact est introuvable."
            echo ""
            echo "ZIP V35 attendu :"
            echo "$ZIP_NAME"
            echo ""
            echo "ZIP disponibles dans le dépôt :"

            find "$ROOT" \
              -type f \
              -iname "*.zip" \
              -print | sort || true

            exit 1
          fi

          echo ""
          echo "ZIP V35 EXACT TROUVE :"
          echo "$ZIP_PATH"

          echo ""
          echo "=============================================="
          echo "       TEST DE L'ARCHIVE V35"
          echo "=============================================="

          unzip -t "$ZIP_PATH"

          echo ""
          echo "Archive V35 valide."

          # =====================================================
          # EXTRACTION
          # =====================================================

          DEST="$RUNNER_TEMP/v35-source"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction du vrai source V35..."

          unzip -q "$ZIP_PATH" -d "$DEST"

          echo "Extraction terminée."

          # =====================================================
          # RECHERCHE DU VRAI PROJET ANDROID
          # =====================================================

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle introuvable dans le ZIP V35."

            echo ""
            echo "Structure extraite :"

            find "$DEST" \
              -maxdepth 5 \
              -type f \
              -print | sort | head -300

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "       VRAI PROJET ANDROID V35"
          echo "=============================================="

          echo "$PROJECT_DIR"

      # =========================================================
      # IDENTITE EXACTE V35
      # =========================================================

      - name: Verify exact V35 identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          echo "=============================================="
          echo "          IDENTITE EXACTE V35"
          echo "=============================================="

          test -f "$GRADLE_FILE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Eq \
            'versionCode[[:space:]]+35([[:space:]]|$)' \
            "$GRADLE_FILE" || {
              echo "::error::Ce source n'est PAS V35 : versionCode 35 absent."
              exit 1
          }

          grep -Fq \
            "versionName '1.28.0'" \
            "$GRADLE_FILE" || {
              echo "::error::versionName 1.28.0 absent."
              exit 1
          }

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE_FILE" || {
              echo "::error::applicationId incorrect."
              exit 1
          }

          grep -Fq \
            "namespace 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE_FILE" || {
              echo "::error::namespace incorrect."
              exit 1
          }

          echo ""
          echo "versionCode 35 : OK"
          echo "versionName 1.28.0 : OK"
          echo "applicationId : OK"
          echo "namespace : OK"

      # =========================================================
      # VERIFICATION FICHIERS PROJET
      # =========================================================

      - name: Verify V35 project files
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"

          RULES="$PROJECT_DIR/firestore.rules"

          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          GOOGLE="$PROJECT_DIR/app/google-services.json"

          echo "=============================================="
          echo "          FICHIERS PROJET V35"
          echo "=============================================="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java introuvable."
            exit 1
          }

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js introuvable."
            exit 1
          }

          test -f "$GOOGLE" || {
            echo "::error::google-services.json introuvable."
            exit 1
          }

          echo "MainActivity.java : OK"
          echo "AppNotificationService.java : OK"
          echo "firestore.rules : OK"
          echo "functions/index.js : OK"
          echo "google-services.json : OK"

      # =========================================================
      # PROTECTION DE L'INTERFACE ADMIN
      #
      # ON NE RECONSTRUIT PAS UNE NOUVELLE INTERFACE.
      # ON VERIFIE CELLE QUI EXISTE DEJA DANS LE SOURCE V35.
      # =========================================================

      - name: Verify existing Admin Cards interface
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "=============================================="
          echo "        PROTECTION INTERFACE ADMIN"
          echo "=============================================="

          grep -Fq \
            'TABLEAU DE BORD' \
            "$MAIN" || {
              echo "::error::Carte TABLEAU DE BORD absente."
              exit 1
          }

          grep -Fq \
            'GESTION DES CLIENTS' \
            "$MAIN" || {
              echo "::error::Carte GESTION DES CLIENTS absente."
              exit 1
          }

          grep -Fq \
            'GESTION DES PRÊTS' \
            "$MAIN" || {
              echo "::error::Carte GESTION DES PRÊTS absente."
              exit 1
          }

          grep -Fq \
            'REMBOURSEMENTS' \
            "$MAIN" || {
              echo "::error::Carte REMBOURSEMENTS absente."
              exit 1
          }

          grep -Fq \
            'DEMANDES DE PRÊTS CLIENTS' \
            "$MAIN" || {
              echo "::error::Carte DEMANDES DE PRÊTS CLIENTS absente."
              exit 1
          }

          grep -Fq \
            'CONTACTEZ-NOUS' \
            "$MAIN" || {
              echo "::error::Carte CONTACTEZ-NOUS absente."
              exit 1
          }

          echo ""
          echo "TABLEAU DE BORD : OK"
          echo "GESTION DES CLIENTS : OK"
          echo "GESTION DES PRÊTS : OK"
          echo "REMBOURSEMENTS : OK"
          echo "DEMANDES DE PRÊTS CLIENTS : OK"
          echo "CONTACTEZ-NOUS : OK"

          echo ""
          echo "INTERFACE ADMIN EXISTANTE PRESERVEE."

      # =========================================================
      # VERIFICATION DU CHEMIN REEL DU CHAT CLIENT
      # =========================================================

      - name: Verify real client Chat delivery path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "=============================================="
          echo "          VRAI CHEMIN CHAT CLIENT"
          echo "=============================================="

          # Bouton ENVOYER / sauvegarde du message
          grep -Fq \
            'persistPendingChatDraft' \
            "$MAIN" || {
              echo "::error::persistPendingChatDraft absent."
              exit 1
          }

          # Ouverture du Chat
          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {
              echo "::error::openChatEntry() absent."
              exit 1
          }

          # Demande du numéro
          grep -Fq \
            'requestChatPhoneNumber()' \
            "$MAIN" || {
              echo "::error::requestChatPhoneNumber() absent."
              exit 1
          }

          # Firebase Anonymous
          grep -Fq \
            'signInAnonymously' \
            "$MAIN" || {
              echo "::error::signInAnonymously absent."
              exit 1
          }

          # Numéro sauvegardé
          grep -Fq \
            'KEY_PENDING_CHAT_PHONE' \
            "$MAIN" || {
              echo "::error::KEY_PENDING_CHAT_PHONE absent."
              exit 1
          }

          # Recherche/création conversation
          grep -Fq \
            'openOrCreateClientConversation()' \
            "$MAIN" || {
              echo "::error::openOrCreateClientConversation absent."
              exit 1
          }

          # Recherche ownerUid
          grep -Fq \
            'whereEqualTo("ownerUid"' \
            "$MAIN" || {
              echo "::error::Recherche ownerUid absente."
              exit 1
          }

          # Création conversation
          grep -Fq \
            'createConversationAndSendDraft' \
            "$MAIN" || {
              echo "::error::createConversationAndSendDraft absent."
              exit 1
          }

          # Création parent AVANT message
          grep -Fq \
            'conversation.set(c)' \
            "$MAIN" || {
              echo "::error::conversation.set(c) absent."
              exit 1
          }

          # Création message
          grep -Fq \
            'message.set(msg)' \
            "$MAIN" || {
              echo "::error::message.set(msg) absent."
              exit 1
          }

          echo ""
          echo "persistPendingChatDraft : OK"
          echo "openChatEntry : OK"
          echo "Firebase Anonymous : OK"
          echo "requestChatPhoneNumber : OK"
          echo "KEY_PENDING_CHAT_PHONE : OK"
          echo "openOrCreateClientConversation : OK"
          echo "whereEqualTo(ownerUid) : OK"
          echo "createConversationAndSendDraft : OK"
          echo "conversation.set(c) : OK"
          echo "message.set(msg) : OK"

          echo ""
          echo "CHEMIN CHAT CLIENT : VALIDE"

      # =========================================================
      # VERIFICATION CHAT ADMIN
      # =========================================================

      - name: Verify Chat administration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "=============================================="
          echo "             CHAT ADMIN"
          echo "=============================================="

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {
              echo "::error::adminChatInbox() absent."
              exit 1
          }

          grep -Fq \
            'FIREBASE_ADMIN_EMAIL.equalsIgnoreCase' \
            "$MAIN" || {
              echo "::error::Identification Admin absente."
              exit 1
          }

          grep -Fq \
            'yb_chat_conversations' \
            "$MAIN" || {
              echo "::error::Collection Chat absente."
              exit 1
          }

          grep -Fq \
            'Collections.sort(docs' \
            "$MAIN" || {
              echo "::error::Tri conversations absent."
              exit 1
          }

          echo "adminChatInbox : OK"
          echo "Identification Admin : OK"
          echo "yb_chat_conversations : OK"
          echo "Tri conversations : OK"

      # =========================================================
      # VERIFICATION REGLES FIREBASE
      # =========================================================

      - name: Verify Firebase rules for V35 Chat
        shell: bash
        run: |
          set -euo pipefail

          RULES="$PROJECT_DIR/firestore.rules"

          echo "=============================================="
          echo "          REGLES FIREBASE CHAT"
          echo "=============================================="

          grep -Fq \
            'function isSignedIn()' \
            "$RULES" || {
              echo "::error::isSignedIn() absente."
              exit 1
          }

          grep -Fq \
            'function isAdmin()' \
            "$RULES" || {
              echo "::error::isAdmin() absente."
              exit 1
          }

          grep -Fq \
            'StxrZBDeUodj7YVPmXRA2AbWcUF2' \
            "$RULES" || {
              echo "::error::UID Admin absent."
              exit 1
          }

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$RULES" || {
              echo "::error::Email Admin absent."
              exit 1
          }

          grep -Fq \
            'match /yb_chat_conversations/' \
            "$RULES" || {
              echo "::error::yb_chat_conversations absente."
              exit 1
          }

          grep -Fq \
            'request.resource.data.ownerUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::ownerUid absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.phone is string' \
            "$RULES" || {
              echo "::error::phone absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.status == "OPEN"' \
            "$RULES" || {
              echo "::error::status OPEN absent."
              exit 1
          }

          grep -Fq \
            'match /messages/{messageId}' \
            "$RULES" || {
              echo "::error::messages absente."
              exit 1
          }

          grep -Fq \
            'function parentConversation()' \
            "$RULES" || {
              echo "::error::parentConversation() absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::senderUid absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderRole == "client"' \
            "$RULES" || {
              echo "::error::senderRole client absent."
              exit 1
          }

          grep -Fq \
            'request.resource.data.senderRole == "admin"' \
            "$RULES" || {
              echo "::error::senderRole admin absent."
              exit 1
          }

          echo ""
          echo "isSignedIn : OK"
          echo "isAdmin : OK"
          echo "Admin UID : OK"
          echo "Admin email : OK"
          echo "Conversations : OK"
          echo "Messages : OK"
          echo "senderUid : OK"
          echo "senderRole client : OK"
          echo "senderRole admin : OK"

      # =========================================================
      # NOTIFICATIONS
      # =========================================================

      - name: Verify Firebase notifications
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"

          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "=============================================="
          echo "            NOTIFICATIONS FIREBASE"
          echo "=============================================="

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {
              echo "::error::FirebaseMessagingService absent."
              exit 1
          }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {
              echo "::error::onMessageReceived absent."
              exit 1
          }

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {
              echo "::error::onDocumentCreated absent."
              exit 1
          }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {
              echo "::error::notifyClientWhenAdminReplies absent."
              exit 1
          }

          node --check "$FUNCTIONS"

          echo ""
          echo "FirebaseMessagingService : OK"
          echo "onMessageReceived : OK"
          echo "onDocumentCreated : OK"
          echo "notifyClientWhenAdminReplies : OK"
          echo "Cloud Functions syntax : OK"

      # =========================================================
      # CONFIGURATION SIGNATURE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "          SIGNATURE APK V35"
          echo "=============================================="

          if [ -z "${KEYSTORE_BASE64:-}" ] || \
             [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Secrets de signature manquants."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > release-keystore.jks

          test -s release-keystore.jks || {
            echo "::error::Keystore vide."
            exit 1
          }

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(
              keytool \
                -list \
                -v \
                -keystore release-keystore.jks \
                -storepass "$KEYSTORE_PASSWORD" \
                2>/dev/null \
                | sed -n 's/^Alias name: //p' \
                | head -n 1
            )"
          fi

          if [ -z "$ALIAS" ]; then
            echo "::error::KEY_ALIAS introuvable."
            exit 1
          fi

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          echo "Signature configurée : OK"

      # =========================================================
      # VERIFICATION GRADLE
      # =========================================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "         VERIFICATION PROJET GRADLE"
          echo "=============================================="

          gradle \
            --no-daemon \
            tasks \
            --all \
            >/dev/null

          echo "Projet Gradle : OK"

      # =========================================================
      # BUILD APK V35
      # =========================================================

      - name: Build release APK V35
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "             BUILD APK V35"
          echo "=============================================="

          gradle \
            --no-daemon \
            clean \
            :app:assembleRelease

          echo ""
          echo "APK V35 compilé avec succès."

      # =========================================================
      # VERIFICATION REELLE DU CONTENU APK
      # =========================================================

      - name: Verify real V35 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo "          VERIFICATION REELLE APK"
          echo "=============================================="

          test -s "$APK" || {
            echo "::error::APK release introuvable."
            exit 1
          }

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" \
            | grep -q \
              "package: name='com.aistudio.youngestbiz.mbkz'" || {
                echo "::error::applicationId incorrect dans APK."
                exit 1
          }

          echo "$BADGING" \
            | grep -q \
              "versionCode='35'" || {
                echo "::error::APK PRODUIT N'EST PAS V35."
                exit 1
          }

          echo "$BADGING" \
            | grep -q \
              "versionName='1.28.0'" || {
                echo "::error::versionName APK incorrect."
                exit 1
          }

          echo ""
          echo "applicationId : OK"
          echo "versionCode 35 : OK"
          echo "versionName 1.28.0 : OK"
          echo "Signature APK : OK"

      # =========================================================
      # PREPARATION ARTIFACT
      # =========================================================

      - name: Prepare final V35 artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V35-ADMIN-CARDS-REAL-CHAT-FIXED.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V35-ADMIN-CARDS-REAL-CHAT-FIXED.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          echo ""
          echo "Artifact V35 préparé."

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================

      - name: Upload final V35 artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V35-ADMIN-CARDS-REAL-CHAT-FIXED
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # CONFIRMATION FINALE
      # =========================================================

      - name: Final V35 confirmation
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "       YOUNGEST'S BUSINESS V35"
          echo "=================================================="
          echo ""
          echo "SOURCE : V35-ADMIN-CARDS-CHAT-FINAL-source.zip"
          echo ""
          echo "VERSION CODE : 35"
          echo "VERSION NAME : 1.28.0"
          echo ""
          echo "INTERFACE ADMIN : PRESERVEE"
          echo "CHAT CLIENT : VERIFIE"
          echo "CHAT ADMIN : VERIFIE"
          echo "FIREBASE RULES : VERIFIEES"
          echo "NOTIFICATIONS : VERIFIEES"
          echo "APK : SIGNE"
          echo ""
          echo "ARTIFACT FINAL :"
          echo "YOUNGEST-BUSINESS-V35-ADMIN-CARDS-REAL-CHAT-FIXED"
          echo ""
          echo "=================================================="
          echo "             V35 BUILD COMPLETE"
          echo "=================================================="
