name: Deploy YOUNGEST'S BUSINESS V39 PC Admin + Journal Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy V39 PC Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find exact V39 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          ZIP_NAME="YOUNGEST-BUSINESS-V39-PC-ADMIN-JOURNAL-ENVOIS-source.zip"
          ZIP_PATH="$(find "$ROOT" -type f -name "$ZIP_NAME" -print -quit)"
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Le ZIP source V39 exact est introuvable. Ajoutez le ZIP corrigé avec le nom attendu : $ZIP_NAME"
            find "$ROOT" -type f -iname '*.zip' -print | sort || true
            exit 1
          fi
          echo "ZIP V39 trouvé : $ZIP_PATH"
          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/v39-source"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"
          FIREBASE_JSON="$(find "$DEST" -type f -name firebase.json -print -quit)"
          if [ -z "$FIREBASE_JSON" ]; then
            echo "::error::firebase.json introuvable dans V39."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$FIREBASE_JSON")"
          if [ ! -d "$PROJECT_DIR/web-admin" ]; then
            echo "::error::Le dossier web-admin est absent de V39."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR : $PROJECT_DIR"

      - name: Verify Firebase project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/.firebaserc" || { echo "::error::.firebaserc absent."; exit 1; }
          test -f "$PROJECT_DIR/firebase.json" || { echo "::error::firebase.json absent."; exit 1; }
          grep -Fq '"youngestsbusiness"' "$PROJECT_DIR/.firebaserc" || { echo "::error::Projet Firebase youngestsbusiness non configuré."; exit 1; }
          grep -Fq '"public": "web-admin"' "$PROJECT_DIR/firebase.json" || { echo "::error::Firebase Hosting n'utilise pas web-admin comme dossier public."; exit 1; }
          grep -Fq '"rules": "firestore.rules"' "$PROJECT_DIR/firebase.json" || { echo "::error::firebase.json ne référence pas firestore.rules."; exit 1; }
          echo "PROJET FIREBASE ET HOSTING : OK"

      - name: Verify V39 PC Admin files and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          WEB="$PROJECT_DIR/web-admin"
          for file in "$WEB/index.html" "$WEB/app.js" "$WEB/styles.css"; do
            test -s "$file" || { echo "::error::Fichier Web Admin manquant : $file"; exit 1; }
          done
          node --check "$WEB/app.js"
          echo "FICHIERS WEB ADMIN ET SYNTAXE JS : OK"

      - name: Verify Firebase Admin authentication
        shell: bash
        run: |
          set -euo pipefail
          APP="$PROJECT_DIR/web-admin/app.js"
          grep -Fq "signInWithEmailAndPassword" "$APP" || { echo "::error::Connexion Firebase Email/Mot de passe absente."; exit 1; }
          grep -Fq "elishayoungest19@gmail.com" "$APP" || { echo "::error::Compte administrateur attendu absent."; exit 1; }
          grep -Fq "youngestsbusiness" "$APP" || { echo "::error::Projet Firebase youngestsbusiness absent de l'application Web."; exit 1; }
          echo "AUTHENTIFICATION ADMIN : OK"

      - name: Verify V39 administration sections
        shell: bash
        run: |
          set -euo pipefail
          HTML="$PROJECT_DIR/web-admin/index.html"
          for check in \
            "Tableau de bord" \
            "Clients" \
            "Demandes de prêts" \
            "Prêts" \
            "Remboursements" \
            "Rapports mensuels des prêts" \
            "Journal LUMICASH" \
            "Journal des envois" \
            "Chat clients"
          do
            grep -Fq "$check" "$HTML" || { echo "::error::Section Admin absente : $check"; exit 1; }
          done
          echo "SECTIONS ADMIN PC : OK"

      - name: Verify Journal des envois
        shell: bash
        run: |
          set -euo pipefail
          APP="$PROJECT_DIR/web-admin/app.js"
          for check in "yb_mobile_money_journal" "Journal des envois" "beneficiaryPhone" "currency" "fees" "Rapports mensuels des prêts"; do
            grep -Fq "$check" "$APP" || { echo "::error::Élément du Journal des envois / rapports absent : $check"; exit 1; }
          done
          test -s "$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java" || { echo "::error::MainActivity.java absent."; exit 1; }
          grep -Fq 'MOBILE_MONEY_JOURNAL_COLLECTION' "$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java" || { echo "::error::Synchronisation Android vers Firebase absente."; exit 1; }
          echo "JOURNAL DES ENVOIS ET SYNCHRONISATION ANDROID : OK"

      - name: Verify Firebase collections
        shell: bash
        run: |
          set -euo pipefail
          APP="$PROJECT_DIR/web-admin/app.js"
          for collection in \
            "yb_clients" \
            "yb_loans" \
            "yb_payments" \
            "yb_loan_requests" \
            "yb_lumicash_journal" \
            "yb_mobile_money_journal" \
            "yb_chat_conversations"
          do
            grep -Fq "$collection" "$APP" || { echo "::error::Collection Firebase absente du Web Admin : $collection"; exit 1; }
          done
          echo "COLLECTIONS FIREBASE : OK"

      - name: Prepare YOUNGEST'S BUSINESS logo
        shell: bash
        run: |
          set -euo pipefail
          WEB="$PROJECT_DIR/web-admin"
          LOGO="$PROJECT_DIR/app/src/main/res/drawable/logo_youngests_business.png"
          if [ ! -s "$LOGO" ]; then echo "::error::Logo Android introuvable."; exit 1; fi
          cp "$LOGO" "$WEB/logo_youngests_business.png"
          sed -i 's#../app/src/main/res/drawable/logo_youngests_business.png#logo_youngests_business.png#g' "$WEB/index.html"
          grep -Fq "logo_youngests_business.png" "$WEB/index.html" || { echo "::error::Le logo n'est pas correctement référencé."; exit 1; }
          echo "LOGO PC ADMIN : OK"

      - name: Verify Firestore rules including Journal des envois
        shell: bash
        run: |
          set -euo pipefail
          RULES="$PROJECT_DIR/firestore.rules"
          test -s "$RULES" || { echo "::error::firestore.rules absent ou vide."; exit 1; }
          for check in \
            "function isAdmin()" \
            "StxrZBDeUodj7YVPmXRA2AbWcUF2" \
            "elishayoungest19@gmail.com" \
            "match /yb_lumicash_journal/" \
            "match /yb_mobile_money_journal/"
          do
            grep -Fq "$check" "$RULES" || { echo "::error::Élément Firestore absent : $check"; exit 1; }
          done
          echo "RÈGLES FIRESTORE ADMIN ET JOURNAL DES ENVOIS : OK"

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools
          firebase --version

      - name: Verify Firebase deployment credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Le secret Firebase est manquant. Nom attendu : FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          test -s "$RUNNER_TEMP/firebase-service-account.json" || { echo "::error::Le fichier du compte de service Firebase est vide."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          echo "CREDENTIALS FIREBASE : PRESENTES"

      - name: Authenticate with Firebase
        shell: bash
        run: |
          set -euo pipefail
          firebase projects:list --json > "$RUNNER_TEMP/firebase-projects.json"
          if ! grep -Eq '"projectId"[[:space:]]*:[[:space:]]*"youngestsbusiness"' "$RUNNER_TEMP/firebase-projects.json"; then
            echo "::error::Le projet youngestsbusiness n'est pas accessible au compte de service configuré."
            exit 1
          fi
          echo "ACCÈS FIREBASE : OK"

      - name: Final V39 Web Admin check
        shell: bash
        run: |
          set -euo pipefail
          WEB="$PROJECT_DIR/web-admin"
          test -s "$WEB/index.html"
          test -s "$WEB/app.js"
          test -s "$WEB/styles.css"
          test -s "$WEB/logo_youngests_business.png"
          echo "YOUNGEST'S BUSINESS V39 PC ADMIN : FICHIERS OK"

      - name: Deploy V39 PC Admin and Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          firebase deploy \
            --only hosting,firestore:rules \
            --project youngestsbusiness \
            --non-interactive

      - name: Show V39 PC Admin URL
        shell: bash
        run: |
          echo ""
          echo "YOUNGEST'S BUSINESS V39 PC ADMIN DÉPLOYÉ"
          echo "URL : https://youngestsbusiness.web.app"
          echo "URL alternative : https://youngestsbusiness.firebaseapp.com"
          
