name: Build Android APK V19 Layout Maquette

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V19 Layout Maquette
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver automatiquement le ZIP V19
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "===== RECHERCHE DU ZIP V19 ====="

          ZIP=$(find . -maxdepth 3 -type f \
            -name 'YOUNGEST-BUSINESS-V19-*.zip' \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP V19 trouvé."
            echo "===== ZIP DISPONIBLES ====="
            find . -maxdepth 3 -type f -name '*.zip' | sort
            exit 1
          fi

          echo "ZIP V19 trouvé : $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraire le projet V19
        shell: bash
        run: |
          set -e

          rm -rf v19-extracted
          mkdir -p v19-extracted

          unzip -o "${{ steps.find_zip.outputs.zip }}" \
            -d v19-extracted

          echo "Projet V19 extrait."

      - name: Détecter le projet Android V19
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find v19-extracted \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android V19 introuvable."
            exit 1
          fi

          echo "Projet Android V19 : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Vérifier le projet V19
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "====================================="
          echo "       VERIFICATION DU PROJET V19"
          echo "====================================="

          if [ ! -f "app/build.gradle" ]; then
            echo "ERREUR : app/build.gradle introuvable."
            exit 1
          fi

          MAIN="app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          if [ ! -f "$MAIN" ]; then
            echo "ERREUR : MainActivity.java introuvable."
            exit 1
          fi

          echo "===== APPLICATION ====="
          grep -E "applicationId|versionCode|versionName" app/build.gradle || true

          echo "===== ELEMENTS V19 ====="

          grep -qi "YOUNGEST" "$MAIN"
          grep -qi "CONTACT" "$MAIN" || true
          grep -qi "PROPOS" "$MAIN" || true

          echo "Projet V19 vérifié."

      - name: Vérifier la disposition V19
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "===== CONTROLE LAYOUT V19 ====="

          echo "Recherche des éléments principaux..."

          grep -q "ESPACE BUREAU" "$MAIN" || true
          grep -q "ESPACE CLIENT" "$MAIN" || true
          grep -qi "CONTACTEZ" "$MAIN" || true
          grep -qi "PROPOS DE NOUS" "$MAIN" || true

          echo "Contrôle du layout V19 terminé."

      - name: Configurer Firebase
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "app/google-services.json" ]; then
            echo "Firebase déjà configuré."

          elif [ -f "google-services.json" ]; then
            cp google-services.json app/google-services.json
            echo "Firebase copié vers app/."

          else
            SOURCE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'google-services.json' \
              | head -n 1)

            if [ -n "$SOURCE" ]; then
              cp "$SOURCE" app/google-services.json
              echo "Firebase configuré depuis : $SOURCE"
            else
              echo "AVERTISSEMENT : google-services.json introuvable."
            fi
          fi

      - name: Préparer le keystore Release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : KEYSTORE_BASE64 absent."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : KEYSTORE_PASSWORD absent."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERREUR : KEY_PASSWORD absent."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERREUR : keystore vide."
            exit 1
          fi

          ALIAS=$(keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -v 2>/dev/null \
            | awk -F': ' '/Alias name:/ {print $2; exit}')

          if [ -z "$ALIAS" ]; then
            echo "ERREUR : alias du keystore introuvable."
            exit 1
          fi

          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Keystore Release préparé."
          echo "Alias Release détecté."

      - name: Vérifier la configuration de signature V19
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== SIGNATURE V19 ====="

          grep -A12 -B2 "signingConfigs" app/build.gradle || true

          echo "Configuration de signature vérifiée."

      - name: Nettoyer le projet V19
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --no-daemon

      - name: Compiler APK V19 Release
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "====================================="
          echo "       COMPILATION V19 RELEASE"
          echo "====================================="

          gradle :app:assembleRelease --no-daemon

      - name: Vérifier APK V19 et sa signature
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK V19 introuvable."
            exit 1
          fi

          echo "APK V19 généré : $APK"

          echo "===== VERIFICATION SIGNATURE APK ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK V19 Release signé et valide."

          echo "===== EMPREINTE DU CERTIFICAT ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --print-certs \
            "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Préparer APK V19 final
        shell: bash
        run: |
          set -e

          rm -rf release-apk
          mkdir -p release-apk

          cp "$APK_PATH" \
            "release-apk/YOUNGEST-BUSINESS-V19-LAYOUT-MAQUETTE-RELEASE.apk"

          echo "===== APK V19 FINAL ====="
          ls -lh release-apk/

      - name: Publier APK V19 Release
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V19-LAYOUT-MAQUETTE-RELEASE
          path: release-apk/YOUNGEST-BUSINESS-V19-LAYOUT-MAQUETTE-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
