name: Build YOUNGEST'S BUSINESS V34 Chat Delivery Final FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed V34 CHAT FIXED APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # RECHERCHE DU VRAI SOURCE V34 FIXED
      # =========================================================

      - name: Find and extract V34 CHAT FIXED source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ZIP_NAME="YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-source-FIXED.zip"
          ZIP_PATH="$ROOT/$ZIP_NAME"
          DEST="$RUNNER_TEMP/v34-chat-fixed"

          echo "========================================="
          echo " RECHERCHE DU VRAI SOURCE V34 CHAT FIXED"
          echo "========================================="

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP source V34 FIXED introuvable : $ZIP_NAME"

            echo ""
            echo "ZIP présents dans le repository :"

            find "$ROOT" \
              -maxdepth 6 \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo "ZIP trouvé : $ZIP_PATH"

          echo ""
          echo "Vérification de l'archive..."

          unzip -t "$ZIP_PATH"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo ""
          echo "Extraction..."

          unzip -q "$ZIP_PATH" -d "$DEST"

          SETTINGS="$(
            find "$DEST" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Aucun settings.gradle/settings.gradle.kts trouvé."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Projet Android :"
          echo "$PROJECT_DIR"

      # =========================================================
      # VERIFICATION IDENTITE V34
      # =========================================================

      - name: Verify exact V34 identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="$PROJECT_DIR/app/build.gradle"

          echo "========================================="
          echo "       VERIFICATION IDENTITE V34"
          echo "========================================="

          test -f "$GRADLE" || {
            echo "::error::app/build.gradle introuvable."
            exit 1
          }

          grep -Eq \
            'versionCode[[:space:]]+34([[:space:]]|$)' \
            "$GRADLE" || {
              echo "::error::versionCode 34 introuvable."
              exit 1
            }

          grep -Fq \
            "versionName '1.27.0'" \
            "$GRADLE" || {
              echo "::error::versionName 1.27.0 introuvable."
              exit 1
            }

          grep -Fq \
            "applicationId 'com.aistudio.youngestbiz.mbkz'" \
            "$GRADLE" || {
              echo "::error::applicationId incorrect."
              exit 1
            }

          echo "OK : versionCode 34"
          echo "OK : versionName 1.27.0"
          echo "OK : applicationId"

      # =========================================================
      # VERIFICATION DU VRAI PARCOURS CLIENT CHAT
      # =========================================================

      - name: Verify real client Chat delivery path
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "   VERIFICATION PARCOURS CLIENT CHAT"
          echo "========================================="

          test -f "$MAIN" || {
            echo "::error::MainActivity.java introuvable."
            exit 1
          }

          # Bouton ENVOYER -> draft
          grep -Fq \
            'persistPendingChatDraft' \
            "$MAIN" || {
              echo "::error::persistPendingChatDraft() absent."
              exit 1
            }

          # Entrée Chat
          grep -Fq \
            'openChatEntry()' \
            "$MAIN" || {
              echo "::error::openChatEntry() absent."
              exit 1
            }

          # Session Firebase Anonymous
          grep -Fq \
            'signInAnonymously' \
            "$MAIN" || {
              echo "::error::signInAnonymously absent."
              exit 1
            }

          # Numéro client conservé localement
          grep -Fq \
            'KEY_PENDING_CHAT_PHONE' \
            "$MAIN" || {
              echo "::error::KEY_PENDING_CHAT_PHONE absent."
              exit 1
            }

          # Ouverture/création de conversation
          grep -Fq \
            'openOrCreateClientConversation' \
            "$MAIN" || {
              echo "::error::openOrCreateClientConversation() absent."
              exit 1
            }

          # Recherche de la conversation du client
          grep -Fq \
            'whereEqualTo("ownerUid"' \
            "$MAIN" || {
              echo "::error::Recherche whereEqualTo(ownerUid) absente."
              exit 1
            }

          # Création conversation AVANT le premier message
          grep -Fq \
            'conversation.set(c)' \
            "$MAIN" || {
              echo "::error::conversation.set(c) absent."
              exit 1
            }

          # Premier message APRÈS création conversation
          grep -Fq \
            'message.set(msg)' \
            "$MAIN" || {
              echo "::error::message.set(msg) absent."
              exit 1
            }

          # Marqueur de la correction source
          grep -Fq \
            'V34 FIX CRITIQUE' \
            "$MAIN" || {
              echo "::error::Marqueur V34 FIX CRITIQUE absent."
              exit 1
            }

          echo ""
          echo "OK : ENVOYER -> persistPendingChatDraft()"
          echo "OK : openChatEntry()"
          echo "OK : Firebase Anonymous User"
          echo "OK : requestChatPhoneNumber / numéro client"
          echo "OK : openOrCreateClientConversation()"
          echo "OK : whereEqualTo(ownerUid)"
          echo "OK : conversation.set(c)"
          echo "OK : message.set(msg)"
          echo ""
          echo "PARCOURS CLIENT CHAT : PASSED"

      # =========================================================
      # VERIFICATION ADMIN CHAT
      # =========================================================

      - name: Verify Chat administration
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          echo "========================================="
          echo "       VERIFICATION CHAT ADMIN"
          echo "========================================="

          grep -Fq \
            'adminChatInbox()' \
            "$MAIN" || {
              echo "::error::adminChatInbox() absent."
              exit 1
            }

          grep -Fq \
            'addSnapshotListener' \
            "$MAIN" || {
              echo "::error::addSnapshotListener absent."
              exit 1
            }

          grep -Fq \
            'Collections.sort(docs' \
            "$MAIN" || {
              echo "::error::Tri des conversations Admin absent."
              exit 1
            }

          grep -Fq \
            'FIREBASE_ADMIN_EMAIL.equalsIgnoreCase' \
            "$MAIN" || {
              echo "::error::Contrôle Admin par email absent."
              exit 1
            }

          grep -Fq \
            'elishayoungest19@gmail.com' \
            "$MAIN" || {
              echo "::error::Email Admin absent."
              exit 1
            }

          echo "OK : adminChatInbox()"
          echo "OK : listener Firestore"
          echo "OK : tri des conversations"
          echo "OK : identité Admin"

      # =========================================================
      # VERIFICATION FIRESTORE RULES COMPATIBLES AVEC V34 CHAT
      #
      # IMPORTANT :
      # Le Chat client V34 utilise Anonymous Auth.
      # Le numéro est stocké dans conversation.phone.
      # On ne doit donc PAS exiger request.auth.token.phone_number.
      # =========================================================

      - name: Verify Firebase rules are compatible with V34 Chat
        shell: bash
        run: |
          set -euo pipefail

          RULES="$PROJECT_DIR/firestore.rules"

          echo "========================================="
          echo " VERIFICATION REGLES FIREBASE CHAT V34"
          echo "========================================="

          test -f "$RULES" || {
            echo "::error::firestore.rules introuvable."
            exit 1
          }

          # Authentification générale
          grep -Fq \
            'function isSignedIn()' \
            "$RULES" || {
              echo "::error::function isSignedIn() absente."
              exit 1
            }

          # Admin : UID ou email
          grep -Fq \
            'request.auth.uid == "StxrZBDeUodj7YVPmXRA2AbWcUF2"' \
            "$RULES" || {
              echo "::error::UID Admin absent des règles."
              exit 1
            }

          grep -Fq \
            'request.auth.token.email == "elishayoungest19@gmail.com"' \
            "$RULES" || {
              echo "::error::Email Admin absent des règles."
              exit 1
            }

          # Collection Chat
          grep -Eq \
            'match[[:space:]]+/yb_chat_conversations/\{conversationId\}' \
            "$RULES" || {
              echo "::error::match yb_chat_conversations absent."
              exit 1
            }

          # Création conversation client
          grep -Fq \
            'request.resource.data.ownerUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::ownerUid client absent de la règle Chat."
              exit 1
            }

          grep -Fq \
            'request.resource.data.phone is string' \
            "$RULES" || {
              echo "::error::phone string absent de la règle Chat."
              exit 1
            }

          grep -Fq \
            'request.resource.data.status == "OPEN"' \
            "$RULES" || {
              echo "::error::status OPEN absent de la règle Chat."
              exit 1
            }

          # Messages
          grep -Eq \
            'match[[:space:]]+/messages/\{messageId\}' \
            "$RULES" || {
              echo "::error::match /messages/{messageId} absent."
              exit 1
            }

          grep -Fq \
            'request.resource.data.senderUid == request.auth.uid' \
            "$RULES" || {
              echo "::error::senderUid absent de la règle messages."
              exit 1
            }

          grep -Fq \
            'request.resource.data.senderRole == "client"' \
            "$RULES" || {
              echo "::error::senderRole client absent."
              exit 1
            }

          # Notification tokens :
          # NON BLOQUANT pour client -> Admin.
          if grep -Eq \
            'match[[:space:]]+/yb_notification_tokens/\{tokenId\}' \
            "$RULES"; then

            echo "OK : yb_notification_tokens présent."

          else

            echo "INFO : yb_notification_tokens non trouvé."
            echo "      Cela ne bloque PAS la livraison client -> Admin."

          fi

          echo ""
          echo "IMPORTANT :"
          echo "V34 Chat client utilise Firebase Anonymous Auth."
          echo "La règle Chat ne dépend PAS de request.auth.token.phone_number."
          echo "Le numéro client doit être lu depuis request.resource.data.phone."
          echo ""
          echo "REGLES FIREBASE CHAT V34 : PASSED"

      # =========================================================
      # VERIFICATION FICHIERS FIREBASE
      # =========================================================

      - name: Verify Firebase project files
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/AppNotificationService.java"
          FUNCTIONS="$PROJECT_DIR/functions/index.js"

          echo "========================================="
          echo "       VERIFICATION FICHIERS FIREBASE"
          echo "========================================="

          test -f "$PROJECT_DIR/app/google-services.json" || {
            echo "::error::google-services.json absent."
            exit 1
          }

          test -f "$SERVICE" || {
            echo "::error::AppNotificationService.java absent."
            exit 1
          }

          test -f "$FUNCTIONS" || {
            echo "::error::functions/index.js absent."
            exit 1
          }

          grep -Fq \
            'FirebaseMessagingService' \
            "$SERVICE" || {
              echo "::error::FirebaseMessagingService absent."
              exit 1
            }

          grep -Fq \
            'onMessageReceived' \
            "$SERVICE" || {
              echo "::error::onMessageReceived absent."
              exit 1
            }

          grep -Fq \
            'onDocumentCreated' \
            "$FUNCTIONS" || {
              echo "::error::onDocumentCreated absent."
              exit 1
            }

          grep -Fq \
            'notifyClientWhenAdminReplies' \
            "$FUNCTIONS" || {
              echo "::error::notifyClientWhenAdminReplies absent."
              exit 1
            }

          node --check "$FUNCTIONS"

          echo "OK : google-services.json"
          echo "OK : Firebase Messaging"
          echo "OK : Cloud Functions"

      # =========================================================
      # VERIFICATION GRADLE AVANT BUILD
      # =========================================================

      - name: Verify Gradle before build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f "./gradlew" || {
            echo "::error::gradlew absent dans le source V34."
            exit 1
          }

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --version

      # =========================================================
      # SIGNATURE RELEASE
      # =========================================================

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "      CONFIGURATION SIGNATURE V34"
          echo "========================================="

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 manquant."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD manquant."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEY_PASSWORD manquant."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > release-keystore.jks

          test -s release-keystore.jks || {
            echo "::error::Keystore vide."
            exit 1
          }

          ALIAS="${KEY_ALIAS:-}"

          if [ -z "$ALIAS" ]; then
            ALIAS="$(
              keytool \
                -list \
                -v \
                -keystore release-keystore.jks \
                -storepass "$KEYSTORE_PASSWORD" \
                2>/dev/null \
                | sed -n 's/^[[:space:]]*Alias name: //p' \
                | head -n 1
            )"
          fi

          ALIAS="$(printf '%s' "$ALIAS" | xargs)"

          if [ -z "$ALIAS" ]; then
            echo "::error::Aucun alias de keystore trouvé."
            exit 1
          fi

          keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$ALIAS" \
            >/dev/null 2>&1 || {
              echo "::error::Alias '$ALIAS' introuvable."
              exit 1
            }

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

          echo "OK : keystore"
          echo "OK : alias"
          echo "OK : signature"

      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build release APK V34 CHAT FIXED
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================="
          echo "      BUILD APK V34 CHAT FIXED"
          echo "========================================="

          ./gradlew \
            --no-daemon \
            clean \
            :app:assembleRelease

          echo ""
          echo "APK V34 CHAT FIXED compilé."

      # =========================================================
      # VERIFICATION APK
      # =========================================================

      - name: Verify APK signature and identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK" || {
            echo "::error::APK release introuvable."
            exit 1
          }

          echo "========================================="
          echo "       VERIFICATION APK V34"
          echo "========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" | grep -q \
            "package: name='com.aistudio.youngestbiz.mbkz'" || {
              echo "::error::applicationId incorrect."
              exit 1
            }

          echo "$BADGING" | grep -q \
            "versionCode='34'" || {
              echo "::error::versionCode différent de 34."
              exit 1
            }

          echo "$BADGING" | grep -q \
            "versionName='1.27.0'" || {
              echo "::error::versionName différent de 1.27.0."
              exit 1
            }

          echo ""
          echo "OK : APK signé"
          echo "OK : applicationId"
          echo "OK : versionCode 34"
          echo "OK : versionName 1.27.0"

      # =========================================================
      # PREPARATION ARTIFACT
      # =========================================================

      - name: Prepare V34 CHAT FIXED artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-FIXED.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-FIXED.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          echo ""
          echo "Artifact final :"
          ls -lh "$GITHUB_WORKSPACE/release-output"

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================

      - name: Upload V34 CHAT FIXED APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-FIXED
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # CONFIRMATION FINALE
      # =========================================================

      - name: Final V34 Chat Fixed confirmation
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " V34 CHAT FIXED : BUILD + ARTIFACT TERMINES"
          echo "=============================================="

          echo ""
          echo "Le workflow a vérifié :"
          echo "1. Le vrai source V34 CHAT FIXED"
          echo "2. Le bouton ENVOYER et persistPendingChatDraft()"
          echo "3. Firebase Anonymous Auth"
          echo "4. openOrCreateClientConversation()"
          echo "5. whereEqualTo(ownerUid)"
          echo "6. conversation.set(c)"
          echo "7. message.set(msg)"
          echo "8. Les règles Firestore du Chat"
          echo "9. L'interface d'administration existante"
          echo "10. La signature de l'APK"

          echo ""
          echo "ARTIFACT : YOUNGEST-BUSINESS-V34-CHAT-DELIVERY-FINAL-FIXED"
          echo "=============================================="
