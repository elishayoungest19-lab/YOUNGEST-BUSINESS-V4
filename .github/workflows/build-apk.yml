name: Build Android APK V18 Mobile Money Direct API

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V18 Mobile Money Direct API
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver automatiquement le ZIP V18
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "===== RECHERCHE DU ZIP V18 ====="

          ZIP=$(find . -maxdepth 3 -type f \
            -name 'YOUNGEST-BUSINESS-V18-*.zip' \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP V18 trouvé."
            echo "ZIP disponibles :"
            find . -maxdepth 3 -type f -name '*.zip' | sort
            exit 1
          fi

          echo "ZIP V18 trouvé : $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extraire le projet V18
        shell: bash
        run: |
          set -e

          rm -rf v18-extracted
          mkdir -p v18-extracted

          unzip -o "${{ steps.find_zip.outputs.zip }}" \
            -d v18-extracted

          echo "Projet V18 extrait."

      - name: Détecter le projet Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find v18-extracted \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android introuvable."
            exit 1
          fi

          echo "Projet Android : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Vérifier la version V18
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== VERSION V18 ====="

          grep -E "applicationId|versionCode|versionName" app/build.gradle

          grep -q "versionCode 15" app/build.gradle
          grep -q "versionName '1.9.1'" app/build.gradle

          echo "Version V18 confirmée."

      - name: Vérifier les fonctions V18
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"

          if [ ! -f "$MAIN" ]; then
            echo "ERREUR : MainActivity.java introuvable."
            exit 1
          fi

          echo "===== FONCTIONS V18 ====="

          grep -q "clientTransferPage" "$MAIN"
          grep -q "verifyWalletSimulation" "$MAIN"
          grep -q "M-Pesa" "$MAIN"
          grep -q "Airtel Money" "$MAIN"
          grep -q "Orange Money" "$MAIN"
          grep -q "Afrimoney" "$MAIN"

          echo "Fonctions V18 présentes."

      - name: Configurer Firebase
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "app/google-services.json" ]; then
            echo "Firebase déjà configuré."

          elif [ -f "google-services.json" ]; then
            cp google-services.json app/google-services.json
            echo "Firebase copié vers app/."

          else
            SOURCE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'google-services.json' \
              | head -n 1)

            if [ -n "$SOURCE" ]; then
              cp "$SOURCE" app/google-services.json
              echo "Firebase configuré depuis : $SOURCE"
            else
              echo "AVERTISSEMENT : google-services.json introuvable."
            fi
          fi

      - name: Préparer le keystore Release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : KEYSTORE_BASE64 absent."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : KEYSTORE_PASSWORD absent."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERREUR : KEY_PASSWORD absent."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERREUR : keystore vide."
            exit 1
          fi

          ALIAS=$(keytool \
            -list \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -v 2>/dev/null \
            | awk -F': ' '/Alias name:/ {print $2; exit}')

          if [ -z "$ALIAS" ]; then
            echo "ERREUR : alias du keystore introuvable."
            exit 1
          fi

          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Keystore Release préparé."
          echo "Alias Release détecté."

      - name: Vérifier la configuration de signature V18
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== SIGNATURE V18 ====="

          grep -A12 -B2 "signingConfigs" app/build.gradle || true

          echo "Configuration de signature vérifiée."

      - name: Nettoyer le projet V18
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --no-daemon

      - name: Compiler APK V18 Release
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "====================================="
          echo "     COMPILATION V18 RELEASE"
          echo "====================================="

          gradle :app:assembleRelease --no-daemon

      - name: Vérifier APK V18 et sa signature
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK V18 introuvable."
            exit 1
          fi

          echo "APK V18 généré : $APK"

          echo "===== VERIFICATION SIGNATURE APK ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK V18 Release signé et valide."

          echo "===== EMPREINTE DU CERTIFICAT ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --print-certs \
            "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Préparer APK V18 final
        shell: bash
        run: |
          set -e

          rm -rf release-apk
          mkdir -p release-apk

          cp "$APK_PATH" \
            "release-apk/YOUNGEST-BUSINESS-V18-IDENTIFICATION-PORTEFEUILLE-RELEASE.apk"

          echo "===== APK FINAL ====="
          ls -lh release-apk/

      - name: Publier APK V18 Release
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V18-IDENTIFICATION-PORTEFEUILLE-RELEASE
          path: release-apk/YOUNGEST-BUSINESS-V18-IDENTIFICATION-PORTEFEUILLE-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
