name: "Build YOUNGEST’S BUSINESS V9 APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: "Build Android APK V9"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Installer Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Installer Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: "Installer Gradle 8.9"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Installer les composants Android nécessaires"
        shell: bash
        run: |
          set -e

          echo "Acceptation des licences Android..."
          yes | sdkmanager --licenses > /dev/null || true

          echo "Installation des composants Android..."
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Composants Android installés."

      - name: "Décompresser le projet V9"
        shell: bash
        run: |
          set -e

          ZIP_FILE="./YOUNGEST-BUSINESS-V9-MOBILE-MONEY.zip"

          echo "Recherche du fichier V9..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERREUR : le fichier V9 est introuvable."
            echo "Fichiers présents dans le dépôt :"
            ls -lah
            exit 1
          fi

          echo "ZIP V9 trouvé :"
          ls -lh "$ZIP_FILE"

          echo "Décompression du projet..."
          unzip -o "$ZIP_FILE"

          echo "Contenu après décompression :"
          ls -lah

      - name: "Vérifier le projet Android"
        shell: bash
        run: |
          set -e

          if [ ! -f "app/build.gradle" ]; then
            echo "ERREUR : app/build.gradle est introuvable."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Projet Android détecté."
          echo "Version du projet :"
          grep -E "versionCode|versionName|applicationId" app/build.gradle || true

      - name: "Préparer le keystore V9"
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Création du keystore..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : KEYSTORE_BASE64 est vide."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERREUR : le keystore n'a pas été créé."
            exit 1
          fi

          echo "Keystore V9 préparé."
          ls -lh release-keystore.jks

      - name: "Construire l'APK Release V9 signé"
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: "youngest_business"
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Nettoyage du projet..."
          gradle --no-daemon clean

          echo "Construction de l'APK Release V9..."
          gradle --no-daemon assembleRelease --stacktrace

          echo "Construction terminée."

      - name: "Vérifier l'APK V9"
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."
            find app/build/outputs -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK trouvé :"
          ls -lh "$APK"

          echo "Vérification de la signature..."

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERREUR : apksigner introuvable."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "Signature APK V9 vérifiée avec succès."

      - name: "Afficher l'APK final"
        shell: bash
        run: |
          echo "===== APK FINAL V9 ====="
          ls -lh app/build/outputs/apk/release/app-release.apk
          echo "========================"

      - name: "Publier l'APK V9"
        uses: actions/upload-artifact@v4
        with:
          name: "YOUNGEST-BUSINESS-V9-MOBILE-MONEY"
          path: "app/build/outputs/apk/release/app-release.apk"
          if-no-files-found: error
