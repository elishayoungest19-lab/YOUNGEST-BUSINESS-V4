
name: YOUNGEST'S BUSINESS V58 - Full Project Diagnostic

on:
  push:
    branches:
      - main
      - v58-test

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yb-v58-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-project:
    name: Diagnose V58 Project Structure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Display repository information
        shell: bash
        run: |
          echo "=================================="
          echo "YOUNGEST'S BUSINESS V58"
          echo "PROJECT DIAGNOSTIC"
          echo "=================================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo ""
          echo "ROOT DIRECTORY:"
          pwd
          ls -la

      - name: Locate Android project files
        shell: bash
        run: |
          echo "===== ANDROID FILES ====="

          find . -type f \
            \( -name "MainActivity.java" \
            -o -name "MainActivity.kt" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "gradlew" \) \
            -not -path "./.git/*" \
            -print | head -200

      - name: Locate Web Admin files
        shell: bash
        run: |
          echo "===== WEB ADMIN FILES ====="

          find . -type f \
            \( -name "index.html" \
            -o -name "app.js" \
            -o -name "styles.css" \) \
            -not -path "./.git/*" \
            -print | head -200

      - name: Locate Firebase files
        shell: bash
        run: |
          echo "===== FIREBASE FILES ====="

          find . -type f \
            \( -name "firebase.json" \
            -o -name ".firebaserc" \
            -o -name "firestore.rules" \
            -o -name "google-services.json" \
            -o -name "package.json" \) \
            -not -path "./.git/*" \
            -print | head -200

      - name: Check JavaScript files
        shell: bash
        run: |
          echo "===== JAVASCRIPT VALIDATION ====="

          while IFS= read -r file; do
            echo "Checking: $file"

            if node --check "$file"; then
              echo "OK: $file"
            else
              echo "SYNTAX ERROR: $file"
            fi
          done < <(
            find . -type f \
              \( -name "app.js" -o -path "*/functions/*.js" \) \
              -not -path "./.git/*"
          )

      - name: Display Gradle configuration
        shell: bash
        run: |
          echo "===== GRADLE CONFIGURATION ====="

          find . -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -not -path "./.git/*" \
            -print

      - name: Generate project diagnostic report
        shell: bash
        run: |
          {
            echo "# YOUNGEST'S BUSINESS V58"
            echo "## Project Diagnostic"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "## Project files"
            find . -type f \
              -not -path "./.git/*" \
              | sort
          } > V58-DIAGNOSTIC.txt

          echo "Diagnostic report generated."

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V58-DIAGNOSTIC
          path: V58-DIAGNOSTIC.txt
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostic completed
        run: |
          echo "V58 project diagnostic completed."
          echo "No APK build was attempted."
          echo "No Firebase production deployment was attempted."
