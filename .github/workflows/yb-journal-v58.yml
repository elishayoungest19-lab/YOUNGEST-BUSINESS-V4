name: YOUNGEST'S BUSINESS V58 - Build APK Test

on:
  push:
    branches:
      - main
      - v58-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yb-v58-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-v58:
    name: Extract and Build V58 Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate V58 source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="YOUNGEST-BUSINESS-V58-FINAL-CORRIGE-SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "V58 source ZIP not found at repository root."
            find . -maxdepth 2 -iname '*V58*SOURCE*.zip'
            exit 1
          fi

          echo "V58 source archive found."

      - name: Extract V58 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v58-source
          unzip -q YOUNGEST-BUSINESS-V58-FINAL-CORRIGE-SOURCE.zip -d v58-source

          test -s v58-source/app/build.gradle
          test -s v58-source/settings.gradle
          test -s v58-source/app/google-services.json
          test -s v58-source/web-admin/app.js
          test -s v58-source/functions/index.js
          test -s v58-source/firebase.json
          test -s v58-source/firestore.rules

          echo "V58 source extracted successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate JavaScript
        run: |
          node --check v58-source/web-admin/app.js
          node --check v58-source/functions/index.js

      - name: Verify V58 Android version
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionCode[[:space:]]+58' v58-source/app/build.gradle
          grep -Fq "1.58.0-mobile-money-receipts" v58-source/app/build.gradle
          echo "Android version 58 confirmed."

      - name: Build V58 Debug APK
        working-directory: v58-source
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v58-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" > apk-info.txt

          grep -Fq "com.aistudio.youngestbiz.mbkz" apk-info.txt
          grep -Fq "versionCode='58'" apk-info.txt
          grep -Fq "versionName='1.58.0-mobile-money-receipts'" apk-info.txt

          echo "V58 APK verification successful."

      - name: Upload V58 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V58-ANDROID-TEST
          path: v58-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Confirm test completion
        run: |
          echo "V58 Android test build completed."
          echo "Firebase production deployment was not performed."
