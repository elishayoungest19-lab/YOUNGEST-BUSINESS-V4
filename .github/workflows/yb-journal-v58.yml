name: YOUNGEST'S BUSINESS V58 - OFFICIAL RELEASE SPARK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youngest-business-v58-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: youngestsbusiness

jobs:

  build-android:
    name: Build Official Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract V58 source archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p v58-source
          FOUND=""

          while IFS= read -r -d '' ZIP; do
            echo "Checking archive: $ZIP"

            if unzip -Z1 "$ZIP" | grep -Eq '(^|/)app/build.gradle$' &&
               unzip -Z1 "$ZIP" | grep -Eq '(^|/)web-admin/index.html$' &&
               unzip -Z1 "$ZIP" | grep -Eq '(^|/)firebase.json$'; then
              FOUND="$ZIP"
              break
            fi
          done < <(find . -type f -iname '*V58*.zip' -print0)

          if [ -z "$FOUND" ]; then
            echo "ERROR: No valid V58 source ZIP found."
            echo "ZIP files available:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Selected archive: $FOUND"
          unzip -q "$FOUND" -d v58-source

          GRADLE_FILE=$(find v58-source -type f \
            -path '*/app/build.gradle' -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: app/build.gradle missing."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$(dirname "$GRADLE_FILE")")

          for FILE in \
            settings.gradle \
            app/google-services.json \
            web-admin/index.html \
            web-admin/app.js \
            firebase.json \
            .firebaserc \
            firestore.rules; do
            test -s "$PROJECT_ROOT/$FILE" || {
              echo "ERROR: Missing $FILE"
              exit 1
            }
          done

          echo "SOURCE_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "V58 source successfully located and extracted."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate V58 project
        shell: bash
        run: |
          set -euo pipefail

          node --check "$SOURCE_DIR/web-admin/app.js"

          grep -Eq 'versionCode[[:space:]]+58' \
            "$SOURCE_DIR/app/build.gradle"

          grep -Fq "1.58.0-mobile-money-receipts" \
            "$SOURCE_DIR/app/build.gradle"

          echo "V58 validation passed."

      - name: Configure official Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$SOURCE_DIR/release-keystore.jks"

          chmod 600 "$SOURCE_DIR/release-keystore.jks"

          KEY_ALIAS=$(
            keytool -list -v \
              -keystore "$SOURCE_DIR/release-keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | awk -F': ' '/^Alias name:/{print $2; exit}'
          )

          test -n "$KEY_ALIAS"

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build official release APK
        working-directory: .
        run: |
          cd "$SOURCE_DIR"
          gradle --no-daemon clean :app:assembleRelease --stacktrace

      - name: Verify installable signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$SOURCE_DIR/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" > apk-info.txt

          grep -Fq "com.aistudio.youngestbiz.mbkz" apk-info.txt
          grep -Fq "versionCode='58'" apk-info.txt
          grep -Fq "versionName='1.58.0-mobile-money-receipts'" apk-info.txt

          echo "Official signed APK verified."

      - name: Upload official Android APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V58-OFFICIAL-INSTALLABLE-APK
          path: v58-source/**/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

  deploy-firebase:
    name: Deploy Web Admin and Firestore Rules - Spark
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract V58 source archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p v58-source
          FOUND=""

          while IFS= read -r -d '' ZIP; do
            if unzip -Z1 "$ZIP" | grep -Eq '(^|/)web-admin/index.html$' &&
               unzip -Z1 "$ZIP" | grep -Eq '(^|/)firebase.json$' &&
               unzip -Z1 "$ZIP" | grep -Eq '(^|/)firestore.rules$'; then
              FOUND="$ZIP"
              break
            fi
          done < <(find . -type f -iname '*V58*.zip' -print0)

          if [ -z "$FOUND" ]; then
            echo "ERROR: Valid V58 deployment archive not found."
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Selected archive: $FOUND"
          unzip -q "$FOUND" -d v58-source

          FIREBASE_FILE=$(find v58-source -type f \
            -path '*/firebase.json' -print -quit)

          test -n "$FIREBASE_FILE"

          PROJECT_ROOT=$(dirname "$FIREBASE_FILE")

          test -s "$PROJECT_ROOT/.firebaserc"
          test -s "$PROJECT_ROOT/web-admin/index.html"
          test -s "$PROJECT_ROOT/web-admin/app.js"
          test -s "$PROJECT_ROOT/firestore.rules"

          echo "SOURCE_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Web Admin
        run: |
          set -euo pipefail
          node --check "$SOURCE_DIR/web-admin/app.js"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Firebase Hosting and Firestore rules
        shell: bash
        run: |
          set -euo pipefail

          cd "$SOURCE_DIR"

          firebase deploy \
            --only hosting,firestore:rules \
            --project "$FIREBASE_PROJECT" \
            --non-interactive

      - name: Confirm Web deployment
        run: |
          echo "Web Admin deployment completed."
          echo "https://youngestsbusiness.web.app"
