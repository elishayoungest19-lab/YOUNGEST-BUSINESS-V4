name: YOUNGEST'S BUSINESS V58 - Build and Test

on:
  push:
    branches:
      - main
      - v58-test

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yb-v58-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-sources:
    name: Verify V58 project files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -s app/build.gradle
          test -s build.gradle
          test -s settings.gradle
          test -s web-admin/index.html
          test -s web-admin/app.js
          test -s web-admin/styles.css
          test -s firebase.json
          test -s firestore.rules
          test -s functions/index.js

          JAVA_FILE=$(find app/src/main -name MainActivity.java -print -quit)
          test -n "$JAVA_FILE"
          test -s "$JAVA_FILE"

          echo "All required V58 files are present."

      - name: Validate JavaScript
        run: |
          node --check web-admin/app.js
          node --check functions/index.js

      - name: Verify Android version
        shell: bash
        run: |
          grep -Eq 'versionCode[[:space:]]+58' app/build.gradle
          grep -Fq "1.58.0-mobile-money-receipts" app/build.gradle
          echo "Android version V58 verified."

  build-android:
    name: Build V58 Android APK
    needs: verify-sources
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" > apk-info.txt

          grep -Fq "com.aistudio.youngestbiz.mbkz" apk-info.txt
          grep -Fq "versionCode='58'" apk-info.txt
          grep -Fq "versionName='1.58.0-mobile-money-receipts'" apk-info.txt

          echo "V58 debug APK successfully verified."

      - name: Upload V58 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V58-ANDROID-TEST
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  web-admin-validation:
    name: Validate V58 Web Admin
    needs: verify-sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Web Admin JavaScript
        run: node --check web-admin/app.js

      - name: Validate Firebase Functions JavaScript
        run: node --check functions/index.js

      - name: Confirm Firebase configuration
        run: |
          test -s firebase.json
          test -s .firebaserc
          echo "Firebase configuration files found."

  production-deployment:
    name: Production deployment - DISABLED
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production deployment is disabled during V58 testing."
