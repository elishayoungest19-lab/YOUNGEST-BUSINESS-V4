name: YOUNGEST'S BUSINESS V68 - RECEIPT A4 FULL PAGE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'YOUNGEST-BUSINESS-V68-RECEIPT-A4-FULL-PAGE-SOURCE.zip'
      - '.github/workflows/yb-v68-receipt-a4-full-page.yml'

permissions:
  contents: read

concurrency:
  group: yb-v68-receipt-a4-full-page-hosting
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and validate V68 source
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::V68 validation failed at line $LINENO"' ERR

          ZIP="$GITHUB_WORKSPACE/YOUNGEST-BUSINESS-V68-RECEIPT-A4-FULL-PAGE-SOURCE.zip"
          DEST="$RUNNER_TEMP/yb-v68"

          echo "Checking V68 ZIP..."
          if [ ! -s "$ZIP" ]; then
            echo "::error::V68 ZIP missing or empty: $ZIP"
            exit 1
          fi

          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          echo "Checking required files..."
          for FILE in \
            "web-admin/app.js" \
            "web-admin/index.html" \
            "firebase.json" \
            ".firebaserc" \
            "app/build.gradle" \
            "web-admin/assets/operators/airtel.svg"
          do
            if [ ! -s "$DEST/$FILE" ]; then
              echo "::error::Required V68 file missing: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

          echo "Checking JavaScript syntax..."
          node --check "$DEST/web-admin/app.js"

          echo "Checking Android version..."
          grep -Fq 'versionCode 68' "$DEST/app/build.gradle" || {
            echo "::error::versionCode 68 not found"
            exit 1
          }

          grep -Fq "versionName '1.68.0-receipt-a4-full-page'" "$DEST/app/build.gradle" || {
            echo "::error::V68 versionName not found"
            exit 1
          }

          echo "Checking A4 receipt layout..."
          grep -Fq '@page{size:A4 portrait;margin:0}' "$DEST/web-admin/app.js" || {
            echo "::error::A4 page CSS not found"
            exit 1
          }

          grep -Fq 'width:204mm!important;height:291mm!important' "$DEST/web-admin/app.js" || {
            echo "::error::Receipt dimensions not found"
            exit 1
          }

          grep -Fq 'width:150px!important;height:150px!important' "$DEST/web-admin/app.js" || {
            echo "::error::QR dimensions not found"
            exit 1
          }

          echo "Checking Airtel Money SVG..."
          grep -Fq 'Airtel Money' "$DEST/web-admin/assets/operators/airtel.svg" || {
            echo "::error::Airtel Money SVG title not found"
            exit 1
          }

          echo "Checking Firebase configuration..."
          export V68_ROOT="$DEST"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.env.V68_ROOT;
          const firebasePath = path.join(root, 'firebase.json');
          const projectPath = path.join(root, '.firebaserc');

          const firebase = JSON.parse(fs.readFileSync(firebasePath, 'utf8'));
          const project = JSON.parse(fs.readFileSync(projectPath, 'utf8'));

          if (firebase.hosting?.public !== 'web-admin') {
            throw new Error('Firebase Hosting public folder must be web-admin');
          }

          if (project.projects?.default !== 'youngestsbusiness') {
            throw new Error('Firebase default project must be youngestsbusiness');
          }

          console.log('Firebase Hosting folder: web-admin');
          console.log('Firebase project: youngestsbusiness');
          console.log('V68 Firebase configuration validated.');
          NODE

          echo "V68_ROOT=$DEST" >> "$GITHUB_ENV"
          echo "V68 source validation completed successfully."

      - name: Check Firebase service account secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -Eeuo pipefail

          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON is missing"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | node -e "
            let input = '';
            process.stdin.on('data', chunk => input += chunk);
            process.stdin.on('end', () => {
              JSON.parse(input);
              console.log('Firebase service account JSON is valid.');
            });
          "

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting only
        working-directory: ${{ env.V68_ROOT }}
        run: |
          firebase deploy \
            --only hosting \
            --project youngestsbusiness \
            --non-interactive

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## YOUNGEST'S BUSINESS V68"
            echo ""
            echo "- V68 source validated."
            echo "- A4 receipt layout checked."
            echo "- Airtel Money SVG checked."
            echo "- Firebase Hosting deployment completed."
            echo "- Firebase Hosting only."
            echo "- No Cloud Functions deployment."
            echo "- No Firestore rules deployment."
          } >> "$GITHUB_STEP_SUMMARY"
