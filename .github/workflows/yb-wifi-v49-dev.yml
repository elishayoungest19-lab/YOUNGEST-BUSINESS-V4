name: YOUNGEST'S BUSINESS V57 - Journal des opérations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'YOUNGEST-BUSINESS-V57-JOURNAL-OPERATIONS-SOURCE.zip'
      - '.github/workflows/yb-journal-v57.yml'

permissions:
  contents: read

concurrency:
  group: yb-journal-v57-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V57-JOURNAL-OPERATIONS-SOURCE.zip
  FIREBASE_PROJECT: youngestsbusiness

jobs:
  build-android:
    name: Extract sources, build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and validate V57 source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::Archive not found at repository root: $SOURCE_ZIP"
            echo "Upload the V57 ZIP itself to the root of the main branch, then rerun this workflow."
            exit 1
          fi
          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/yb-v57-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"
          PROJECT_DIR=""
          while IFS= read -r -d '' candidate; do
            if [ -s "$candidate/app/build.gradle" ] && \
               [ -s "$candidate/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java" ] && \
               [ -s "$candidate/app/google-services.json" ] && \
               [ -s "$candidate/firebase.json" ] && \
               [ -s "$candidate/web-admin/app.js" ]; then
              PROJECT_DIR="$(dirname "$(dirname "$candidate")")"
              # The candidate is app/src/main/java/...; find the actual project root by walking upward.
              PROJECT_DIR="$candidate"
              while [ "$PROJECT_DIR" != "$DEST" ] && [ ! -s "$PROJECT_DIR/settings.gradle" ]; do
                PROJECT_DIR="$(dirname "$PROJECT_DIR")"
              done
              if [ -s "$PROJECT_DIR/settings.gradle" ]; then break; fi
              PROJECT_DIR=""
            fi
          done < <(find "$DEST" -type f -name MainActivity.java -print0)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not locate the V57 Android project inside the ZIP."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "V57 project found: $PROJECT_DIR"

      - name: Verify V57 journal and version markers
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -s app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          test -s web-admin/app.js
          test -s web-admin/index.html
          test -s firestore.rules
          test -s firebase.json
          node --check web-admin/app.js
          grep -q 'yb_mobile_money_journal' firestore.rules
          grep -q 'DEPENSE' app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java
          grep -q 'DEPENSE' web-admin/app.js
          grep -q '1.57.0-journal-operations' app/build.gradle
          grep -Eq 'versionCode[[:space:]]+57' app/build.gradle
          echo 'V57 source validation passed.'

      - name: Configure Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          PROJECT_DIR='${{ steps.source.outputs.project_dir }}'
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/release-keystore.jks"
          chmod 600 "$PROJECT_DIR/release-keystore.jks"
          KEY_ALIAS="$(keytool -list -v -keystore "$PROJECT_DIR/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2; exit}')"
          if [ -z "$KEY_ALIAS" ]; then
            echo '::error::Could not read key alias from keystore.'
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleRelease --stacktrace

      - name: Verify APK package and version
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.youngestbiz.mbkz'"
          echo "$BADGING" | grep -Fq "versionCode='57'"
          echo "$BADGING" | grep -Fq "versionName='1.57.0-journal-operations'"

      - name: Upload V57 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V57-JOURNAL-OPERATIONS-APK
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  deploy-web:
    name: Deploy V57 Web Admin and Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V57 web source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          test -s "$ZIP_PATH" || { echo "::error::Missing $SOURCE_ZIP at repository root."; exit 1; }
          mkdir -p "$RUNNER_TEMP/yb-v57-deploy"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/yb-v57-deploy"
          PROJECT_DIR=""
          while IFS= read -r -d '' file; do
            candidate="$(dirname "$(dirname "$file")")"
            if [ -s "$candidate/firebase.json" ] && [ -s "$candidate/web-admin/index.html" ] && [ -s "$candidate/web-admin/app.js" ] && [ -s "$candidate/firestore.rules" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/yb-v57-deploy" -type f -path '*/web-admin/app.js' -print0)
          if [ -z "$PROJECT_DIR" ]; then
            echo '::error::Could not locate V57 Firebase Hosting project in ZIP.'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          node --check "$PROJECT_DIR/web-admin/app.js"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy V57 Hosting and Firestore rules
        working-directory: ${{ env.PROJECT_DIR }}
        run: firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive
