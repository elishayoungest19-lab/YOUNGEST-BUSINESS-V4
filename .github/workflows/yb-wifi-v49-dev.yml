name: YOUNGEST'S BUSINESS V52 Wi-Fi Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yb-wifi-v52-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V52-WIFI-MODULE-RESTORED-SOURCE.zip

jobs:
  build-android:
    name: Build and verify V52 signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract and verify V52 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::V52 source ZIP missing at repository root: $SOURCE_ZIP"
            exit 1
          fi
          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/v52-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"
          PROJECT_DIR=""
          while IFS= read -r -d '' SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -s "$CANDIDATE/app/build.gradle" ] && [ -s "$CANDIDATE/app/src/main/AndroidManifest.xml" ] && [ -s "$CANDIDATE/app/google-services.json" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)
          if [ -z "$PROJECT_DIR" ]; then echo "::error::Android project incomplete in V52 ZIP."; exit 1; fi
          test -s "$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          { echo "## V52 source verified"; echo; echo "- Commit: \`$GITHUB_SHA\`"; echo "- Source: \`$SOURCE_ZIP\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Set V52 version and verify application ID
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          python3 - "$GRADLE_FILE" <<'PYCODE'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s, c = re.subn(r"(?m)^([ \t]*versionCode[ \t]+)\d+([ \t]*)$", r"\g<1>52\g<2>", s, count=1)
          s, n = re.subn(r"(?m)^([ \t]*versionName[ \t]+)['\"][^'\"]+['\"]([ \t]*)$", r"\g<1>'1.52.0-wifi'\g<2>", s, count=1)
          if c != 1 or n != 1: raise SystemExit("Could not set V52 version markers.")
          if not re.search(r"applicationId\s+['\"]com\.aistudio\.youngestbiz\.mbkz['\"]", s): raise SystemExit("Expected applicationId not found.")
          p.write_text(s, encoding="utf-8")
          PYCODE
          grep -Eq 'versionCode[[:space:]]+52([[:space:]]|$)' "$GRADLE_FILE"
          grep -Fq "1.52.0-wifi" "$GRADLE_FILE"
      - name: Configure production signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret KEYSTORE_BASE64 missing."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Secret KEYSTORE_PASSWORD missing."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Secret KEY_PASSWORD missing."; exit 1; }
          KEYSTORE_FILE="$PROJECT_DIR/release-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"; chmod 600 "$KEYSTORE_FILE"
          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS" || { echo "::error::Keystore alias not found."; exit 1; }
          { echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"; echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"; } >> "$GITHUB_ENV"
      - name: Build V52 release APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleRelease --stacktrace
      - name: Verify APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.youngestbiz.mbkz'"
          echo "$BADGING" | grep -Fq "versionCode='52'"
          echo "$BADGING" | grep -Fq "versionName='1.52.0-wifi'"
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK" "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V52-WIFI-SIGNED.apk"
          sha256sum "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V52-WIFI-SIGNED.apk" > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"
          { echo "## V52 APK built and verified"; echo; echo "- Commit: \`$GITHUB_SHA\`"; echo "- Version: \`1.52.0-wifi\` (code 52)"; echo "- Signature: verified"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed V52 APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V52-WIFI-SIGNED
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish final status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          { echo "## Final V52 workflow status"; echo; echo "- Status: **$JOB_STATUS**"; echo "- Commit: \`$GITHUB_SHA\`"; echo "- Run: [Open workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_STATUS" != "success" ]; then echo "::error::V52 workflow failed. Inspect the failed step."; fi

# Android APK build only. Firebase Hosting and Firestore rules are not deployed here.
