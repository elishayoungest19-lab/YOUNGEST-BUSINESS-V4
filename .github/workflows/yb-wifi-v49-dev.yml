name: YOUNGEST'S BUSINESS V56 Web Coupon Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: yb-wifi-v56-web-coupon-fix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-WEB-COUPON-FIX.zip
  FIREBASE_PROJECT: youngestsbusiness
  VERSION_CODE: "56"
  VERSION_NAME: "1.56.0-wifi-voucher-manager"

jobs:
  build-android:
    name: Build and verify V56 signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract V56 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || { echo "::error::Missing source ZIP: $SOURCE_ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/v56-source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/v56-source"
          PROJECT_DIR="$RUNNER_TEMP/v56-source"
          test -f "$PROJECT_DIR/settings.gradle" -o -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/web-admin/index.html"
          test -f "$PROJECT_DIR/web-admin/app.js"
          test -f "$PROJECT_DIR/firestore.rules"
          grep -q 'wifiPrintVouchers' "$PROJECT_DIR/web-admin/app.js"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # Install packages as separate arguments; do not pass a comma-joined string.
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set V56 version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os, sys
          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          if not p.exists():
              p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          if not p.exists():
              raise SystemExit("app/build.gradle or app/build.gradle.kts not found")
          s = p.read_text()
          if p.suffix == ".kts":
              s, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 56', s, count=1)
              s, n2 = re.subn(r"versionName\s+(['\"]).*?\1", "versionName '1.56.0-wifi-voucher-manager'", s, count=1)
          else:
              s, n1 = re.subn(r'versionCode\s+\d+', 'versionCode 56', s, count=1)
              s, n2 = re.subn(r"versionName\s+(['\"]).*?\1", "versionName '1.56.0-wifi-voucher-manager'", s, count=1)
          if not n1 or not n2:
              raise SystemExit("Could not safely update versionCode/versionName")
          p.write_text(s)
          print(f"Updated {p}")
          PY

      - name: Configure signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/youngest-release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/youngest-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          ALIAS="$(keytool -list -keystore "$RUNNER_TEMP/youngest-release.keystore" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/ {gsub(/^ +/, "", $1); print $1; exit}')"
          test -n "$ALIAS" || { echo "::error::Could not determine signing key alias"; exit 1; }
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -x ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean :app:assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace
          else
            gradle --no-daemon clean :app:assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace
          fi

      - name: Verify APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::APK not found at $APK"; find "$PROJECT_DIR/app/build/outputs" -type f -name '*.apk' -print || true; exit 1; }
          apksigner verify --verbose "$APK"
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.aistudio.youngestbiz.mbkz'"
          echo "$BADGING" | grep -q "versionCode='56'"
          echo "$BADGING" | grep -q "versionName='1.56.0-wifi-voucher-manager'"
          mkdir -p "$RUNNER_TEMP/v56-artifact"
          cp "$APK" "$RUNNER_TEMP/v56-artifact/YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-SIGNED.apk"

      - name: Upload signed V56 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-SIGNED
          path: ${{ runner.temp }}/v56-artifact/YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-SIGNED.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write Android build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## V56 Android build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Expected version: \`${VERSION_NAME}\` (code ${VERSION_CODE})"
            if [ "${{ job.status }}" = "success" ]; then echo "- Status: **success**"; else echo "- Status: **failed**"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Deploy V56 Web Admin and Firestore rules
    runs-on: ubuntu-latest
    needs: build-android
    if: needs.build-android.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract V56 web source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || { echo "::error::Missing source ZIP: $SOURCE_ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/v56-deploy"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/v56-deploy"
          PROJECT_DIR="$RUNNER_TEMP/v56-deploy"
          test -f "$PROJECT_DIR/firebase.json"
          test -f "$PROJECT_DIR/.firebaserc"
          test -f "$PROJECT_DIR/web-admin/index.html"
          test -f "$PROJECT_DIR/web-admin/app.js"
          test -f "$PROJECT_DIR/firestore.rules"
          grep -q 'wifiPrintVouchers' "$PROJECT_DIR/web-admin/app.js"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "V56 web source verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Web Admin JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check "$PROJECT_DIR/web-admin/app.js"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Hosting and Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive

      - name: Write Web deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## V56 Web Admin and Firestore deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Hosting target: https://youngestsbusiness.web.app"
            if [ "${{ job.status }}" = "success" ]; then echo "- Status: **success**"; else echo "- Status: **failed**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          
