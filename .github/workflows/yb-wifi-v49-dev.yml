name: YOUNGEST'S BUSINESS V53 Wi-Fi Complete

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: yb-wifi-v53-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V53-WIFI-COMPLETE-SOURCE.zip

jobs:
  build-android:
    name: Build and verify V53 signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Web Admin JavaScript
        run: node --check web-admin/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and verify V53 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::V53 source ZIP missing at repository root: $SOURCE_ZIP"
            exit 1
          fi
          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/v53-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"
          PROJECT_DIR=""
          while IFS= read -r -d '' SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -s "$CANDIDATE/app/build.gradle" ] && [ -s "$CANDIDATE/app/src/main/AndroidManifest.xml" ] && [ -s "$CANDIDATE/app/google-services.json" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)
          if [ -z "$PROJECT_DIR" ]; then echo "::error::Android project not found in V53 source ZIP."; exit 1; fi
          test -s "$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          test -s "$PROJECT_DIR/web-admin/assets/youngests-b-wifi-logo.png"
          node --check "$PROJECT_DIR/web-admin/app.js"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "## V53 source verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web Admin JavaScript: syntax OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Official Wi-Fi logo: found" >> "$GITHUB_STEP_SUMMARY"

      - name: Set V53 version
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          python3 - "$GRADLE_FILE" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          s,c=re.subn(r"(?m)^([ \t]*versionCode[ \t]+)\d+([ \t]*)$",r"\g<1>53\g<2>",s,count=1)
          s,n=re.subn(r'''(?m)^([ \t]*versionName[ \t]+)['"][^'"]+['"]([ \t]*)$''',r"\g<1>'1.53.0-wifi'\g<2>",s,count=1)
          if c!=1 or n!=1: raise SystemExit('Cannot set V53 version markers')
          if not re.search(r'''applicationId\s+['"]com\.aistudio\.youngestbiz\.mbkz['"]''',s): raise SystemExit('Application ID mismatch')
          p.write_text(s)
          PY

      - name: Configure production signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD missing"; exit 1; }
          KEYSTORE_FILE="$PROJECT_DIR/release-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS" || { echo "::error::Keystore alias missing"; exit 1; }
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build V53 release APK
        run: gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleRelease --stacktrace

      - name: Verify V53 APK and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.youngestbiz.mbkz'"
          echo "$BADGING" | grep -Fq "versionCode='53'"
          echo "$BADGING" | grep -Fq "versionName='1.53.0-wifi'"
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK" "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V53-WIFI-SIGNED.apk"
          sha256sum "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V53-WIFI-SIGNED.apk" > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"
          echo "## ✅ V53 APK compiled and signature verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed V53 APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V53-WIFI-SIGNED
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

  deploy-web:
    name: Deploy Web Admin and Firestore rules
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify V53 source ZIP exists
        run: test -s "$SOURCE_ZIP"
      - name: Extract V53 Web Admin and Firebase configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v53-deploy"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/v53-deploy"
          echo "DEPLOY_DIR=$RUNNER_TEMP/v53-deploy" >> "$GITHUB_ENV"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Hosting and Firestore rules
        working-directory: ${{ runner.temp }}/v53-deploy
        run: firebase deploy --only hosting,firestore:rules --project youngestsbusiness --non-interactive
      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## V53 deployment status"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Hosting target: \`https://youngestsbusiness.web.app\`"
            echo "- Rules and Hosting deployment runs only after successful Android build."
          } >> "$GITHUB_STEP_SUMMARY"
