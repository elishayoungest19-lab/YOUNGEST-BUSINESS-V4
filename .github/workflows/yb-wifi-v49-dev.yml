
name: YOUNGEST'S BUSINESS V56 Wi-Fi Voucher Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: yb-wifi-v56-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-SOURCE.zip
  FIREBASE_PROJECT: youngestsbusiness

jobs:
  build-android:
    name: Build and verify V56 signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and verify V56 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::V56 source ZIP missing at repository root: $SOURCE_ZIP"
            exit 1
          fi

          unzip -t "$ZIP_PATH"
          DEST="$RUNNER_TEMP/v56-source"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          PROJECT_DIR=""
          while IFS= read -r -d '' SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -s "$CANDIDATE/app/build.gradle" ] \
              && [ -s "$CANDIDATE/app/src/main/AndroidManifest.xml" ] \
              && [ -s "$CANDIDATE/app/google-services.json" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project not found in V56 source ZIP."
            exit 1
          fi

          test -s "$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          test -s "$PROJECT_DIR/web-admin/index.html"
          test -s "$PROJECT_DIR/web-admin/app.js"
          test -s "$PROJECT_DIR/web-admin/assets/youngests-b-wifi-logo.png"
          test -s "$PROJECT_DIR/firestore.rules"
          test -s "$PROJECT_DIR/README-V56-WIFI-VOUCHER-MANAGER.md"

          grep -q 'yb_wifi_routers' "$PROJECT_DIR/firestore.rules"
          grep -q 'yb_wifi_routers' "$PROJECT_DIR/web-admin/app.js"
          grep -q 'wifiPrintVouchers' "$PROJECT_DIR/web-admin/app.js"
          grep -qi 'voucher' "$PROJECT_DIR/README-V56-WIFI-VOUCHER-MANAGER.md"
          grep -q 'yb_wifi_cash_reconciliations' "$PROJECT_DIR/firestore.rules"
          grep -q 'yb_wifi_audit_logs' "$PROJECT_DIR/firestore.rules"
          grep -q 'PRÉPARER LES COUPONS UNIQUES' "$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          grep -q 'RAPPROCHEMENT DE CAISSE' "$PROJECT_DIR/app/src/main/java/com/aistudio/youngestbiz/mbkz/MainActivity.java"
          grep -q 'yb_wifi_cash_reconciliations' "$PROJECT_DIR/web-admin/app.js"
          grep -q 'yb_wifi_audit_logs' "$PROJECT_DIR/web-admin/app.js"

          node --check "$PROJECT_DIR/web-admin/app.js"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          {
            echo "## V56 source verified"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Source ZIP: \`$SOURCE_ZIP\`"
            echo "- Android project: found"
            echo "- Web Admin JavaScript: syntax OK"
            echo "- Wi-Fi voucher printing control: found"
            echo "- Wi-Fi logo: found"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set V56 version and verify application ID
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          python3 - "$GRADLE_FILE" <<'PY'
          import pathlib
          import re
          import sys

          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s, code_count = re.subn(
              r"(?m)^([ \t]*versionCode[ \t]+)\d+([ \t]*)$",
              r"\g<1>56\g<2>", s, count=1
          )

          s, name_count = re.subn(
              r'''(?m)^([ \t]*versionName[ \t]+)['"][^'"]+['"]([ \t]*)$''',
              r"\g<1>'1.56.0-wifi-voucher-manager'\g<2>", s, count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Cannot set V56 version markers safely.")

          if not re.search(
              r'''applicationId\s+['"]com\.aistudio\.youngestbiz\.mbkz['"]''', s
          ):
              raise SystemExit("Expected applicationId not found.")

          p.write_text(s, encoding="utf-8")
          PY

          grep -Eq '^[[:space:]]*versionCode[[:space:]]+56([[:space:]]|$)' "$GRADLE_FILE"
          grep -Fq "1.56.0-wifi-voucher-manager" "$GRADLE_FILE"

      - name: Configure production signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD missing"; exit 1; }

          KEYSTORE_FILE="$PROJECT_DIR/release-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS" || { echo "::error::Keystore alias missing or unreadable"; exit 1; }

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build V56 release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleRelease --stacktrace

      - name: Verify V56 APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.aistudio.youngestbiz.mbkz'"
          echo "$BADGING" | grep -Fq "versionCode='56'"
          echo "$BADGING" | grep -Fq "versionName='1.56.0-wifi-voucher-manager'"

          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK" "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-SIGNED.apk"

          sha256sum "$GITHUB_WORKSPACE/release-output/YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-SIGNED.apk" \
            > "$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"

          {
            echo "## V56 APK compiled and signature verified"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Package: \`com.aistudio.youngestbiz.mbkz\`"
            echo "- Version: \`1.56.0-wifi-voucher-manager\` (code 56)"
            echo "- APK signature: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed V56 APK
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-SIGNED
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android build status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## V56 Android build result"
            echo
            echo "- Status: **$JOB_STATUS**"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Deploy V56 Web Admin and Firestore rules
    runs-on: ubuntu-latest
    needs: build-android
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate Firebase project from V56 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          test -s "$ZIP_PATH" || { echo "::error::V56 source ZIP missing: $SOURCE_ZIP"; exit 1; }

          DEST="$RUNNER_TEMP/v56-deploy"
          mkdir -p "$DEST"
          unzip -q "$ZIP_PATH" -d "$DEST"

          DEPLOY_DIR=""
          while IFS= read -r -d '' CONFIG; do
            CANDIDATE="$(dirname "$CONFIG")"
            if [ -s "$CANDIDATE/.firebaserc" ] \
              && [ -s "$CANDIDATE/web-admin/index.html" ] \
              && [ -s "$CANDIDATE/web-admin/app.js" ] \
              && [ -s "$CANDIDATE/firestore.rules" ]; then
              DEPLOY_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$DEST" -type f -name firebase.json -print0)

          if [ -z "$DEPLOY_DIR" ]; then
            echo "::error::Could not locate Firebase config and Web Admin files in V56 source ZIP."
            exit 1
          fi

          node --check "$DEPLOY_DIR/web-admin/app.js"
          grep -q 'wifiPrintVouchers' "$DEPLOY_DIR/web-admin/app.js"

          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

          {
            echo "## V56 deployment source verified"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Firebase config: found"
            echo "- Web Admin entry page: found"
            echo "- Voucher printing code: found"
            echo "- Firestore rules: found"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Hosting and Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive

      - name: Publish deployment status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## V56 Web Admin and Firestore deployment"
            echo
            echo "- Status: **$JOB_STATUS**"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Hosting target: \`https://youngestsbusiness.web.app\`"
            echo "- Deployment is attempted only after Android build succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
          
