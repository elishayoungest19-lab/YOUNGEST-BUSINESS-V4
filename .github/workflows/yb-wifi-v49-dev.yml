name: YOUNGEST'S BUSINESS V56 Web Coupon Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yb-wifi-v56-web-coupon-fix-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-WEB-COUPON-FIX.zip
  FIREBASE_PROJECT: youngestsbusiness
  APP_ID: com.aistudio.youngestbiz.mbkz
  VERSION_CODE: '56'
  VERSION_NAME: 1.56.0-wifi-voucher-manager

jobs:
  build-android:
    name: Build and verify V56 signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract V56 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || { echo "Source ZIP missing: $SOURCE_ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/v56-source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/v56-source"
          PROJECT_DIR="$RUNNER_TEMP/v56-source"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/web-admin/index.html"
          test -f "$PROJECT_DIR/web-admin/app.js"
          test -f "$PROJECT_DIR/firestore.rules"
          test -f "$PROJECT_DIR/firebase.json"
          test -f "$PROJECT_DIR/.firebaserc"
          test -f "$PROJECT_DIR/README-V56-WIFI-VOUCHER-MANAGER.md"
          test -f "$PROJECT_DIR/web-admin/assets/youngests-b-wifi-logo.png"
          grep -q 'wifiPrintVouchers' "$PROJECT_DIR/web-admin/app.js"
          node --check "$PROJECT_DIR/web-admin/app.js"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "V56 source verified; Web voucher print control found; JavaScript syntax OK."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set V56 version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle" "$VERSION_CODE" "$VERSION_NAME" "$APP_ID" <<'PY'
          import re, sys
          path, code, name, app_id = sys.argv[1:]
          s = open(path, encoding='utf-8').read()
          s, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          s, n2 = re.subn(r"versionName\s+['\"][^'\"]+['\"]", f"versionName '{name}'", s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not safely update versionCode/versionName in app/build.gradle')
          if app_id not in s:
              raise SystemExit(f'Expected application ID not found: {app_id}')
          open(path, 'w', encoding='utf-8').write(s)
          print(f'Configured versionCode={code}, versionName={name}')
          PY

      - name: Configure signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing secret KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing secret KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing secret KEY_PASSWORD'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/youngest-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/youngest-release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          KEY_ALIAS="$(keytool -list -v -keystore "$RUNNER_TEMP/youngest-release.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n 1)"
          test -n "$KEY_ALIAS" || { echo 'Could not detect keystore alias'; exit 1; }
          cp "$RUNNER_TEMP/youngest-release.jks" "$PROJECT_DIR/release-keystore.jks"
          {
            echo "KEYSTORE_FILE=$PROJECT_DIR/release-keystore.jks"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
          ANDROID_KEY_ALIAS="$KEY_ALIAS" \
          ANDROID_KEY_PASSWORD="$KEY_PASSWORD" \
            gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleRelease --stacktrace

      - name: Verify APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "APK not found: $APK"; find "$PROJECT_DIR/app/build/outputs" -type f || true; exit 1; }
          apksigner verify --verbose "$APK"
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='$APP_ID'"
          echo "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='$VERSION_NAME'"
          echo 'APK signature and version metadata verified.'

      - name: Upload signed V56 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUNGEST-BUSINESS-V56-WIFI-VOUCHER-MANAGER-WEB-COUPON-FIX-SIGNED
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write Android build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V56 Android build result'
            echo
            echo "- Status: **${{ job.status }}**"
            echo "- Commit: \\`${GITHUB_SHA}\\`"
            echo "- Branch: \\`${GITHUB_REF_NAME}\\`"
            echo "- Package expected: \\`${APP_ID}\\`"
            echo "- Version expected: \\`${VERSION_NAME}\\` (code ${VERSION_CODE})"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Deploy V56 Web Admin and Firestore rules
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract Web source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || { echo "Source ZIP missing: $SOURCE_ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/v56-deploy"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/v56-deploy"
          WEB_DIR="$RUNNER_TEMP/v56-deploy"
          test -f "$WEB_DIR/firebase.json"
          test -f "$WEB_DIR/.firebaserc"
          test -f "$WEB_DIR/web-admin/index.html"
          test -f "$WEB_DIR/web-admin/app.js"
          test -f "$WEB_DIR/firestore.rules"
          grep -q 'wifiPrintVouchers' "$WEB_DIR/web-admin/app.js"
          node --check "$WEB_DIR/web-admin/app.js"
          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"
          echo 'Web Admin source verified; JavaScript syntax OK.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Authenticate Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo 'Missing secret FIREBASE_SERVICE_ACCOUNT_JSON'; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Hosting and Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          cd "$WEB_DIR"
          firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive

      - name: Write Web deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## V56 Web Admin and Firestore deployment'
            echo
            echo "- Status: **${{ job.status }}**"
            echo "- Commit: \\`${GITHUB_SHA}\\`"
            echo "- Hosting target: https://youngestsbusiness.web.app"
            echo '- Deployment runs only after the Android build succeeds.'
            echo '- Voucher print code is included in the deployed Web source.'
          } >> "$GITHUB_STEP_SUMMARY"
