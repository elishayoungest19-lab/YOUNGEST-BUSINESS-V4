name: YOUNGEST'S BUSINESS V60 — WEB ADMIN ONLY

on:
  push:
    branches: [main]
    paths:
      - 'YOUNGEST-BUSINESS-V60-PC-WEB-ONLY-REFRESH-20261125.zip'
      - '.github/workflows/yb-journal-v60.yml'
  workflow_dispatch:

concurrency:
  group: youngest-business-v60-web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-web:
    name: Validate and deploy Web Admin V60 only
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the complete V60 source ZIP and select its root Web Admin
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/YOUNGEST-BUSINESS-V60-PC-WEB-ONLY-REFRESH-20261125.zip"

          test -f "$ZIP" || {
            echo "Complete V60 source ZIP missing"
            exit 1
          }

          unzip -t "$ZIP"

          EXTRACT="$RUNNER_TEMP/yb-v60-web"
          mkdir -p "$EXTRACT"
          unzip -q "$ZIP" -d "$EXTRACT"

          # Use the root-level Firebase project and Web Admin.
          ROOT="$EXTRACT"

          test -s "$ROOT/firebase.json"
          test -s "$ROOT/.firebaserc"
          test -s "$ROOT/web-admin/index.html"
          test -s "$ROOT/web-admin/app.js"

          grep -q '"default"[[:space:]]*:[[:space:]]*"youngestsbusiness"' "$ROOT/.firebaserc"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Web Admin JavaScript
        working-directory: ${{ env.PROJECT_ROOT }}/web-admin
        run: node --check app.js

      - name: Verify Firebase Hosting target
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          grep -q '"public"[[:space:]]*:[[:space:]]*"web-admin"' firebase.json

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Firebase Hosting only
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          firebase deploy \
            --only hosting \
            --project youngestsbusiness \
            --non-interactive
